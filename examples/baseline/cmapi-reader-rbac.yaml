# Source: docs/02-technical-design-v2.md
# Applied to every cluster by the cluster-baseline process, not by cmapi
apiVersion: v1
kind: Namespace
metadata: {name: cmapi-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: cmapi-reader, namespace: cmapi-system}
---
# Existing managed namespaces bind this name to the reader. Keep the reserved role inert.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cmapi-token-issuer}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cmapi-reader}
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, resourcequotas, limitranges, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [""]                      # counted for the delete thresholds (pods > 20, pvcs > 10)
    resources: [pods, persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    verbs: [get, list, watch]
  - apiGroups: [user.openshift.io]
    resources: [users, groups, identities]
    verbs: [get, list, watch]
  - apiGroups: [quota.openshift.io]
    resources: [clusterresourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [redhatcop.redhat.io]
    resources: [groupsyncs, namespaceconfigs, groupconfigs]
    verbs: [get, list]
  - apiGroups: [config.openshift.io]
    resources: [oauths]
    resourceNames: [cluster]
    verbs: [get]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [wgpolicyk8s.io]          # Kyverno policy reports, for the Policies tab
    resources: [policyreports, clusterpolicyreports]
    verbs: [get, list, watch]
  - apiGroups: [policies.kyverno.io]      # CEL policy kinds: readiness and bundle tag
    resources: [validatingpolicies, mutatingpolicies, generatingpolicies, deletingpolicies, imagevalidatingpolicies]
    verbs: [get, list, watch]
  - apiGroups: [kyverno.io]               # legacy ClusterPolicy family, counted separately
    resources: [clusterpolicies, policies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cmapi-reader}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cmapi-reader}
subjects: [{kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}]
---
# The Thanos Querier for the capacity plugin (usage.source thanos, #724): cmapi's own grants, in openshift-monitoring alone, on
# OpenShift 4.18 and later. The Route: capacity/thanos.py reads its host when clusters.yaml has no thanosUrl.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cmapi-reader-thanos-route, namespace: openshift-monitoring}
rules:
  - apiGroups: [route.openshift.io]
    resources: [routes]
    resourceNames: [thanos-querier]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cmapi-reader-thanos-route, namespace: openshift-monitoring}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cmapi-reader-thanos-route}
subjects:
  - {kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}
---
# The query: the Querier's kube-rbac-proxy allows get on prometheuses/api "k8s" in openshift-monitoring, exactly what the
# platform's Role cluster-monitoring-metrics-api grants ("access Thanos Querier API endpoints", OpenShift 4.18 and 4.22). Not
# the ClusterRole cluster-monitoring-view bound cluster-wide, and never a grant to every user that cmapi does not own.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cmapi-reader-metrics-api, namespace: openshift-monitoring}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cluster-monitoring-metrics-api}
subjects:
  - {kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}
---
# The import check of the two grants above (core/registry.py): a LocalSubjectAccessReview in openshift-monitoring, for the
# reader without system:authenticated, so a grant to every user cannot stand in for them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cmapi-reader-grant-check, namespace: openshift-monitoring}
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [localsubjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cmapi-reader-grant-check, namespace: openshift-monitoring}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cmapi-reader-grant-check}
subjects:
  - {kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cmapi-reader-renew, namespace: cmapi-system}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [cmapi-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cmapi-reader-renew, namespace: cmapi-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cmapi-reader-renew}
subjects:
  - {kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}
