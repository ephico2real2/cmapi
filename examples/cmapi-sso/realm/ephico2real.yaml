# Source: docs/02-technical-design-v2.md
# cmapi-sso/realm/ephico2real.yaml (keycloak-config-cli), session settings
realm: ephico2real
accessTokenLifespan: 300                     # 5 minutes, every client
ssoSessionIdleTimeout: 28800                 # 8 hours
ssoSessionMaxLifespan: 43200                 # 12 hours
rememberMe: true
ssoSessionIdleTimeoutRememberMe: 604800      # 7 days
ssoSessionMaxLifespanRememberMe: 2592000     # 30 days
offlineSessionIdleTimeout: 2592000           # 30 days
offlineSessionMaxLifespanEnabled: true
offlineSessionMaxLifespan: 7776000           # 90 days
revokeRefreshToken: true
refreshTokenMaxReuse: 0
clients:
  - clientId: cmapi-docs
    attributes:
      client.session.idle.timeout: "3600"    # 1 hour
      client.session.max.lifespan: "28800"   # 8 hours
  - clientId: cmapi-cli
    optionalClientScopes: [offline_access]
    attributes:
      oauth2.device.authorization.grant.enabled: "true"
  - clientId: cmapi-automation                 # an AI agent or a script: client credentials, by its service account
    publicClient: false                        # no client takes the password grant (RFC 9700, section 2.4; #181)
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true

# Identity additions (docs/02-technical-design-v2.md, "Identity claims")
components:
  org.keycloak.storage.ldap.mappers.LDAPStorageMapper:   # under the LDAP provider
    - name: employee-id
      providerId: user-attribute-ldap-mapper
      config:
        ldap.attribute: [employeeNumber]       # employeeID in Active Directory
        user.model.attribute: [employeeId]
        read.only: ["true"]
        always.read.value.from.ldap: ["true"]
    - name: middle-name
      providerId: user-attribute-ldap-mapper
      config:
        ldap.attribute: [middleName]
        user.model.attribute: [middleName]
        read.only: ["true"]
userProfile:                                    # declared, or Keycloak 24+ drops them
  attributes:
    - name: employeeId
      permissions: {view: [admin], edit: []}
    - name: middleName
      permissions: {view: [admin, user], edit: []}
clientScopes:
  - name: cmapi-identity
    protocol: openid-connect
    protocolMappers:
      - name: employee_id
        protocolMapper: oidc-usermodel-attribute-mapper
        config: {user.attribute: employeeId, claim.name: employee_id, access.token.claim: "true", id.token.claim: "false", jsonType.label: String}
      - name: middle_name
        protocolMapper: oidc-usermodel-attribute-mapper
        config: {user.attribute: middleName, claim.name: middle_name, access.token.claim: "true", id.token.claim: "true", jsonType.label: String}
# each instance client (cmapi-nonprod, cmapi-staging, cmapi-prod) lists cmapi-identity in defaultClientScopes;
# the directory's admin client cmapi-directory holds realm-management view-users and query-users only

# Access additions: roles gate the API (config/authz-roles.yaml); no team or namespace-name scoping.
# The built-in client roles exist on every instance client; cmapi-onboarding may create namespaces only.
roles:
  client:
    cmapi-nonprod: &cmapi-roles
      - {name: cmapi-viewer}
      - {name: cmapi-onboarding, description: "Create namespaces only. For people and automation clients"}
      - {name: cmapi-requester}
      - {name: cmapi-approver}
      - {name: cmapi-operator}
      - {name: cmapi-admin}
      - {name: cmapi-auditor}
      - {name: cmapi-approval-relay}
    cmapi-staging: *cmapi-roles
    cmapi-prod: *cmapi-roles
groups:
  - name: cmapi
    subGroups:
      - name: app-cmapi-rbac-onboarding             # members may create namespaces on every instance
        clientRoles: {cmapi-nonprod: [cmapi-onboarding], cmapi-staging: [cmapi-onboarding], cmapi-prod: [cmapi-onboarding]}
      - name: app-cmapi-rbac-requester
        clientRoles: {cmapi-nonprod: [cmapi-requester], cmapi-staging: [cmapi-requester], cmapi-prod: [cmapi-requester]}
# The service account of the automation client, for an AI agent or a script. It needs no employee ID because
# it is a service client, and it holds an automation role (instance.yaml identity.automationRoles). The client
# secret lives in a vault, never in this file. Give it cmapi-onboarding only on the instances where it may onboard.
users:
  - username: service-account-cmapi-automation
    enabled: true
    serviceAccountClientId: cmapi-automation
    clientRoles: {cmapi-nonprod: [cmapi-onboarding]}
