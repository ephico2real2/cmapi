# examples/instances/nonprod/authz-scopes.yaml: deployed as config/authz-scopes.yaml on the nonprod instance (rnd, dev)
bindings:
  - group: /cmapi/cmapi-payments-requesters
    role: cmapi-requester
    team: payments                       # value allowed in cmapi.net/team
    clusters: [OCP_GF6, OCP_GF8, OCP_GF15]
    environments: [rnd, dev]
    namespaces: ["payments-*"]
  - group: /cmapi/cmapi-payments-viewers
    role: cmapi-viewer
    clusters: ["*"]
    environments: ["*"]                  # "*" means this instance's allowedEnvironments
    namespaces: ["payments-*"]
  - group: /cmapi/cmapi-platform-leads
    role: cmapi-approver                 # rnd/dev creates beyond the baseline policy, deletes, thresholds
    clusters: ["*"]
    environments: ["*"]
    namespaces: ["*"]
  - group: /cmapi/cmapi-platform-operators
    role: cmapi-operator
    clusters: ["*"]
    environments: ["*"]
    namespaces: ["*"]
  - client: svc-payments-ci              # the pipeline's own Keycloak client
    role: cmapi-requester
    team: payments
    clusters: [OCP_GF6, OCP_GF8, OCP_GF15]
    environments: [rnd, dev]
    namespaces: ["payments-*"]
    owners: [/cmapi/cmapi-payments-requesters]   # owners may not approve what this client asks for
