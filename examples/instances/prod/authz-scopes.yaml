# examples/instances/prod/authz-scopes.yaml: deployed as config/authz-scopes.yaml on the prod instance (prod)
bindings:
  - group: /cmapi/cmapi-payments-requesters
    role: cmapi-requester
    team: payments
    clusters: [OCP_GF1, OCP_GF2, OCP_GF5]
    environments: [prod]
    namespaces: ["payments-*"]
  - group: /cmapi/cmapi-prod-approvers
    role: cmapi-approver
    clusters: ["*"]
    environments: [prod]
    namespaces: ["*"]
  - group: /cmapi/cmapi-platform-leads
    role: cmapi-approver                 # thresholds and critical-* patterns add platform-leads
    clusters: ["*"]
    environments: [prod]
    namespaces: ["*"]
  - group: /cmapi/cmapi-platform-operators
    role: cmapi-operator
    clusters: ["*"]
    environments: [prod]
    namespaces: ["*"]
  # Approval channel relays (for example ServiceNow) get the approvals:relay permission only.
  # They call :approve naming the person, who must be eligible on their own; both are recorded.
  - client: svc-servicenow-cmapi
    role: cmapi-approval-relay
    clusters: ["*"]
    environments: [prod]
    namespaces: ["*"]
