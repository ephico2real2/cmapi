# Kyverno CEL policy run by the local CI on every rendered Namespace: the governed keys cmapi requires.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-team-metadata
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  validations:
    - expression: >-
        has(object.metadata.labels) && 'cmapi.net/team' in object.metadata.labels &&
        'cmapi.net/cluster-id' in object.metadata.labels &&
        has(object.metadata.annotations) && 'cmapi.net/team-dl' in object.metadata.annotations
      message: Managed namespaces carry cmapi.net/team, cmapi.net/cluster-id and cmapi.net/team-dl.
