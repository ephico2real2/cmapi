# Source: docs/01-design-and-architecture.md, "Namespace expiration"
# config/expiration.yaml: per instance, keys only for its allowedEnvironments. prod has no entry:
# a prod request with any expiry field gets 422 expiration-not-allowed, and policies/env/prod
# denies the keys at admission.
defaults:
  allowedAtCreate: true          # optional; leaving expiresAt out creates a permanent namespace
  maxExtensionDays: 30           # each :extend adds at most this many days
  maxLifetimeDays: 180           # from creation; past it, or :makePermanent, adds platform-leads
  notifyDaysBefore: [14, 7, 1]   # Notifier to cmapi.net/owner and the team
  graceDays: 7                   # still running and extendable after the date
  deleteAfterGrace: true         # expire_check opens a delete request (expired-namespace policy)
  minNoticesBeforeDelete: 2
environments:
  rnd: {}
  dev: {}
  qa: {}
  uat: {}
  # prod: never — not configurable
