# Source: docs/01-design-and-architecture.md, "What cmapi writes to Git"
# config/tiers.yaml: what the raw manifest renderer writes for each tier.
# Replaces namespace-configuration-operator's quota and LimitRange NamespaceConfigs.
# Changing a value changes no namespace by itself: run the tiers:rerender operation, which opens
# one request per affected namespace, in batches, through the normal approval rules.
tiers:
  small:
    quota:  {requests.cpu: "8",  requests.memory: 16Gi, pods: "50"}
    limits: {defaultRequest: {cpu: 100m, memory: 256Mi}, default: {cpu: 500m, memory: 512Mi}, max: {cpu: "2", memory: 4Gi}}
  medium:
    quota:  {requests.cpu: "16", requests.memory: 32Gi, pods: "100"}
    limits: {defaultRequest: {cpu: 100m, memory: 256Mi}, default: {cpu: 500m, memory: 512Mi}, max: {cpu: "4", memory: 8Gi}}
  large:
    quota:  {requests.cpu: "32", requests.memory: 64Gi, pods: "200"}
    limits: {defaultRequest: {cpu: 250m, memory: 512Mi}, default: {cpu: "1", memory: 1Gi}, max: {cpu: "8", memory: 16Gi}}
  custom:
    limits: {defaultRequest: {cpu: 100m, memory: 256Mi}, default: {cpu: 500m, memory: 512Mi}}
    # quota comes from the approved request
overrides:                     # per environment, optional; merged over the tier
  prod:
    medium: {limits: {max: {cpu: "8", memory: 16Gi}}}
# Each instance's file holds only its allowedEnvironments' overrides.
