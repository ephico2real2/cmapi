apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-expiry-in-prod
  annotations:
    policies.kyverno.io/description: Production namespaces never carry expiration metadata.
    cmapi.net/generated: 'true'
spec:
  validationActions:
  - Deny
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - namespaces
  variables:
  - name: update
    expression: request.operation == 'UPDATE' && has(oldObject.metadata)
  validations:
  - expression: '!("cmapi.net/expires-at" in (has(object.metadata.annotations) ? object.metadata.annotations : {}))'
    messageExpression: '''Production namespaces never expire: remove cmapi.net/expires-at, cmapi.net/expiry and cleanup.kyverno.io/ttl.'''
  - expression: '!("cmapi.net/expiry" in (has(object.metadata.labels) ? object.metadata.labels : {}))'
    messageExpression: '''Production namespaces never expire: remove cmapi.net/expires-at, cmapi.net/expiry and cleanup.kyverno.io/ttl.'''
  - expression: '!("cleanup.kyverno.io/ttl" in (has(object.metadata.labels) ? object.metadata.labels : {}))'
    messageExpression: '''Production namespaces never expire: remove cmapi.net/expires-at, cmapi.net/expiry and cleanup.kyverno.io/ttl.'''
