t(2, minmax(0, 1fr)); gap: 14px 22px; }\n@media (max-width: 1100px) { .sysgrid { grid-template-columns: minmax(0, 1fr); } }\n@media (max-width: 820px) { .dbgrid { grid-template-columns: minmax(0, 1fr); } }\n.codebox { background: #f6f7fa; border: 1px solid #dde2ea; border-radius: 8px; padding: 10px 12px; font-family: \"JetBrains Mono\", ui-monospace, monospace; font-size: 0.76rem; white-space: pre; overflow-x: auto; margin: 0; }\n@media (max-width: 1100px) {\n  .qgrid { grid-template-columns: minmax(0, 1fr); }\n  .wmain { grid-template-columns: 240px minmax(0, 1fr); }\n  .state { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }\n  .nsgrid, .apprgrid { grid-template-columns: minmax(0, 1fr); }\n}\n@media (max-width: 820px) {\n  .wmain, .state, .panels, .capgrid { grid-template-columns: minmax(0, 1fr); }\n  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .stats, .row2 { grid-template-columns: minmax(0, 1fr); }\n  .steps { order: 2; }\n}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv>\n  \u003cheader class=\"topbar\">\n    \u003cdiv class=\"topbar-in\">\n      \u003cdiv class=\"brand\">\n        \u003cdiv class=\"brand-mark\" aria-hidden=\"true\">cm\u003c/div>\n        \u003cdiv>\u003cb>cmapi\u003c/b> \u003cspan>Cluster Management Portal\u003c/span>\u003c/div>\n        \u003cspan class=\"instbadge\">{{inst.label}} · {{inst.envs}}\u003c/span>\n      \u003c/div>\n      \u003cnav class=\"tabs\" aria-label=\"Portal sections\">\n        \u003csc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"5\">\n          \u003cbutton type=\"button\" class=\"tab {{t.cls}}\" aria-current=\"{{t.current}}\" onClick=\"{{t.pick}}\">{{t.label}}\u003csc-if value=\"{{t.hasCount}}\" hint-placeholder-val=\"{{false}}\">\u003cspan class=\"count\">{{t.count}}\u003c/span>\u003c/sc-if>\u003c/button>\n        \u003c/sc-for>\n      \u003c/nav>\n      \u003cdiv class=\"who\">\n        \u003ca class=\"doclink\" href=\"{{inst.api}}/docs\">Swagger\u003c/a>\n        \u003ca class=\"doclink\" href=\"{{inst.api}}/redoc\">ReDoc\u003c/a>\n        \u003cdiv class=\"avatar\" aria-hidden=\"true\">O\u003c/div>\n        \u003cdiv>\u003cb>ola\u003c/b>\u003cspan>cmapi-requester · cmapi-approver (Keycloak roles)\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"instbar\">\n    \u003cdiv class=\"instbar-in\">\n      \u003cspan class=\"muted\" style=\"font-size: 0.82rem\">Mockup only: each instance is a separate deployment at its own URL. Switch to see what each one serves.\u003c/span>\n      \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Instance\">\n        \u003csc-for list=\"{{instOpts}}\" as=\"o\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" class=\"segbtn {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">\u003cb>{{o.label}}\u003c/b>\u003cspan>{{o.sub}}\u003c/span>\u003c/button>\u003c/sc-for>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cmain class=\"wrap\">\n\n    \u003csc-if value=\"{{isWorkflow}}\" hint-placeholder-val=\"{{true}}\">\n      \u003cdiv style=\"display: grid; gap: 18px\">\n        \u003cdiv class=\"head\">\n          \u003cdiv>\n            \u003ch1>Request workflow\u003c/h1>\n            \u003cp class=\"lede\">Follow a request from the caller's Keycloak token through cmapi, placement on stored capacity snapshots, the cluster-configs pull request and the destination cluster's own Argo CD. Pick a scenario, then step through.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"controls\" aria-label=\"Playback\">\n            \u003cbutton type=\"button\" class=\"btn\" onClick=\"{{wfReset}}\">Reset\u003c/button>\n            \u003cbutton type=\"button\" class=\"btn\" onClick=\"{{wfBack}}\" disabled=\"{{wf.atStart}}\">Back\u003c/button>\n            \u003cbutton type=\"button\" class=\"btn primary\" onClick=\"{{wfNext}}\" disabled=\"{{wf.atEnd}}\">Next step\u003c/button>\n            \u003cbutton type=\"button\" class=\"btn\" onClick=\"{{wfPlay}}\" aria-pressed=\"{{wf.playing}}\">{{wf.playLabel}}\u003c/button>\n            \u003cspan class=\"counter\" aria-live=\"polite\">{{wf.counter}}\u003c/span>\n          \u003c/div>\n        \u003c/div>\n\n        \u003csc-if value=\"{{wf.banner.show}}\" hint-placeholder-val=\"{{false}}\">\n          \u003cdiv class=\"callout {{wf.banner.tone}}\" style=\"grid-template-columns: minmax(0, 1fr) auto; align-items: center\">\n            \u003cspan>\u003cb>Current position.\u003c/b> {{wf.banner.text}}\u003c/span>\n            \u003csc-if value=\"{{wf.banner.backShow}}\" hint-placeholder-val=\"{{false}}\">\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{wf.banner.back}}\">Back to current step\u003c/button>\u003c/sc-if>\n          \u003c/div>\n        \u003c/sc-if>\n\n        \u003cnav class=\"scenarios\" aria-label=\"Scenarios\">\n          \u003csc-for list=\"{{wf.scenarios}}\" as=\"sc\" hint-placeholder-count=\"5\">\n            \u003cbutton type=\"button\" class=\"scn {{sc.cls}}\" aria-pressed=\"{{sc.on}}\" onClick=\"{{sc.pick}}\">\u003cb>{{sc.label}}\u003c/b>\u003cspan>{{sc.meta}}\u003c/span>\u003c/button>\n          \u003c/sc-for>\n        \u003c/nav>\n\n        \u003csection class=\"strip\" aria-label=\"Systems involved\">\n          \u003csc-for list=\"{{wf.nodes}}\" as=\"n\" hint-placeholder-count=\"6\">\n            \u003cdiv class=\"node {{n.cls}}\" style=\"border-color: {{n.border}}\">\n              \u003cdiv class=\"k\">\u003cspan class=\"dot\" style=\"background: {{n.color}}\">\u003c/span>{{n.name}}\u003c/div>\n              \u003cdiv class=\"sub\">{{n.sub}}\u003c/div>\n              \u003cdiv class=\"st\">{{n.st}}\u003c/div>\n            \u003c/div>\n          \u003c/sc-for>\n        \u003c/section>\n\n        \u003csection class=\"wmain\">\n          \u003cdiv class=\"card steps\">\n            \u003ch3 class=\"lbl\">Steps\u003c/h3>\n            \u003col>\n              \u003csc-for list=\"{{wf.steps}}\" as=\"s\" hint-placeholder-count=\"10\">\n                \u003cli>\u003cbutton type=\"button\" class=\"stepbtn {{s.cls}}\" aria-current=\"{{s.current}}\" onClick=\"{{s.pick}}\">\u003cspan class=\"n\">{{s.n}}\u003c/span>\u003cspan>\u003cspan class=\"lt\" style=\"color: {{s.color}}\">{{s.lane}}\u003c/span>{{s.title}}\u003csc-if value=\"{{s.isPos}}\" hint-placeholder-val=\"{{false}}\"> \u003cspan class=\"pospill\">current position\u003c/span>\u003c/sc-if>\u003c/span>\u003c/button>\u003c/li>\n              \u003c/sc-for>\n            \u003c/ol>\n          \u003c/div>\n\n          \u003carticle class=\"card detail\" aria-live=\"polite\">\n            \u003cdiv class=\"eyebrow\" style=\"color: {{wf.detail.color}}\">{{wf.detail.eyebrow}}\u003c/div>\n            \u003ch2>{{wf.detail.title}}\u003c/h2>\n            \u003cp class=\"body\">\u003csc-for list=\"{{wf.detail.runs}}\" as=\"r\" hint-placeholder-count=\"3\">\u003csc-if value=\"{{r.p}}\" hint-placeholder-val=\"{{true}}\">{{r.t}}\u003c/sc-if>\u003csc-if value=\"{{r.b}}\" hint-placeholder-val=\"{{false}}\">\u003cb>{{r.t}}\u003c/b>\u003c/sc-if>\u003csc-if value=\"{{r.c}}\" hint-placeholder-val=\"{{false}}\">\u003ccode>{{r.t}}\u003c/code>\u003c/sc-if>\u003c/sc-for>\u003c/p>\n            \u003csc-if value=\"{{wf.detail.hasChecks}}\" hint-placeholder-val=\"{{true}}\">\n              \u003cul class=\"checks\">\n                \u003csc-for list=\"{{wf.detail.checks}}\" as=\"c\" hint-placeholder-count=\"3\">\n                  \u003cli>\u003cspan class=\"mark {{c.s}}\" aria-label=\"{{c.s}}\">{{c.mark}}\u003c/span>\u003cspan>{{c.l}}\u003cspan class=\"note\">{{c.n}}\u003c/span>\u003c/span>\u003c/li>\n                \u003c/sc-for>\n              \u003c/ul>\n            \u003c/sc-if>\n            \u003csc-if value=\"{{wf.detail.hasCode}}\" hint-placeholder-val=\"{{true}}\">\n              \u003cdiv class=\"codebox\">\n                \u003cdiv class=\"clbl\">{{wf.detail.codeLabel}}\u003c/div>\n                \u003cdiv class=\"cbody\">\u003csc-for list=\"{{wf.detail.lines}}\" as=\"l\" hint-placeholder-count=\"6\">\u003cdiv class=\"ln {{l.cls}}\">{{l.t}}\u003c/div>\u003c/sc-for>\u003c/div>\n              \u003c/div>\n            \u003c/sc-if>\n          \u003c/article>\n\n          \u003cdiv class=\"state\">\n            \u003cdiv class=\"card\">\n              \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">{{wf.reqHead}}\u003c/h3>\u003cspan class=\"pill {{wf.reqPill.tone}}\">{{wf.reqPill.t}}\u003c/span>\u003c/div>\n              \u003cdl class=\"kv\">\n                \u003csc-for list=\"{{wf.reqRows}}\" as=\"kv\" hint-placeholder-count=\"6\">\u003cdt>{{kv.k}}\u003c/dt>\u003cdd>{{kv.v}}\u003c/dd>\u003c/sc-for>\n              \u003c/dl>\n            \u003c/div>\n            \u003cdiv class=\"card\">\n              \u003ch3 class=\"lbl\">Events\u003c/h3>\n              \u003csc-if value=\"{{wf.noEvents}}\" hint-placeholder-val=\"{{false}}\">\u003cp class=\"empty\">No events yet.\u003c/p>\u003c/sc-if>\n              \u003col class=\"events\">\n                \u003csc-for list=\"{{wf.events}}\" as=\"e\" hint-placeholder-count=\"3\">\n                  \u003cli>\u003ctime>{{e.time}}\u003c/time>\u003cdiv>\u003cdiv class=\"ty {{e.tone}}\">{{e.type}} \u003cspan class=\"muted\">· {{e.actor}}\u003c/span>\u003c/div>\u003cdiv class=\"muted\">{{e.msg}}\u003c/div>\u003c/div>\u003c/li>\n                \u003c/sc-for>\n              \u003c/ol>\n            \u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"panels\">\n          \u003cdiv class=\"card wide\">\n            \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">Capacity · cmapi-capacity\u003c/h3>\u003cspan class=\"pill {{wf.cap.tone}}\">{{wf.cap.pill}}\u003c/span>\u003c/div>\n            \u003csc-if value=\"{{wf.cap.has}}\" hint-placeholder-val=\"{{true}}\">\n              \u003cdiv class=\"ptitle\">{{wf.cap.title}}\u003c/div>\n              \u003cdiv class=\"meta\">{{wf.cap.meta}}\u003c/div>\n              \u003cdiv class=\"tablebox\">\n                \u003ctable class=\"res\">\n                  \u003cthead>\u003ctr>\u003csc-for list=\"{{wf.cap.cols}}\" as=\"col\" hint-placeholder-count=\"4\">\u003cth>{{col}}\u003c/th>\u003c/sc-for>\u003c/tr>\u003c/thead>\n                  \u003ctbody>\n                    \u003csc-for list=\"{{wf.cap.rows}}\" as=\"row\" hint-placeholder-count=\"3\">\n                      \u003ctr>\u003csc-for list=\"{{row}}\" as=\"cell\" hint-placeholder-count=\"4\">\u003ctd>\u003csc-if value=\"{{cell.pill}}\" hint-placeholder-val=\"{{false}}\">\u003cspan class=\"pill {{cell.tone}}\">{{cell.t}}\u003c/span>\u003c/sc-if>\u003csc-if value=\"{{cell.plain}}\" hint-placeholder-val=\"{{true}}\">{{cell.t}}\u003c/sc-if>\u003c/td>\u003c/sc-for>\u003c/tr>\n                    \u003c/sc-for>\n                  \u003c/tbody>\n                \u003c/table>\n              \u003c/div>\n            \u003c/sc-if>\n            \u003cp class=\"foot\">{{wf.cap.note}}\u003c/p>\n          \u003c/div>\n\n          \u003cdiv class=\"card\">\n            \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">Pull request · Git\u003c/h3>\u003cspan class=\"pill {{wf.pr.tone}}\">{{wf.pr.pill}}\u003c/span>\u003c/div>\n            \u003csc-if value=\"{{wf.pr.has}}\" hint-placeholder-val=\"{{true}}\">\n              \u003cdiv class=\"ptitle\">{{wf.pr.title}}\u003c/div>\n              \u003cdiv class=\"meta\">{{wf.pr.meta}}\u003c/div>\n              \u003cul class=\"files\">\n                \u003csc-for list=\"{{wf.pr.files}}\" as=\"f\" hint-placeholder-count=\"1\">\u003cli>\u003cspan>{{f.path}}\u003c/span>\u003cspan>\u003cspan class=\"ad\">+{{f.add}}\u003c/span> \u003cspan class=\"dl\">−{{f.del}}\u003c/span>\u003c/span>\u003c/li>\u003c/sc-for>\n              \u003c/ul>\n              \u003cul class=\"checks\">\n                \u003csc-for list=\"{{wf.pr.checks}}\" as=\"c\" hint-placeholder-count=\"3\">\u003cli>\u003cspan class=\"mark {{c.s}}\">{{c.mark}}\u003c/span>\u003cspan>{{c.n}}\u003cspan class=\"note\">{{c.note}}\u003c/span>\u003c/span>\u003c/li>\u003c/sc-for>\n              \u003c/ul>\n              \u003cdiv class=\"chips\">\n                \u003csc-for list=\"{{wf.pr.reviewers}}\" as=\"r\" hint-placeholder-count=\"1\">\u003cspan class=\"pill {{r.tone}}\">{{r.t}}\u003c/span>\u003c/sc-for>\n              \u003c/div>\n            \u003c/sc-if>\n            \u003csc-if value=\"{{wf.pr.none}}\" hint-placeholder-val=\"{{false}}\">\u003cp class=\"empty\">{{wf.pr.msg}}\u003c/p>\u003c/sc-if>\n          \u003c/div>\n\n          \u003cdiv class=\"card\">\n            \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">Argo CD · {{wf.argo.cluster}}\u003c/h3>\u003cspan class=\"chips\">\u003cspan class=\"pill {{wf.argo.syncTone}}\">{{wf.argo.sync}}\u003c/span>\u003cspan class=\"pill {{wf.argo.healthTone}}\">{{wf.argo.health}}\u003c/span>\u003c/span>\u003c/div>\n            \u003cdiv class=\"ptitle\">{{wf.argo.app}}\u003c/div>\n            \u003cdiv class=\"meta\">{{wf.argo.meta}}\u003c/div>\n            \u003csc-if value=\"{{wf.argo.blocked}}\" hint-placeholder-val=\"{{false}}\">\u003cp class=\"empty\">Not reached. The live objects below are unchanged.\u003c/p>\u003c/sc-if>\n            \u003csc-if value=\"{{wf.argo.empty}}\" hint-placeholder-val=\"{{false}}\">\u003cp class=\"empty\">{{wf.argo.note}}\u003c/p>\u003c/sc-if>\n            \u003csc-if value=\"{{wf.argo.hasRes}}\" hint-placeholder-val=\"{{true}}\">\n              \u003cdiv class=\"tablebox\">\n                \u003ctable class=\"res\">\n                  \u003cthead>\u003ctr>\u003cth>Wave\u003c/th>\u003cth>Kind\u003c/th>\u003cth>Name\u003c/th>\u003cth>Applied by\u003c/th>\u003cth>Status\u003c/th>\u003cth>Detail\u003c/th>\u003c/tr>\u003c/thead>\n                  \u003ctbody>\n                    \u003csc-for list=\"{{wf.argo.resources}}\" as=\"r\" hint-placeholder-count=\"3\">\u003ctr>\u003ctd>{{r.wave}}\u003c/td>\u003ctd>{{r.kind}}\u003c/td>\u003ctd>{{r.name}}\u003c/td>\u003ctd>{{r.by}}\u003c/td>\u003ctd>\u003cspan class=\"pill {{r.tone}}\">{{r.st}}\u003c/span>\u003c/td>\u003ctd class=\"muted\">{{r.ch}}\u003c/td>\u003c/tr>\u003c/sc-for>\n                  \u003c/tbody>\n                \u003c/table>\n              \u003c/div>\n            \u003c/sc-if>\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isNew}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: grid; gap: 18px\">\n        \u003cdiv class=\"head\">\n          \u003cdiv>\n            \u003ch1>New namespace\u003c/h1>\n            \u003cp class=\"lede\">Describe what you need. cmapi picks the cluster from stored capacity snapshots, shows the approval that will apply, and turns the request into a pull request.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"nsgrid\">\n          \u003cform class=\"card\" onSubmit=\"{{nsSubmit}}\" style=\"gap: 18px\">\n            \u003cdiv class=\"field\">\n              \u003cspan class=\"flabel\">Environment\u003c/span>\n              \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Environment\">\n                \u003csc-for list=\"{{envOpts}}\" as=\"o\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" class=\"segbtn {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">\u003cb>{{o.label}}\u003c/b>\u003c/button>\u003c/sc-for>\n              \u003c/div>\n              \u003cspan class=\"hint\">This is the {{inst.display}} portal: it serves {{inst.envs}} only.\u003c/span>\n              \u003cdiv class=\"elsewhere\">\n                \u003csc-for list=\"{{elsewhere}}\" as=\"x\" hint-placeholder-count=\"2\">\u003cspan>{{x.envs}} → \u003ca href=\"{{x.href}}\">{{x.label}}\u003c/a>\u003c/span>\u003c/sc-for>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"row2\">\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"ns-team\">Team\u003c/label>\n                \u003cinput id=\"ns-team\" class=\"mono\" value=\"{{form.team}}\" onChange=\"{{onTeam}}\">\n                \u003cspan class=\"hint\">Who owns it, for cost and notices: any team name. Not checked against who you are; your Keycloak roles decide what you may do.\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"ns-region\">Region\u003c/label>\n                \u003cselect id=\"ns-region\" value=\"{{form.region}}\" onChange=\"{{onRegion}}\">\n                  \u003coption value=\"us-central\">us-central\u003c/option>\n                  \u003coption value=\"any\">Any region\u003c/option>\n                \u003c/select>\n                \u003cspan class=\"hint\">From clusters.yaml metadata.\u003c/span>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"ns-name\">Namespace name\u003c/label>\n              \u003cinput id=\"ns-name\" class=\"mono\" value=\"{{nsName}}\" onChange=\"{{onName}}\">\n              \u003cspan class=\"hint\">Any DNS-1123 name. Not allowed: reserved names (default, openshift-*, kube-*, cmapi-system, ocp-*) and a name already on the cluster outside cmapi.\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003cspan class=\"flabel\">Tier\u003c/span>\n              \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Tier\">\n                \u003csc-for list=\"{{tierOpts}}\" as=\"o\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" class=\"segbtn {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">\u003cb>{{o.label}}\u003c/b>\u003cspan>{{o.sub}}\u003c/span>\u003c/button>\u003c/sc-for>\n              \u003c/div>\n              \u003cspan class=\"hint\">cmapi writes the tier's ResourceQuota and LimitRange (config/tiers.yaml) into the namespace folder.\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"row2\">\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"ns-dl\">Team DL (required)\u003c/label>\n                \u003cinput id=\"ns-dl\" type=\"email\" value=\"payments-team@ephico2real.com\">\n                \u003cspan class=\"hint\">Your team's distribution list, in one of the organisation's email domains (emailDomains); format only. Requested by ola (ola@ephico2real.com), from your sign-in.\u003c/span>\n              \u003c/div>\n              \u003cdiv class=\"field\">\n                \u003csc-if value=\"{{nsExp.allowed}}\" hint-placeholder-val=\"{{true}}\">\n                  \u003clabel for=\"ns-exp\">Expires (optional)\u003c/label>\n                  \u003cinput id=\"ns-exp\" type=\"date\" min=\"2026-11-04\" max=\"{{nsExp.max}}\" value=\"{{nsExp.value}}\" onChange=\"{{nsExp.onDate}}\">\n                  \u003cspan class=\"hint\">{{nsExp.hint}}\u003c/span>\n                \u003c/sc-if>\n                \u003csc-if value=\"{{nsExp.prod}}\" hint-placeholder-val=\"{{false}}\">\n                  \u003cspan class=\"flabel\">Expires\u003c/span>\n                  \u003cspan class=\"hint\">Never. Production namespaces cannot carry expiration metadata: refused at validation and by the deny-expiry-in-prod policy.\u003c/span>\n                \u003c/sc-if>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"field\">\n              \u003clabel for=\"ns-why\">Justification\u003c/label>\n              \u003ctextarea id=\"ns-why\">Payments service namespace for the settlement API.\u003c/textarea>\n            \u003c/div>\n            \u003csc-if value=\"{{dry.show}}\" hint-placeholder-val=\"{{false}}\">\n              \u003cdiv class=\"callout info\">\n                \u003cb>Dry run passed · nothing written\u003c/b>\n                \u003cul class=\"checks\">\n                  \u003csc-for list=\"{{dry.checks}}\" as=\"c\" hint-placeholder-count=\"4\">\u003cli>\u003cspan class=\"mark {{c.s}}\">{{c.mark}}\u003c/span>\u003cspan>{{c.l}}\u003cspan class=\"note\">{{c.n}}\u003c/span>\u003c/span>\u003c/li>\u003c/sc-for>\n                \u003c/ul>\n              \u003c/div>\n            \u003c/sc-if>\n            \u003cdiv class=\"actions\">\n              \u003cbutton type=\"button\" class=\"btn\" onClick=\"{{nsDry}}\">Dry run\u003c/button>\n              \u003cbutton type=\"submit\" class=\"btn primary\">Submit request\u003c/button>\n            \u003c/div>\n          \u003c/form>\n\n          \u003cdiv style=\"display: grid; gap: 18px; min-width: 0\">\n            \u003cdiv class=\"card\">\n              \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">Placement preview\u003c/h3>\u003cspan class=\"pill\">{{place.asOf}}\u003c/span>\u003c/div>\n              \u003cp class=\"muted\" style=\"font-size: 0.86rem\">{{place.lede}}\u003c/p>\n              \u003csc-for list=\"{{place.ranked}}\" as=\"p\" hint-placeholder-count=\"2\">\n                \u003cdiv class=\"place {{p.cls}}\">\n                  \u003cspan class=\"rank\">{{p.rank}}\u003c/span>\n                  \u003cdiv style=\"min-width: 0\">\u003cb>{{p.cluster}}\u003c/b>\u003cdiv class=\"meta\">{{p.detail}}\u003c/div>\u003c/div>\n                  \u003cspan class=\"score\">{{p.score}}\u003c/span>\n                \u003c/div>\n              \u003c/sc-for>\n              \u003csc-for list=\"{{place.excluded}}\" as=\"p\" hint-placeholder-count=\"1\">\n                \u003cdiv class=\"place out\">\n                  \u003cspan class=\"rank\">—\u003c/span>\n                  \u003cdiv style=\"min-width: 0\">\u003cb>{{p.cluster}}\u003c/b>\u003cdiv class=\"meta\">{{p.detail}}\u003c/div>\u003c/div>\n                  \u003cspan class=\"pill warn\">{{p.reason}}\u003c/span>\n                \u003c/div>\n              \u003c/sc-for>\n            \u003c/div>\n            \u003cdiv class=\"card\">\n              \u003ch3 class=\"lbl\">Approval that will apply\u003c/h3>\n              \u003cdiv class=\"callout {{appr.tone}}\">\u003cb>{{appr.title}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{appr.detail}}\u003c/span>\u003c/div>\n              \u003cdl class=\"kv\">\n                \u003cdt>Rule\u003c/dt>\u003cdd>{{appr.rule}}\u003c/dd>\n                \u003cdt>Quota\u003c/dt>\u003cdd>{{appr.quota}}\u003c/dd>\n                \u003cdt>Expires\u003c/dt>\u003cdd>{{appr.expires}}\u003c/dd>\n                \u003cdt>Lands in Git\u003c/dt>\u003cdd>{{appr.path}}\u003c/dd>\n              \u003c/dl>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isQuotas}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: grid; gap: 18px\">\n        \u003cdiv class=\"head\">\n          \u003cdiv>\n            \u003ch1>Quotas\u003c/h1>\n            \u003cp class=\"lede\">The ResourceQuota of every namespace in the environments your roles cover on the {{inst.label}} instance, read live from cmapi's watch cache of each cluster. Used is what pods have requested, not what they consume; real usage is read from Thanos only when you plan a change.\u003c/p>\n          \u003c/div>\n          \u003cspan class=\"pill\">{{qHead}}\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card qtools\">\n          \u003cdiv class=\"attn\">\n            \u003cspan class=\"flabel\">Needs attention\u003c/span>\n            \u003csc-for list=\"{{qAttn}}\" as=\"a\" hint-placeholder-count=\"6\">\u003cbutton type=\"button\" class=\"chip {{a.cls}}\" aria-pressed=\"{{a.on}}\" onClick=\"{{a.pick}}\">{{a.label}} \u003cb>{{a.n}}\u003c/b>\u003c/button>\u003c/sc-for>\n          \u003c/div>\n          \u003cform class=\"searchrow\" role=\"search\" onSubmit=\"{{qSug.go}}\">\n            \u003cdiv class=\"combo\">\n              \u003cinput id=\"q-search\" type=\"search\" autocomplete=\"off\" role=\"combobox\" aria-label=\"Find a namespace, team or app\" aria-autocomplete=\"list\" aria-controls=\"q-sug\" aria-expanded=\"{{qSug.expanded}}\" aria-activedescendant=\"{{qSug.active}}\" placeholder=\"Find a namespace, team or app (type 2+ characters)\" value=\"{{qSug.text}}\" onChange=\"{{qSug.onType}}\" onKeyDown=\"{{qSug.onKey}}\">\n              \u003csc-if value=\"{{qSug.open}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cul class=\"sugg\" id=\"q-sug\" role=\"listbox\">\n                  \u003csc-for list=\"{{qSug.items}}\" as=\"s\" hint-placeholder-count=\"5\">\u003cli role=\"option\" id=\"{{s.id}}\" class=\"{{s.cls}}\" aria-selected=\"{{s.sel}}\">\u003cbutton type=\"button\" tabindex=\"-1\" onClick=\"{{s.pick}}\">\u003cb>{{s.ns}}\u003c/b>\u003cspan>{{s.where}}\u003c/span>\u003cem>{{s.why}}\u003c/em>\u003c/button>\u003c/li>\u003c/sc-for>\n                  \u003csc-if value=\"{{qSug.none}}\" hint-placeholder-val=\"{{false}}\">\u003cli class=\"none\">No namespace matches \"{{qSug.text}}\".\u003c/li>\u003c/sc-if>\n                \u003c/ul>\n              \u003c/sc-if>\n            \u003c/div>\n            \u003cbutton type=\"submit\" class=\"btn\">Show all matches\u003c/button>\n            \u003csc-if value=\"{{qSug.applied}}\" hint-placeholder-val=\"{{false}}\">\u003cbutton type=\"button\" class=\"chip on\" onClick=\"{{qSug.clear}}\">matching \"{{qSug.appliedText}}\" ✕\u003c/button>\u003c/sc-if>\n            \u003cbutton type=\"button\" class=\"btn\" onClick=\"{{qExp.go}}\">Export CSV\u003c/button>\n          \u003c/form>\n          \u003cdiv class=\"frow\">\n            \u003cdiv class=\"fgroup\">\u003cspan class=\"flabel\">Env\u003c/span>\u003cdiv class=\"chips\">\u003csc-for list=\"{{qEnvOpts}}\" as=\"o\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" class=\"chip {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">{{o.label}}\u003c/button>\u003c/sc-for>\u003c/div>\u003c/div>\n            \u003cdiv class=\"fgroup\">\u003cspan class=\"flabel\">Cluster\u003c/span>\u003cdiv class=\"chips\">\u003csc-for list=\"{{qClusterOpts}}\" as=\"o\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" class=\"chip {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">{{o.label}}\u003c/button>\u003c/sc-for>\u003c/div>\u003c/div>\n            \u003cdiv class=\"fgroup\">\u003cspan class=\"flabel\">Tier\u003c/span>\u003cdiv class=\"chips\">\u003csc-for list=\"{{qTierOpts}}\" as=\"o\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" class=\"chip {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">{{o.label}}\u003c/button>\u003c/sc-for>\u003c/div>\u003c/div>\n            \u003cdiv class=\"fgroup\">\u003cspan class=\"flabel\">Sort\u003c/span>\u003cdiv class=\"chips\">\u003csc-for list=\"{{qSortOpts}}\" as=\"o\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" class=\"chip {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">{{o.label}}\u003c/button>\u003c/sc-for>\u003c/div>\u003c/div>\n            \u003cdiv class=\"fgroup\">\u003cspan class=\"flabel\">Per page\u003c/span>\u003cdiv class=\"chips\">\u003csc-for list=\"{{qSizeOpts}}\" as=\"o\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" class=\"chip {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">{{o.label}}\u003c/button>\u003c/sc-for>\u003c/div>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"az\" role=\"group\" aria-label=\"Jump to the first namespace starting with a letter\">\n            \u003csc-for list=\"{{qAz}}\" as=\"l\" hint-placeholder-count=\"26\">\u003cbutton type=\"button\" class=\"azb {{l.cls}}\" aria-disabled=\"{{l.dis}}\" aria-label=\"{{l.aria}}\" onClick=\"{{l.pick}}\">{{l.t}}\u003c/button>\u003c/sc-for>\n          \u003c/div>\n          \u003csc-if value=\"{{qExp.show}}\" hint-placeholder-val=\"{{false}}\">\n            \u003cdiv class=\"callout info\">\u003cb>{{qExp.title}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{qExp.text}}\u003c/span>\u003c/div>\n            \u003cpre class=\"codebox\">{{qExp.preview}}\u003c/pre>\n            \u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{qExp.close}}\">Close\u003c/button>\u003c/div>\n          \u003c/sc-if>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"pager\">\n            \u003cspan class=\"meta\">{{qPage.range}}\u003c/span>\n            \u003cdiv class=\"chips\">\n              \u003cbutton type=\"button\" class=\"rowbtn {{qPage.prevCls}}\" aria-disabled=\"{{qPage.prevDis}}\" onClick=\"{{qPage.prev}}\">‹ Previous\u003c/button>\n              \u003cbutton type=\"button\" class=\"rowbtn {{qPage.nextCls}}\" aria-disabled=\"{{qPage.nextDis}}\" onClick=\"{{qPage.next}}\">Next ›\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"tablebox\">\n            \u003ctable class=\"res\">\n              \u003cthead>\u003ctr>\u003cth>Namespace\u003c/th>\u003cth>Cluster\u003c/th>\u003cth>Env\u003c/th>\u003cth>Tier\u003c/th>\u003cth>CPU requests\u003c/th>\u003cth>Memory requests\u003c/th>\u003cth>Pods\u003c/th>\u003cth>Verdict\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\n                \u003csc-for list=\"{{quotas}}\" as=\"q\" hint-placeholder-count=\"3\">\n                  \u003ctr class=\"{{q.cls}}\">\u003ctd>{{q.ns}}\u003c/td>\u003ctd>{{q.cluster}}\u003c/td>\u003ctd>{{q.env}}\u003c/td>\u003ctd>{{q.tier}}\u003c/td>\u003ctd>\u003cdiv class=\"use\">\u003cdiv class=\"bar\" role=\"meter\" aria-label=\"CPU requests of quota\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{q.cpuNow}}\">\u003ci class=\"{{q.cpuBar}}\" style=\"width: {{q.cpuPct}}\">\u003c/i>\u003c/div>\u003cspan class=\"meta\">{{q.cpuText}}\u003c/span>\u003c/div>\u003c/td>\u003ctd>\u003cdiv class=\"use\">\u003cdiv class=\"bar\" role=\"meter\" aria-label=\"Memory requests of quota\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{q.memNow}}\">\u003ci class=\"{{q.memBar}}\" style=\"width: {{q.memPct}}\">\u003c/i>\u003c/div>\u003cspan class=\"meta\">{{q.memText}}\u003c/span>\u003c/div>\u003c/td>\u003ctd>{{q.pods}}\u003c/td>\u003ctd>\u003cspan class=\"pill {{q.vTone}}\">{{q.verdict}}\u003c/span>\u003c/td>\u003ctd>\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{q.pick}}\">{{q.btn}}\u003c/button>\u003c/td>\u003c/tr>\n                \u003c/sc-for>\n              \u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003csc-if value=\"{{noQuotas}}\" hint-placeholder-val=\"{{false}}\">\u003cp class=\"empty\">No namespace on the {{inst.label}} instance matches these filters.\u003c/p>\u003c/sc-if>\n          \u003csc-if value=\"{{qPage.stale}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"callout warn\">\u003cb>This page link is out of date\u003c/b>\u003cspan style=\"font-size: 0.88rem\">The filters or sort changed after it was made, so the API refused it (400 invalid-cursor) rather than show the wrong rows.\u003c/span>\u003cdiv>\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{qPage.first}}\">Back to the first page\u003c/button>\u003c/div>\u003c/div>\u003c/sc-if>\n          \u003cdiv class=\"pager\">\n            \u003cspan class=\"meta\">{{qPage.call}}\u003c/span>\n            \u003cdiv class=\"chips\">\n              \u003cbutton type=\"button\" class=\"rowbtn {{qPage.prevCls}}\" aria-disabled=\"{{qPage.prevDis}}\" onClick=\"{{qPage.prev}}\">‹ Previous\u003c/button>\n              \u003cbutton type=\"button\" class=\"rowbtn {{qPage.nextCls}}\" aria-disabled=\"{{qPage.nextDis}}\" onClick=\"{{qPage.next}}\">Next ›\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cp class=\"foot\">Quota status from the watch cache, verdicts from the 02:00 usage sweep; no Thanos call. Pages follow a cursor on the sort key, so namespaces created or deleted between pages never cause a skip or a repeat. Bars turn amber at 80% and red at 95% of the hard limit.\u003c/p>\n        \u003c/div>\n\n        \u003csc-if value=\"{{qHasDetail}}\" hint-placeholder-val=\"{{true}}\">\n        \u003cdiv class=\"qgrid\">\n          \u003cdiv class=\"card\">\n            \u003cdiv class=\"panel-head\">\u003cdiv class=\"ptitle\">{{qd.title}}\u003c/div>\u003cspan class=\"pill {{qd.vTone}}\">{{qd.verdict}}\u003c/span>\u003c/div>\n            \u003cdiv class=\"meta\">{{qd.meta}}\u003c/div>\n            \u003cdiv class=\"tablebox\">\n              \u003ctable class=\"res\">\n                \u003cthead>\u003ctr>\u003cth>ResourceQuota\u003c/th>\u003cth>Used\u003c/th>\u003cth>Hard\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n                \u003ctbody>\n                  \u003csc-for list=\"{{qd.rows}}\" as=\"r\" hint-placeholder-count=\"3\">\u003ctr>\u003ctd>{{r.k}}\u003c/td>\u003ctd>{{r.used}}\u003c/td>\u003ctd>{{r.hard}}\u003c/td>\u003ctd>\u003cdiv class=\"use\">\u003cdiv class=\"bar\" role=\"meter\" aria-label=\"{{r.k}} used of hard\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{r.now}}\">\u003ci class=\"{{r.bar}}\" style=\"width: {{r.pct}}\">\u003c/i>\u003c/div>\u003cspan class=\"meta\">{{r.pctText}}\u003c/span>\u003c/div>\u003c/td>\u003c/tr>\u003c/sc-for>\n                \u003c/tbody>\n              \u003c/table>\n            \u003c/div>\n            \u003ch3 class=\"lbl\">Usage verdict\u003c/h3>\n            \u003cp class=\"muted\" style=\"font-size: 0.88rem\">{{qd.vNote}}\u003c/p>\n            \u003csc-if value=\"{{qd.hasRec}}\" hint-placeholder-val=\"{{false}}\">\n              \u003cdiv class=\"callout info\">\u003cb>Recommendation {{qd.recId}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{qd.recText}}\u003c/span>\u003cdiv>\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{qd.useRec}}\">Use this size\u003c/button>\u003c/div>\u003c/div>\n            \u003c/sc-if>\n            \u003cp class=\"foot\">GET /api/v1/clusters/{{qd.cluster}}/namespaces/{{qd.ns}}/quota · ETag {{qd.etag}} · ResourceQuota and LimitRange for tier {{qd.tier}} live in the namespace folder in Git.\u003c/p>\n          \u003c/div>\n\n          \u003cform class=\"card\" onSubmit=\"{{qSubmit}}\" style=\"gap: 16px\">\n            \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">Change quota · {{qd.ns}}\u003c/h3>\u003cspan class=\"pill\">{{qd.env}} · {{qd.cluster}}\u003c/span>\u003c/div>\n            \u003csc-if value=\"{{qc.locked}}\" hint-placeholder-val=\"{{false}}\">\n              \u003cdiv class=\"callout warn\">\u003cb>{{qc.lockTitle}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{qc.lockText}}\u003c/span>\u003cdiv>\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{qc.openLock}}\">Open at current step\u003c/button>\u003c/div>\u003c/div>\n            \u003c/sc-if>\n            \u003csc-if value=\"{{qc.open}}\" hint-placeholder-val=\"{{true}}\">\n              \u003cdiv class=\"field\">\n                \u003cspan class=\"flabel\">New size\u003c/span>\n                \u003cdiv class=\"seg\" role=\"group\" aria-label=\"New size\">\n                  \u003csc-for list=\"{{qc.sizes}}\" as=\"o\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" class=\"segbtn {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">\u003cb>{{o.label}}\u003c/b>\u003cspan>{{o.sub}}\u003c/span>\u003c/button>\u003c/sc-for>\n                \u003c/div>\n                \u003cspan class=\"hint\">A tier changes one label and the operator re-stamps the quota (PATCH …/namespaces/{ns}). Custom sets requests.cpu and requests.memory directly (PATCH …/namespaces/{ns}/quota).\u003c/span>\n              \u003c/div>\n              \u003csc-if value=\"{{qc.custom}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cdiv class=\"row2\">\n                  \u003cdiv class=\"field\">\u003clabel for=\"q-cpu\">requests.cpu (cores)\u003c/label>\u003cinput id=\"q-cpu\" class=\"mono\" type=\"number\" min=\"1\" step=\"1\" inputmode=\"numeric\" value=\"{{qc.cpu}}\" onChange=\"{{qc.onCpu}}\">\u003c/div>\n                  \u003cdiv class=\"field\">\u003clabel for=\"q-mem\">requests.memory (Gi)\u003c/label>\u003cinput id=\"q-mem\" class=\"mono\" type=\"number\" min=\"1\" step=\"1\" value=\"{{qc.mem}}\" onChange=\"{{qc.onMem}}\">\u003c/div>\n                \u003c/div>\n              \u003c/sc-if>\n              \u003cdiv class=\"field\">\n                \u003clabel for=\"q-why\">Justification\u003c/label>\n                \u003ctextarea id=\"q-why\" placeholder=\"Why this size is needed, for example the load test or launch it supports\">\u003c/textarea>\n              \u003c/div>\n              \u003cdiv class=\"actions\">\n                \u003cbutton type=\"button\" class=\"btn\" onClick=\"{{qPlan}}\">Plan change\u003c/button>\n                \u003cbutton type=\"submit\" class=\"btn primary\">Submit change\u003c/button>\n              \u003c/div>\n              \u003csc-if value=\"{{qc.nothing}}\" hint-placeholder-val=\"{{false}}\">\u003cp class=\"empty\">The new size equals the current quota; pick another tier or custom values.\u003c/p>\u003c/sc-if>\n              \u003csc-if value=\"{{qc.planned}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cdiv style=\"display: grid; gap: 12px\">\n                  \u003ch3 class=\"lbl\">Live usage · last 14 days\u003c/h3>\n                  \u003cdiv class=\"tablebox\">\n                    \u003ctable class=\"res\">\n                      \u003cthead>\u003ctr>\u003cth>Resource\u003c/th>\u003cth>Now\u003c/th>\u003cth>7d avg\u003c/th>\u003cth>p95\u003c/th>\u003cth>Peak\u003c/th>\u003cth>Quota\u003c/th>\u003cth>New / peak\u003c/th>\u003c/tr>\u003c/thead>\n                      \u003ctbody>\u003csc-for list=\"{{qc.usage}}\" as=\"u\" hint-placeholder-count=\"2\">\u003ctr>\u003ctd>{{u.k}}\u003c/td>\u003ctd>{{u.now}}\u003c/td>\u003ctd>{{u.avg}}\u003c/td>\u003ctd>{{u.p95}}\u003c/td>\u003ctd>{{u.peak}}\u003c/td>\u003ctd>{{u.quota}}\u003c/td>\u003ctd>{{u.ratio}}\u003c/td>\u003c/tr>\u003c/sc-for>\u003c/tbody>\n                    \u003c/table>\n                  \u003c/div>\n                  \u003cp class=\"foot\">Read live from {{qd.cluster}}'s Thanos by cmapi-capacity for this plan; cached 10 minutes and not stored. Cluster headroom comes from the 17:00 snapshot, committed quota and reservations, with no Thanos call.\u003c/p>\n                  \u003cul class=\"checks\">\n                    \u003csc-for list=\"{{qc.checks}}\" as=\"c\" hint-placeholder-count=\"6\">\u003cli>\u003cspan class=\"mark {{c.s}}\">{{c.mark}}\u003c/span>\u003cspan>{{c.l}}\u003cspan class=\"note\">{{c.n}}\u003c/span>\u003c/span>\u003c/li>\u003c/sc-for>\n                  \u003c/ul>\n                  \u003cdiv class=\"callout {{qc.apprTone}}\">\u003cb>{{qc.apprTitle}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{qc.apprDetail}}\u003c/span>\u003c/div>\n                \u003c/div>\n              \u003c/sc-if>\n              \u003csc-if value=\"{{qc.sent}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cdiv class=\"callout {{qc.sentTone}}\">\u003cb>{{qc.sentTitle}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{qc.sentText}}\u003c/span>\u003c/div>\n                \u003cpre class=\"codebox\">{{qc.sentBody}}\u003c/pre>\n              \u003c/sc-if>\n            \u003c/sc-if>\n          \u003c/form>\n        \u003c/div>\n        \u003c/sc-if>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isExpiration}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: grid; gap: 18px\">\n        \u003cdiv class=\"head\">\n          \u003cdiv>\n            \u003ch1>Expiration\u003c/h1>\n            \u003cp class=\"lede\">{{exp.lede}}\u003c/p>\n          \u003c/div>\n          \u003cspan class=\"pill\">{{exp.head}}\u003c/span>\n        \u003c/div>\n        \u003csc-if value=\"{{exp.prod}}\" hint-placeholder-val=\"{{false}}\">\n          \u003cdiv class=\"card\">\n            \u003cdiv class=\"callout ok\">\u003cb>Production namespaces never expire\u003c/b>\u003cspan style=\"font-size: 0.88rem\">A prod request with an expiry gets 422 expiration-not-allowed, the renderer never writes cmapi.net/expires-at or cmapi.net/expiry for prod, and the deny-expiry-in-prod Kyverno policy refuses them in CI and at admission, so a hand edit cannot add them either.\u003c/span>\u003c/div>\n            \u003cdl class=\"kv\">\u003csc-for list=\"{{exp.prodRows}}\" as=\"r\" hint-placeholder-count=\"3\">\u003cdt>{{r.k}}\u003c/dt>\u003cdd>{{r.v}}\u003c/dd>\u003c/sc-for>\u003c/dl>\n          \u003c/div>\n        \u003c/sc-if>\n        \u003csc-if value=\"{{exp.nonprod}}\" hint-placeholder-val=\"{{true}}\">\n          \u003cdiv class=\"card qtools\">\n            \u003cdiv class=\"attn\">\n              \u003cspan class=\"flabel\">State\u003c/span>\n              \u003csc-for list=\"{{exp.states}}\" as=\"o\" hint-placeholder-count=\"6\">\u003cbutton type=\"button\" class=\"chip {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">{{o.label}} \u003cb>{{o.n}}\u003c/b>\u003c/button>\u003c/sc-for>\n            \u003c/div>\n            \u003cdiv class=\"searchrow\">\n              \u003cdiv class=\"combo\">\u003cinput type=\"search\" aria-label=\"Find a namespace or team\" placeholder=\"Find a namespace or team\" value=\"{{exp.text}}\" onChange=\"{{exp.onType}}\">\u003c/div>\n              \u003cdiv class=\"fgroup\">\u003cspan class=\"flabel\">Env\u003c/span>\u003cdiv class=\"chips\">\u003csc-for list=\"{{exp.envs}}\" as=\"o\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" class=\"chip {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">{{o.label}}\u003c/button>\u003c/sc-for>\u003c/div>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"card\">\n            \u003cdiv class=\"pager\">\n              \u003cspan class=\"meta\">{{exp.range}}\u003c/span>\n              \u003cdiv class=\"chips\">\n                \u003cbutton type=\"button\" class=\"rowbtn {{exp.prevCls}}\" aria-disabled=\"{{exp.prevDis}}\" onClick=\"{{exp.prev}}\">‹ Previous\u003c/button>\n                \u003cbutton type=\"button\" class=\"rowbtn {{exp.nextCls}}\" aria-disabled=\"{{exp.nextDis}}\" onClick=\"{{exp.next}}\">Next ›\u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"tablebox\">\n              \u003ctable class=\"res\">\n                \u003cthead>\u003ctr>\u003cth>Namespace\u003c/th>\u003cth>Cluster\u003c/th>\u003cth>Env\u003c/th>\u003cth>Team\u003c/th>\u003cth>Expires\u003c/th>\u003cth>Days left\u003c/th>\u003cth>Lifetime\u003c/th>\u003cth>State\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n                \u003ctbody>\n                  \u003csc-for list=\"{{exp.rows}}\" as=\"x\" hint-placeholder-count=\"3\">\n                    \u003ctr class=\"{{x.cls}}\">\u003ctd>{{x.ns}}\u003c/td>\u003ctd>{{x.cluster}}\u003c/td>\u003ctd>{{x.env}}\u003c/td>\u003ctd>{{x.team}}\u003c/td>\u003ctd>{{x.expires}}\u003c/td>\u003ctd>\u003cspan class=\"{{x.daysCls}}\">{{x.days}}\u003c/span>\u003c/td>\u003ctd>{{x.life}}\u003c/td>\u003ctd class=\"statecell\">\u003cspan class=\"pill {{x.tone}}\">{{x.state}}\u003c/span>\u003c/td>\u003ctd>\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{x.pick}}\">{{x.btn}}\u003c/button>\u003c/td>\u003c/tr>\n                  \u003c/sc-for>\n                \u003c/tbody>\n              \u003c/table>\n            \u003c/div>\n            \u003csc-if value=\"{{exp.empty}}\" hint-placeholder-val=\"{{false}}\">\u003cp class=\"empty\">No namespace matches this state and search.\u003c/p>\u003c/sc-if>\n            \u003cp class=\"foot\">{{exp.foot}}\u003c/p>\n          \u003c/div>\n          \u003csc-if value=\"{{exp.hasSel}}\" hint-placeholder-val=\"{{true}}\">\n            \u003cdiv class=\"qgrid\">\n              \u003cdiv class=\"card\">\n                \u003cdiv class=\"panel-head\">\u003cdiv class=\"ptitle\">{{exp.d.title}}\u003c/div>\u003cspan class=\"pill {{exp.d.tone}}\">{{exp.d.state}}\u003c/span>\u003c/div>\n                \u003cdl class=\"kv\">\u003csc-for list=\"{{exp.d.rows}}\" as=\"r\" hint-placeholder-count=\"6\">\u003cdt>{{r.k}}\u003c/dt>\u003cdd>{{r.v}}\u003c/dd>\u003c/sc-for>\u003c/dl>\n                \u003cp class=\"foot\">{{exp.d.foot}}\u003c/p>\n              \u003c/div>\n              \u003cform class=\"card\" onSubmit=\"{{exp.submit}}\" style=\"gap: 14px\">\n                \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">Change expiration · {{exp.d.ns}}\u003c/h3>\u003cspan class=\"pill\">{{exp.d.env}} · {{exp.d.cluster}}\u003c/span>\u003c/div>\n                \u003csc-if value=\"{{exp.d.locked}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"callout warn\">\u003cb>{{exp.d.lockTitle}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{exp.d.lockText}}\u003c/span>\u003c/div>\u003c/sc-if>\n                \u003csc-if value=\"{{exp.d.open}}\" hint-placeholder-val=\"{{true}}\">\n                  \u003cdiv class=\"field\">\n                    \u003cspan class=\"flabel\">Action\u003c/span>\n                    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Action\">\u003csc-for list=\"{{exp.d.actions}}\" as=\"o\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" class=\"segbtn {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">\u003cb>{{o.label}}\u003c/b>\u003cspan>{{o.sub}}\u003c/span>\u003c/button>\u003c/sc-for>\u003c/div>\n                  \u003c/div>\n                  \u003csc-if value=\"{{exp.d.setDate}}\" hint-placeholder-val=\"{{false}}\">\n                    \u003cdiv class=\"field\">\u003clabel for=\"exp-until\">New expiry date\u003c/label>\u003cinput id=\"exp-until\" type=\"date\" min=\"2026-11-04\" value=\"{{exp.d.until}}\" onChange=\"{{exp.d.onUntil}}\">\u003c/div>\n                  \u003c/sc-if>\n                  \u003cul class=\"checks\">\u003csc-for list=\"{{exp.d.checks}}\" as=\"c\" hint-placeholder-count=\"3\">\u003cli>\u003cspan class=\"mark {{c.s}}\">{{c.mark}}\u003c/span>\u003cspan>{{c.l}}\u003cspan class=\"note\">{{c.n}}\u003c/span>\u003c/span>\u003c/li>\u003c/sc-for>\u003c/ul>\n                  \u003cdiv class=\"callout {{exp.d.apprTone}}\">\u003cb>{{exp.d.apprTitle}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{exp.d.apprDetail}}\u003c/span>\u003c/div>\n                  \u003cdiv class=\"actions\">\u003cbutton type=\"submit\" class=\"btn primary\">{{exp.d.btn}}\u003c/button>\u003c/div>\n                  \u003csc-if value=\"{{exp.d.sent}}\" hint-placeholder-val=\"{{false}}\">\n                    \u003cdiv class=\"callout {{exp.d.sentTone}}\">\u003cb>{{exp.d.sentTitle}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{exp.d.sentText}}\u003c/span>\u003c/div>\n                    \u003cpre class=\"codebox\">{{exp.d.sentBody}}\u003c/pre>\n                  \u003c/sc-if>\n                \u003c/sc-if>\n              \u003c/form>\n            \u003c/div>\n          \u003c/sc-if>\n        \u003c/sc-if>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isRequests}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: grid; gap: 18px\">\n        \u003cdiv class=\"head\">\n          \u003cdiv>\n            \u003ch1>Requests\u003c/h1>\n            \u003cp class=\"lede\">Every write you or your team started, newest first. Open one to replay it step by step in the workflow.\u003c/p>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"card qtools\">\n          \u003cdiv class=\"searchrow\">\n            \u003cdiv class=\"combo\">\u003cinput type=\"search\" aria-label=\"Find a request\" placeholder=\"Find by request ID, namespace or cluster\" value=\"{{reqList.text}}\" onChange=\"{{reqList.onType}}\">\u003c/div>\n            \u003cdiv class=\"fgroup\">\u003cspan class=\"flabel\">Status\u003c/span>\u003cdiv class=\"chips\">\u003csc-for list=\"{{reqFilters}}\" as=\"o\" hint-placeholder-count=\"3\">\u003cbutton type=\"button\" class=\"chip {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">{{o.label}}\u003c/button>\u003c/sc-for>\u003c/div>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"pager\">\n            \u003cspan class=\"meta\">{{reqList.range}}\u003c/span>\n            \u003cdiv class=\"chips\">\n              \u003cbutton type=\"button\" class=\"rowbtn {{reqList.prevCls}}\" aria-disabled=\"{{reqList.prevDis}}\" onClick=\"{{reqList.prev}}\">‹ Previous\u003c/button>\n              \u003cbutton type=\"button\" class=\"rowbtn {{reqList.nextCls}}\" aria-disabled=\"{{reqList.nextDis}}\" onClick=\"{{reqList.next}}\">Next ›\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"tablebox\">\n            \u003ctable class=\"res\">\n              \u003cthead>\u003ctr>\u003cth>Request\u003c/th>\u003cth>Cluster\u003c/th>\u003cth>Namespace\u003c/th>\u003cth>Action\u003c/th>\u003cth>Status\u003c/th>\u003cth>Where it is\u003c/th>\u003cth>Approval\u003c/th>\u003cth>PR\u003c/th>\u003cth>Updated\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\n                \u003csc-for list=\"{{requests}}\" as=\"r\" hint-placeholder-count=\"2\">\n                  \u003ctr>\u003ctd>{{r.id}}\u003c/td>\u003ctd>{{r.cluster}}\u003c/td>\u003ctd>{{r.ns}}\u003c/td>\u003ctd>{{r.action}}\u003c/td>\u003ctd>\u003cspan class=\"pill {{r.tone}}\">{{r.status}}\u003c/span>\u003c/td>\u003ctd>\u003cspan style=\"font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 0.84rem\">{{r.where}}\u003c/span>\u003cdiv class=\"muted\">{{r.whereN}}\u003c/div>\u003c/td>\u003ctd>{{r.approval}}\u003c/td>\u003ctd>{{r.pr}}\u003c/td>\u003ctd class=\"muted\">{{r.when}}\u003c/td>\u003ctd>\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{r.open}}\">Open at current step\u003c/button>\u003c/td>\u003c/tr>\n                \u003c/sc-for>\n              \u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003csc-if value=\"{{noRequests}}\" hint-placeholder-val=\"{{false}}\">\u003cp class=\"empty\">No requests on the {{inst.label}} instance match this search and filter.\u003c/p>\u003c/sc-if>\n          \u003cp class=\"foot\">This list shows the {{inst.label}} instance only; requests for other environments live in their own instance. A request refused before it is stored (a policy rejection or the wrong instance) never appears here.\n            \u003csc-if value=\"{{showReject}}\" hint-placeholder-val=\"{{false}}\">\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{openReject}}\">Replay a policy rejection\u003c/button>\u003c/sc-if>\n            \u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{openWrong}}\">Replay a wrong-instance request\u003c/button>\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isApprovals}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: grid; gap: 18px\">\n        \u003cdiv class=\"head\">\n          \u003cdiv>\n            \u003ch1>Approvals\u003c/h1>\n            \u003cp class=\"lede\">Requests waiting for a decision on the {{inst.label}} instance. Approval happens here, in cmapi, before anything is written to Git: once a request has all its approvals, the worker opens a bot pull request that merges when CI passes. Email links, chat buttons and ServiceNow all end in the same Approve.\u003c/p>\n          \u003c/div>\n          \u003cspan class=\"pill\">{{apv.head}}\u003c/span>\n        \u003c/div>\n        \u003csc-for list=\"{{apv.items}}\" as=\"a\" hint-placeholder-count=\"1\">\n          \u003cdiv class=\"apprgrid\">\n            \u003cdiv class=\"card\">\n              \u003cdiv class=\"panel-head\">\u003cdiv class=\"ptitle\">{{a.title}}\u003c/div>\u003cspan class=\"pill {{a.tone}}\">{{a.count}}\u003c/span>\u003c/div>\n              \u003cdiv class=\"meta\">{{a.meta}}\u003c/div>\n              \u003ch3 class=\"lbl\">Why it needs approval\u003c/h3>\n              \u003cul class=\"reasons\">\u003csc-for list=\"{{a.reasons}}\" as=\"r\" hint-placeholder-count=\"2\">\u003cli>{{r.t}}\u003c/li>\u003c/sc-for>\u003c/ul>\n              \u003csc-if value=\"{{a.hasUsage}}\" hint-placeholder-val=\"{{false}}\">\n                \u003ch3 class=\"lbl\">Live usage · last 14 days\u003c/h3>\n                \u003cdiv class=\"tablebox\">\n                  \u003ctable class=\"res\">\n                    \u003cthead>\u003ctr>\u003cth>Resource\u003c/th>\u003cth>Now\u003c/th>\u003cth>7d avg\u003c/th>\u003cth>p95\u003c/th>\u003cth>Peak\u003c/th>\u003cth>Quota\u003c/th>\u003c/tr>\u003c/thead>\n                    \u003ctbody>\u003csc-for list=\"{{a.usage}}\" as=\"u\" hint-placeholder-count=\"2\">\u003ctr>\u003ctd>{{u.k}}\u003c/td>\u003ctd>{{u.now}}\u003c/td>\u003ctd>{{u.avg}}\u003c/td>\u003ctd>{{u.p95}}\u003c/td>\u003ctd>{{u.peak}}\u003c/td>\u003ctd>{{u.quota}}\u003c/td>\u003c/tr>\u003c/sc-for>\u003c/tbody>\n                  \u003c/table>\n                \u003c/div>\n              \u003c/sc-if>\n              \u003cp class=\"foot\">{{a.foot}}\u003c/p>\n              \u003csc-if value=\"{{a.decided}}\" hint-placeholder-val=\"{{false}}\">\u003cdiv class=\"callout {{a.doneTone}}\">\u003cb>{{a.doneTitle}}\u003c/b>\u003cspan style=\"font-size: 0.88rem\">{{a.doneText}}\u003c/span>\u003c/div>\u003c/sc-if>\n              \u003csc-if value=\"{{a.rejecting}}\" hint-placeholder-val=\"{{false}}\">\n                \u003cdiv class=\"field\">\u003clabel for=\"{{a.cid}}\">Why are you rejecting it? (required, sent to the requester)\u003c/label>\u003ctextarea id=\"{{a.cid}}\" value=\"{{a.comment}}\" onChange=\"{{a.onComment}}\">\u003c/textarea>\u003cspan class=\"hint\">{{a.commentHint}}\u003c/span>\u003c/div>\n              \u003c/sc-if>\n              \u003cdiv class=\"actions\">\n                \u003cbutton type=\"button\" class=\"btn\" onClick=\"{{a.open}}\">Open at current step\u003c/button>\n                \u003csc-if value=\"{{a.canAct}}\" hint-placeholder-val=\"{{true}}\">\u003cbutton type=\"button\" class=\"btn\" onClick=\"{{a.reject}}\">{{a.rejectLabel}}\u003c/button>\u003cbutton type=\"button\" class=\"btn primary\" onClick=\"{{a.approve}}\">Approve\u003c/button>\u003c/sc-if>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"card\">\n              \u003ch3 class=\"lbl\">Your eligibility\u003c/h3>\n              \u003cul class=\"checks\">\u003csc-for list=\"{{a.elig}}\" as=\"c\" hint-placeholder-count=\"3\">\u003cli>\u003cspan class=\"mark {{c.s}}\">{{c.mark}}\u003c/span>\u003cspan>{{c.l}}\u003cspan class=\"note\">{{c.n}}\u003c/span>\u003c/span>\u003c/li>\u003c/sc-for>\u003c/ul>\n              \u003ch3 class=\"lbl\">Approvals so far\u003c/h3>\n              \u003cdl class=\"kv\">\u003csc-for list=\"{{a.so}}\" as=\"r\" hint-placeholder-count=\"2\">\u003cdt>{{r.k}}\u003c/dt>\u003cdd>{{r.v}}\u003c/dd>\u003c/sc-for>\u003c/dl>\n              \u003ch3 class=\"lbl\">How approvers were told\u003c/h3>\n              \u003cp class=\"muted\" style=\"font-size: 0.86rem\">{{a.channels}}\u003c/p>\n            \u003c/div>\n          \u003c/div>\n        \u003c/sc-for>\n        \u003csc-if value=\"{{apv.none}}\" hint-placeholder-val=\"{{false}}\">\n          \u003cdiv class=\"card\">\u003ch3 class=\"lbl\">Nothing waiting for you\u003c/h3>\u003cp class=\"muted\">Small and medium rnd and dev namespaces are auto-approved by baseline-rnd-namespace, and expired namespaces by expired-namespace. Anything else waits here.\u003c/p>\u003c/div>\n        \u003c/sc-if>\n        \u003cdiv class=\"card\">\n          \u003ch3 class=\"lbl\">Recently decided\u003c/h3>\n          \u003cdl class=\"kv\">\u003csc-for list=\"{{apv.recent}}\" as=\"r\" hint-placeholder-count=\"2\">\u003cdt>{{r.k}}\u003c/dt>\u003cdd>{{r.v}}\u003c/dd>\u003c/sc-for>\u003c/dl>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isPolicies}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: grid; gap: 18px\">\n        \u003cdiv class=\"head\">\n          \u003cdiv>\n            \u003ch1>Policies\u003c/h1>\n            \u003cp class=\"lede\">What the Kyverno bundle decided on each cluster of the {{inst.label}} instance, read from the policy reports, beside cmapi's own refusals at plan time and in CI. The same bundle runs in all three places. Pinned for this instance: {{pol.pinned}}.\u003c/p>\n          \u003c/div>\n          \u003cspan class=\"pill {{pol.tone}}\">{{pol.head}}\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003ch3 class=\"lbl\">Clusters\u003c/h3>\n          \u003cdiv class=\"tablebox\">\n            \u003ctable class=\"res\">\n              \u003cthead>\u003ctr>\u003cth>Cluster\u003c/th>\u003cth>Env\u003c/th>\u003cth>Bundle running\u003c/th>\u003cth>Policies ready\u003c/th>\u003cth>Pass\u003c/th>\u003cth>Fail\u003c/th>\u003cth>Warn\u003c/th>\u003cth>Error\u003c/th>\u003cth>Reports\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\u003csc-for list=\"{{pol.clusters}}\" as=\"c\" hint-placeholder-count=\"4\">\u003ctr>\u003ctd>{{c.id}}\u003c/td>\u003ctd>{{c.env}}\u003c/td>\u003ctd>\u003cspan class=\"pill {{c.bundleTone}}\">{{c.bundle}}\u003c/span>\u003c/td>\u003ctd>{{c.ready}}\u003c/td>\u003ctd>{{c.pass}}\u003c/td>\u003ctd>{{c.fail}}\u003c/td>\u003ctd>{{c.warn}}\u003c/td>\u003ctd>{{c.error}}\u003c/td>\u003ctd>\u003cspan class=\"pill {{c.stateTone}}\">{{c.state}}\u003c/span>\u003c/td>\u003c/tr>\u003c/sc-for>\u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003cp class=\"foot\">Kyverno not installed, an unreachable cluster, and results dropped by the report size breaker show as states, never as zero. A cluster on another bundle tag than the pinned one raises CmapiPolicyBundleDrift after 30 minutes.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">Results by policy\u003c/h3>\u003cdiv class=\"chips\">\u003csc-for list=\"{{pol.clusterOpts}}\" as=\"o\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" class=\"chip {{o.cls}}\" aria-pressed=\"{{o.on}}\" onClick=\"{{o.pick}}\">{{o.label}}\u003c/button>\u003c/sc-for>\u003c/div>\u003c/div>\n          \u003cdiv class=\"tablebox\">\n            \u003ctable class=\"res\">\n              \u003cthead>\u003ctr>\u003cth>Policy\u003c/th>\u003cth>Kind\u003c/th>\u003cth>What it checks\u003c/th>\u003cth>Pass\u003c/th>\u003cth>Fail\u003c/th>\u003cth>Warn\u003c/th>\u003cth>Error\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\u003csc-for list=\"{{pol.policies}}\" as=\"x\" hint-placeholder-count=\"6\">\u003ctr class=\"{{x.cls}}\">\u003ctd style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.8rem\">{{x.name}}\u003c/td>\u003ctd>{{x.kind}}\u003c/td>\u003ctd class=\"muted\" style=\"white-space: normal; min-width: 220px\">{{x.what}}\u003c/td>\u003ctd>{{x.pass}}\u003c/td>\u003ctd>{{x.fail}}\u003c/td>\u003ctd>{{x.warn}}\u003c/td>\u003ctd>{{x.error}}\u003c/td>\u003ctd>\u003cbutton type=\"button\" class=\"rowbtn\" onClick=\"{{x.pick}}\">{{x.btn}}\u003c/button>\u003c/td>\u003c/tr>\u003c/sc-for>\u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003cp class=\"foot\">{{pol.legacy}}\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003ch3 class=\"lbl\">{{pol.failTitle}}\u003c/h3>\n          \u003cdiv class=\"tablebox\">\n            \u003ctable class=\"res\">\n              \u003cthead>\u003ctr>\u003cth>Namespace\u003c/th>\u003cth>Resource\u003c/th>\u003cth>Policy\u003c/th>\u003cth>Result\u003c/th>\u003cth>Message\u003c/th>\u003cth>Cluster\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\u003csc-for list=\"{{pol.fails}}\" as=\"x\" hint-placeholder-count=\"4\">\u003ctr>\u003ctd>{{x.ns}}\u003c/td>\u003ctd>{{x.res}}\u003c/td>\u003ctd>{{x.policy}}\u003c/td>\u003ctd>\u003cspan class=\"pill {{x.tone}}\">{{x.result}}\u003c/span>\u003c/td>\u003ctd class=\"muted\" style=\"white-space: normal; min-width: 240px\">{{x.msg}}\u003c/td>\u003ctd>{{x.cluster}}\u003c/td>\u003c/tr>\u003c/sc-for>\u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003csc-if value=\"{{pol.noFails}}\" hint-placeholder-val=\"{{false}}\">\u003cp class=\"empty\">Nothing failing for this selection.\u003c/p>\u003c/sc-if>\n          \u003cp class=\"foot\">GET /api/v1/policies/results?result=fail,warn,error · filtered to the environments your roles cover · paged like every list.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003ch3 class=\"lbl\">Refused by cmapi before Git · last 7 days\u003c/h3>\n          \u003cdiv class=\"tablebox\">\n            \u003ctable class=\"res\">\n              \u003cthead>\u003ctr>\u003cth>When\u003c/th>\u003cth>Where\u003c/th>\u003cth>Stage\u003c/th>\u003cth>Policy or check\u003c/th>\u003cth>Detail\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\u003csc-for list=\"{{pol.rejections}}\" as=\"x\" hint-placeholder-count=\"2\">\u003ctr>\u003ctd class=\"muted\">{{x.when}}\u003c/td>\u003ctd>{{x.where}}\u003c/td>\u003ctd>{{x.stage}}\u003c/td>\u003ctd style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.8rem\">{{x.policy}}\u003c/td>\u003ctd class=\"muted\" style=\"white-space: normal; min-width: 240px\">{{x.detail}}\u003c/td>\u003c/tr>\u003c/sc-for>\u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003cp class=\"foot\">GET /api/v1/policies/rejections?since=7d · plan-time refusals never become requests, so they are listed here rather than under Requests.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isCapacity}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: grid; gap: 18px\">\n        \u003cdiv class=\"head\">\n          \u003cdiv>\n            \u003ch1>Capacity\u003c/h1>\n            \u003cp class=\"lede\">Cluster capacity from the latest complete snapshots, grouped by clusters.yaml metadata. CPU and memory are measured, committed and checked separately; a cluster is as full as its fuller resource. Headroom never crosses cluster boundaries, so the largest single placement is shown beside the total.\u003c/p>\n          \u003c/div>\n          \u003cspan class=\"pill\">snapshot 17:00 · every 30 min\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"capgrid\">\n          \u003csc-for list=\"{{groups}}\" as=\"g\" hint-placeholder-count=\"2\">\n            \u003cdiv class=\"card\">\n              \u003cdiv class=\"panel-head\">\u003cdiv class=\"ptitle\">{{g.name}}\u003c/div>\u003cspan class=\"pill {{g.tone}}\">{{g.status}}\u003c/span>\u003c/div>\n              \u003cdiv class=\"meta\">{{g.meta}}\u003c/div>\n              \u003cdiv class=\"stats two\">\n                \u003cdiv class=\"stat\">\u003cspan>CPU commitment\u003c/span>\u003cb>{{g.cpuCommit}}\u003c/b>\u003csmall>quota headroom {{g.cpuHead}}\u003c/small>\u003c/div>\n                \u003cdiv class=\"stat\">\u003cspan>Memory commitment\u003c/span>\u003cb>{{g.memCommit}}\u003c/b>\u003csmall>quota headroom {{g.memHead}}\u003c/small>\u003c/div>\n                \u003cdiv class=\"stat\">\u003cspan>Largest placement\u003c/span>\u003cb>{{g.largest}}\u003c/b>\u003csmall>{{g.largestOn}}\u003c/small>\u003c/div>\n                \u003cdiv class=\"stat\">\u003cspan>Bound by\u003c/span>\u003cb>{{g.bound}}\u003c/b>\u003csmall>{{g.boundWhy}}\u003c/small>\u003c/div>\n              \u003c/div>\n              \u003cp class=\"foot\">{{g.note}}\u003c/p>\n            \u003c/div>\n          \u003c/sc-for>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003ch3 class=\"lbl\">Clusters\u003c/h3>\n          \u003cdiv class=\"tablebox\">\n            \u003ctable class=\"res\">\n              \u003cthead>\u003ctr>\u003cth>Cluster\u003c/th>\u003cth>Env\u003c/th>\u003cth>Zones\u003c/th>\u003cth>CPU commitment\u003c/th>\u003cth>Memory commitment\u003c/th>\u003cth>Quota headroom\u003c/th>\u003cth>Bound by\u003c/th>\u003cth>Snapshot\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\n                \u003csc-for list=\"{{clusters}}\" as=\"c\" hint-placeholder-count=\"6\">\n                  \u003ctr>\u003ctd>{{c.id}}\u003c/td>\u003ctd>{{c.env}}\u003c/td>\u003ctd>{{c.zones}}\u003c/td>\u003ctd>\u003cdiv class=\"use\">\u003cdiv class=\"bar\">\u003ci class=\"{{c.cpuBar}}\" style=\"width: {{c.cpuPct}}\">\u003c/i>\u003c/div>\u003cspan class=\"meta\">{{c.cpuCommit}}\u003c/span>\u003c/div>\u003c/td>\u003ctd>\u003cdiv class=\"use\">\u003cdiv class=\"bar\">\u003ci class=\"{{c.memBar}}\" style=\"width: {{c.memPct}}\">\u003c/i>\u003c/div>\u003cspan class=\"meta\">{{c.memCommit}}\u003c/span>\u003c/div>\u003c/td>\u003ctd>{{c.head}}\u003c/td>\u003ctd>{{c.bound}}\u003c/td>\u003ctd>{{c.snap}}\u003c/td>\u003ctd>\u003cspan class=\"pill {{c.tone}}\">{{c.status}}\u003c/span>\u003c/td>\u003c/tr>\n                \u003c/sc-for>\n              \u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003cp class=\"foot\">{{capFoot}}\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003csc-if value=\"{{isKpis}}\" hint-placeholder-val=\"{{false}}\">\n      \u003cdiv style=\"display: grid; gap: 18px\">\n        \u003cdiv class=\"head\">\n          \u003cdiv>\n            \u003ch1>KPIs\u003c/h1>\n            \u003cp class=\"lede\">The {{inst.label}} instance's KPI board: first whether cmapi itself has room (each component's memory, CPU, throttling and event loop, and the database), then the service KPIs from the recording rules over the last 30 days. The page and /metrics read the same collectors, so they cannot disagree.\u003c/p>\n          \u003c/div>\n          \u003cspan class=\"pill\">30 days · {{inst.label}}\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">System status · each component's own cgroup\u003c/h3>\u003cspan class=\"pill {{sys.tone}}\">{{sys.pill}}\u003c/span>\u003c/div>\n          \u003cdiv class=\"sysgrid\">\n            \u003csc-for list=\"{{sys.comps}}\" as=\"c\" hint-placeholder-count=\"3\">\n              \u003cdiv class=\"comp {{c.cls}}\">\n                \u003cdiv class=\"comp-top\">\u003cb>{{c.name}}\u003c/b>\u003cspan class=\"pill {{c.tone}}\">{{c.badge}}\u003c/span>\u003c/div>\n                \u003cdiv class=\"meta\">{{c.meta}}\u003c/div>\n                \u003csc-for list=\"{{c.meters}}\" as=\"m\" hint-placeholder-count=\"4\">\n                  \u003cdiv class=\"meter\">\u003cdiv class=\"meter-top\">\u003cspan>{{m.label}}\u003c/span>\u003cspan>{{m.value}}\u003c/span>\u003c/div>\u003cdiv class=\"bar\" role=\"meter\" aria-label=\"{{m.label}}\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{m.now}}\" aria-valuetext=\"{{m.value}}\">\u003ci class=\"{{m.bar}}\" style=\"width: {{m.pct}}\">\u003c/i>\u003cspan class=\"mk\" style=\"left: {{m.mark}}\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003c/div>\n                \u003c/sc-for>\n                \u003cspan class=\"rule {{c.ruleCls}}\">{{c.rule}}\u003c/span>\n              \u003c/div>\n            \u003c/sc-for>\n          \u003c/div>\n          \u003cp class=\"foot\">{{sys.foot}}\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003cdiv class=\"panel-head\">\u003ch3 class=\"lbl\">Database · PostgreSQL, schemas cmapi and capacity\u003c/h3>\u003cspan class=\"pill {{db.tone}}\">{{db.pill}}\u003c/span>\u003c/div>\n          \u003cdiv class=\"dbgrid\">\n            \u003csc-for list=\"{{db.meters}}\" as=\"m\" hint-placeholder-count=\"2\">\n              \u003cdiv class=\"meter\">\u003cdiv class=\"meter-top\">\u003cspan>{{m.label}}\u003c/span>\u003cspan>{{m.value}}\u003c/span>\u003c/div>\u003cdiv class=\"bar\" role=\"meter\" aria-label=\"{{m.label}}\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{m.now}}\" aria-valuetext=\"{{m.value}}\">\u003ci class=\"{{m.bar}}\" style=\"width: {{m.pct}}\">\u003c/i>\u003cspan class=\"mk\" style=\"left: {{m.mark}}\" aria-hidden=\"true\">\u003c/span>\u003c/div>\u003c/div>\n            \u003c/sc-for>\n          \u003c/div>\n          \u003cdl class=\"kv\">\n            \u003csc-for list=\"{{db.rows}}\" as=\"r\" hint-placeholder-count=\"5\">\u003cdt>{{r.k}}\u003c/dt>\u003cdd>{{r.v}}\u003c/dd>\u003c/sc-for>\n          \u003c/dl>\n          \u003cspan class=\"rule {{db.ruleCls}}\">{{db.rule}}\u003c/span>\n          \u003cp class=\"foot\">Measured every 30 s by the worker that holds the discovery lock (pg_monitor role); volume fill from kubelet_volume_stats through the hub's Thanos. A value nothing reports reads unavailable, never 0.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"kpigrid\">\n          \u003csc-for list=\"{{kpis}}\" as=\"k\" hint-placeholder-count=\"8\">\n            \u003cdiv class=\"card\" style=\"gap: 6px\">\n              \u003cdiv class=\"panel-head\">\u003cspan class=\"muted\" style=\"font-size: 0.82rem; font-weight: 600\">{{k.name}}\u003c/span>\u003cspan class=\"pill {{k.tone}}\">{{k.status}}\u003c/span>\u003c/div>\n              \u003cb class=\"kpival\">{{k.value}}\u003c/b>\n              \u003cspan class=\"muted\" style=\"font-size: 0.8rem\">Target: {{k.target}}\u003c/span>\n              \u003cspan class=\"meta\">{{k.source}}\u003c/span>\n            \u003c/div>\n          \u003c/sc-for>\n        \u003c/div>\n        \u003cdiv class=\"card\">\n          \u003ch3 class=\"lbl\">Dashboards · OpenShift console, Observe › Dashboards (Perses) · eight per instance\u003c/h3>\n          \u003cdiv class=\"tablebox\">\n            \u003ctable class=\"res\">\n              \u003cthead>\u003ctr>\u003cth>Dashboard\u003c/th>\u003cth>PersesDashboard\u003c/th>\u003cth>Shows\u003c/th>\u003c/tr>\u003c/thead>\n              \u003ctbody>\n                \u003csc-for list=\"{{dashboards}}\" as=\"d\" hint-placeholder-count=\"7\">\u003ctr>\u003ctd style=\"font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 0.86rem; font-weight: 600\">{{d.name}}\u003c/td>\u003ctd>cmapi/{{d.id}}\u003c/td>\u003ctd class=\"muted\" style=\"white-space: normal; min-width: 260px\">{{d.what}}\u003c/td>\u003c/tr>\u003c/sc-for>\n              \u003c/tbody>\n            \u003c/table>\n          \u003c/div>\n          \u003cp class=\"foot\">Shipped by the Helm chart as PersesDashboards in the cmapi namespace, reading the hub's Thanos Querier. Sites that use Grafana set dashboards.provider to grafana or both.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/sc-if>\n\n    \u003cp class=\"foot\">Mockup with example data: cluster IDs, users, commits, scores and timings are illustrative. Times are UTC. This is the {{inst.display}} instance: API {{inst.api}}, portal {{inst.portal}}.\u003c/p>\n  \u003c/main>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script data-props='{\"instance\":{\"editor\":\"enum\",\"options\":[\"nonprod\",\"staging\",\"prod\"],\"default\":\"nonprod\"},\"startTab\":{\"editor\":\"enum\",\"options\":[\"workflow\",\"new\",\"quotas\",\"expiration\",\"requests\",\"approvals\",\"policies\",\"capacity\",\"kpis\"],\"default\":\"workflow\"},\"$preview\":{\"width\":1320,\"height\":1720}}'>\nvar BASE = Date.parse(\"2026-11-03T17:05:00Z\");\nfunction clock(t) { return new Date(BASE + t * 1000).toISOString().slice(11, 19); }\nfunction dur(t) { var m = Math.floor(t / 60), s = t % 60; return (m ? m + \" min \" : \"\") + s + \" s\"; }\nfunction clone(o) { return JSON.parse(JSON.stringify(o)); }\nfunction ev(s, t, type, actor, msg, tone) { s.events.push({ t: t, type: type, actor: actor, msg: msg, tone: tone || \"\" }); }\nfunction J(o) { return JSON.stringify(o, null, 2); }\n\nvar LANES = [\n  { id: \"caller\", name: \"Caller\", sub: \"Portal, CLI or pipeline\" },\n  { id: \"keycloak\", name: \"Keycloak\", sub: \"realm ephico2real\" },\n  { id: \"api\", name: \"cmapi-api\", sub: \"gateway on the hub\" },\n  { id: \"capacity\", name: \"cmapi-capacity\", sub: \"internal, ClusterIP\" },\n  { id: \"git\", name: \"cluster-configs\", sub: \"pull request + CI\" },\n  { id: \"argo\", name: \"Argo CD\", sub: \"on the cluster\" }\n];\nvar LANE_LABEL = { caller: \"Caller\", keycloak: \"Keycloak\", api: \"cmapi-api\", capacity: \"cmapi-capacity\", git: \"Git\", argo: \"Argo CD\" };\nvar LANE_COLOR = { caller: \"#6a57c9\", keycloak: \"#a03c86\", api: \"#1f5fd1\", capacity: \"#5b7d1a\", git: \"#b15a1c\", argo: \"#0e8487\" };\nvar MARK = { pass: \"✓\", warn: \"!\", fail: \"✕\", pending: \"•\" };\n\nfunction baseNodes(prev) {\n  return { caller: \"Ready\", keycloak: \"Session active\", api: \"Idle\", capacity: \"Last snapshot 17:00\", git: \"main @ \" + prev, argo: \"Synced @ \" + prev };\n}\n\nfunction createScenario(o) {\n  var prod = o.env === \"prod\", auto = o.env === \"rnd\" || o.env === \"dev\", group = APPROVER[o.env];\n  var dir = \"clusters/\" + o.cluster + \"/namespaces/\" + o.ns + \"/\"; var file = dir + \"namespace.yaml\";\n  var T = o.times;\n  var init = {\n    cluster: o.cluster, node: baseNodes(o.prevSha), req: null, pr: null, cap: null,\n    capNote: \"No placement yet. Snapshots for every cluster are already stored; the newest was taken at 17:00.\",\n    argo: { app: \"cluster-configs-\" + o.cluster, rev: o.prevSha, sync: \"Synced\", health: \"Healthy\", resources: [], note: o.ns + \" does not exist on \" + o.cluster + \" yet.\" },\n    events: [], blocked: {}\n  };\n  var steps = [];\n  var ranked = o.ranked, top = ranked[0];\n    var A = o.actor || { user: \"ola\", email: \"ola@ephico2real.com\", azp: \"cmapi-portal-\" + o.inst, role: \"cmapi-requester\", roles: [\"cmapi-requester\", \"cmapi-viewer\"], groups: [\"/cmapi/cmapi-requesters\"], team: \"payments\", agent: false, sub: \"6f1c2a9e-4b7d-4e21-9c3a-0d8e5b7f2a14\" };\n  steps.push({\n    lane: \"caller\", title: \"Ask where it should go\",\n    body: (A.agent ? \"An AI agent, signed in to cmapi as \u003cb>bot-user\u003c/b>, onboards a namespace. \" : \"\") + \"Before creating \u003cb>\" + o.ns + \"\u003c/b>, \" + (A.agent ? \"the agent\" : \"the portal\") + \" asks cmapi to place a \" + o.env + \" namespace of tier medium (16 cores, 32Gi, 100 pods) for the \" + A.team + \" team in region us-central. The caller does not have to know which \" + o.env + \" clusters have room.\",\n    code: { label: \"POST /api/v1/capacity:place\", text: 'curl -s -X POST \"$CMAPI/capacity:place\" \\\\\\n  -H \"Authorization: Bearer $TOKEN\" \\\\\\n  -H \"Content-Type: application/json\" \\\\\\n' + \"  -d '{\\\"environment\\\": \\\"\" + o.env + \"\\\", \\\"team\\\": \\\"\" + A.team + \"\\\", \\\"tier\\\": \\\"medium\\\",\\n       \\\"constraints\\\": {\\\"region\\\": \\\"us-central\\\"}}'\" },\n    apply: function (s) { s.node.caller = \"POST sent\"; s.node.api = \"Receiving\"; }\n  });\n  steps.push({\n    lane: \"keycloak\", title: A.agent ? \"The agent's token came from Keycloak\" : \"The token came from Keycloak\",\n    body: A.agent\n      ? \"The agent signed in through the \u003cb>cmapi-automation\u003c/b> client as \u003cb>bot-user\u003c/b>, a local Keycloak account (not from LDAP) whose password it reads from a vault. bot-user holds one client role, \u003cb>cmapi-onboarding\u003c/b>, assigned to the account itself; it has no employee ID. Keycloak is \u003cb>not called\u003c/b> on this request: cmapi verifies the signature offline with its cached copy of the realm keys.\"\n      : \"The portal got this token at sign-in (Authorization Code + PKCE; Keycloak checked the password against LDAP) and refreshes it every 5 minutes. ola holds \u003cb>cmapi-requester\u003c/b> through the Keycloak group /cmapi/cmapi-requesters. Keycloak is \u003cb>not called\u003c/b> on this request: cmapi verifies the signature offline with its cached copy of the realm keys.\",\n    code: { label: \"Decoded access token (5-minute lifetime)\", text: (function () {\n      var t = { iss: \"https://sso.ephico2real.com/realms/ephico2real\", aud: INSTANCES[o.inst].aud, azp: A.azp, sub: A.sub, preferred_username: A.user, email: A.email };\n      if (!A.agent) t.employee_id = \"1001\";\n      t.groups = A.groups; t.resource_access = {}; t.resource_access[INSTANCES[o.inst].aud] = { roles: A.roles }; t.exp = 1793725800;\n      return J(t); })() },\n    apply: function (s) { s.node.keycloak = \"Not contacted (JWKS cached)\"; }\n  });\n\n  steps.push({\n    lane: \"api\", title: \"Authenticate and authorize\",\n    body: \"cmapi checks issuer, audience and expiry, then the roles in the token. \u003cb>\" + A.role + \"\u003c/b> grants namespaces:create in every environment this instance serves (config/authz-roles.yaml). There is no team or namespace-name rule: any team may be named, and the name only has to be a DNS-1123 label that is not reserved and not a namespace on a cluster outside cmapi.\" + (A.agent ? \" cmapi-onboarding is an automation role, so the missing employee ID is expected and the request is recorded as automated.\" : \"\") + \" Placement may consider any \" + o.env + \" cluster in region us-central.\",\n    checks: [\n      { s: \"pass\", l: \"JWT signature, issuer, audience, expiry\", n: \"offline, JWKS cache\" },\n      { s: \"pass\", l: \"Role grants namespaces:create\", n: A.role + \" · \" + o.env },\n      { s: \"pass\", l: \"Name allowed\", n: \"not reserved, not on a cluster outside cmapi\" }\n    ].concat(A.agent ? [{ s: \"pass\", l: \"Automation account\", n: \"no employee ID needed (identity.automationRoles)\" }] : []),\n    code: { label: \"Role policy (config/authz-roles.yaml, excerpt)\", text: \"roles:\\n  cmapi-onboarding: {}   # viewer + namespaces:create, requests:cancel: create only\\n  cmapi-requester: {}    # onboarding + namespaces:write, quotas:write, serviceaccounts:write, grants:write\\n\\n# the token: resource_access.\" + INSTANCES[o.inst].aud + \".roles = [\" + A.roles.join(\", \") + \"]\\n# no scope bindings: no clusters, namespace patterns or teams per caller\" },\n    apply: function (s) { s.node.api = \"Authorized\"; }\n  });\n  steps.push({\n    lane: \"api\", also: [\"capacity\"], title: \"Place from stored snapshots\",\n    body: \"Placement reads the newest complete capacity snapshot of each candidate from the capacity schema, adds committed quota from the API watch cache and active reservations, and ranks what passes the hard filters. \u003cb>No Thanos query runs\u003c/b>; Thanos was read by cmapi-capacity's snapshot job at 17:00. \" + (prod ? \"In prod a cluster must still fit after losing its largest zone. \" : \"\") + \"The top cluster gets a 15-minute reservation under its advisory lock.\",\n    checks: [\n      { s: \"pass\", l: \"Snapshot age 5 min\", n: \"limit: 2 intervals (60 min)\" },\n      { s: \"pass\", l: top.cluster + \" ranked first, reserved\", n: \"score \" + top.score },\n      o.excluded.length ? { s: \"warn\", l: o.excluded.length + \" cluster\" + (o.excluded.length > 1 ? \"s\" : \"\") + \" excluded with a reason\", n: o.excluded.map(function (x) { return x.reason; }).join(\", \") } : { s: \"pass\", l: \"No cluster excluded\", n: \"\" }\n    ],\n    code: { label: \"200 · \" + o.placementId, text: J({ placementId: o.placementId, asOf: \"2026-11-03T17:00:00Z\", ranked: ranked.map(function (r, i) { var c = { clusterId: r.cluster, score: r.score, reserved: i === 0, cpu: { quotaHeadroomBefore: r.before, quotaHeadroomAfter: r.before - 16, usageP95: r.p95 }, memory: { quotaHeadroomBefore: r.mem + \"Gi\", quotaHeadroomAfter: (r.mem - 32) + \"Gi\" } }; if (prod) { c.cpu.zoneFailureHeadroomAfter = r.zf; c.memory.zoneFailureHeadroomAfter = r.zfMem + \"Gi\"; } c.boundBy = (r.before - 16) / r.before \u003c= (r.mem - 32) / r.mem ? \"cpu\" : \"memory\"; return c; }), excluded: o.excluded.map(function (x) { return { clusterId: x.cluster, reason: x.reason, detail: x.detail }; }) }) },\n    apply: function (s) {\n      s.node.api = \"Reserved on \" + top.cluster; s.node.capacity = \"Rows read (no Thanos call)\"; s.node.caller = \"Placement received\"
