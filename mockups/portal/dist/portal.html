;\n      s.cap = { title: \"Placement · \" + o.placementId, pill: { t: \"reserved 15 min\", tone: \"info\" },\n        meta: o.env + \" · tier medium · 16 cores, 32Gi · region us-central · snapshot 17:00 (5 min old) · overcommit cpu \" + o.overcommit + \", memory \" + { rnd: \"1.25\", dev: \"1.25\", qa: \"1.1\", uat: \"1.0\", prod: \"1.0\" }[o.env],\n        cols: prod ? [\"Cluster\", \"Score\", \"CPU headroom\", \"Memory headroom\", \"Zone-loss after\", \"p95\"] : [\"Cluster\", \"Score\", \"CPU headroom\", \"Memory headroom\", \"p95\"],\n        rows: ranked.map(function (r, i) { var row = [r.cluster + (i === 0 ? \" ★\" : \"\"), String(r.score), r.before + \" → \" + (r.before - 16), r.mem + \" → \" + (r.mem - 32) + \" Gi\"]; if (prod) row.push(r.zf + \" cores · \" + r.zfMem + \" Gi\"); row.push(String(r.p95)); return row; }).concat(o.excluded.map(function (x) { var row = [x.cluster, { t: \"excluded\", tone: \"warn\" }, x.reason, \"—\"]; if (prod) row.push(\"—\"); row.push(\"—\"); return row; })),\n        note: o.excluded.length ? \"Excluded: \" + o.excluded.map(function (x) { return x.cluster + \" \" + x.detail; }).join(\"; \") + \".\" : \"Every candidate passed the hard filters.\" };\n      ev(s, 0, \"placed\", \"api-bot\", o.placementId + \": \" + top.cluster + \" reserved for 15 min\", \"ok\");\n    }\n  });\n  steps.push({\n    lane: \"caller\", title: \"Submit the create with the placement\",\n    body: \"The portal now creates \u003cb>\" + o.ns + \"\u003c/b> on \u003cb>\" + top.cluster + \"\u003c/b>, carrying the placementId so the reservation becomes this request's own. The cluster ID sits in the path and in the body; a mismatch would be rejected with 422.\",\n    code: { label: \"POST /api/v1/clusters/\" + o.cluster + \"/namespaces\", text: 'curl -s -X POST \"$CMAPI/clusters/' + o.cluster + '/namespaces\" \\\\\\n  -H \"Authorization: Bearer $TOKEN\" \\\\\\n  -H \"Content-Type: application/json\" \\\\\\n  -H \"Idempotency-Key: ' + o.idem + '\" \\\\\\n' + \"  -d '{\\n\" + '    \"clusterId\": \"' + o.cluster + '\",\\n    \"namespace\": \"' + o.ns + '\",\\n    \"env\": \"' + o.env + '\",\\n    \"tier\": \"medium\",\\n    \"placementId\": \"' + o.placementId + '\",\\n    \"labels\": {\"cmapi.net/team\": \"' + A.team + '\"},\\n    \"annotations\": {\"cmapi.net/team-dl\": \"' + A.team + '-team@ephico2real.com\"}\\n' + \"  }'\" },\n    apply: function (s) { s.node.caller = \"POST sent\"; s.node.api = \"Receiving\"; }\n  });\n  steps.push({\n    lane: \"api\", title: \"Plan: idempotency, lock, validate, render\",\n    body: \"The Idempotency-Key is new and no open request targets this namespace. The namespaces plugin renders the namespace folder as plain manifests: the Namespace, the ResourceQuota and LimitRange written out from tiers.yaml (medium), and the token-issuer RoleBinding. The Kyverno policy bundle and kubeconform run on those files offline. Who asked comes from the token (\" + A.user + \", \" + A.email + \"), not from the body; \" + (A.agent ? \"bot-user holds an automation role, so no employee ID is needed and the request is stored with automated: true.\" : \"the employee ID is stored with the request, never in Git.\") + \" The capacity check uses the reservation, so it cannot be raced by another request. The request row is written as validated.\",\n    checks: [\n      { s: \"pass\", l: \"Idempotency key new, object lock free\", n: \"\" },\n      { s: \"pass\", l: \"Kyverno bundle v1.4.0\", n: \"7 of 7 policies pass\" },\n      { s: \"pass\", l: \"kubeconform\", n: o.cluster + \" OpenAPI\" },\n      { s: \"pass\", l: \"Capacity: fits on fresh data\", n: \"reservation \" + o.placementId }\n    ],\n    code: { label: \"Plan diff · \" + file, diff: true, text: \"+++ \" + file + \"\\n+apiVersion: v1\\n+kind: Namespace\\n+metadata:\\n+  name: \" + o.ns + \"\\n+  labels:\\n+    cmapi.net/cluster-id: \" + o.cluster + \"\\n+    cmapi.net/env: \" + o.env + '\\n+    cmapi.net/managed: \"true\"\\n+    cmapi.net/requested-by-user: ' + A.user + '\\n+    cmapi.net/tier: medium\\n+    cmapi.net/team: ' + A.team + '\\n+  annotations:\\n+    argocd.argoproj.io/sync-options: Prune=confirm,ServerSideApply=true\\n+    cmapi.net/request-id: ' + o.reqId + '\\n+    cmapi.net/requested-by: ' + A.email + '\\n+    cmapi.net/team-dl: ' + A.team + '-team@ephico2real.com\\n\\n+++ ' + dir + 'resourcequota.yaml   requests.cpu 16 · requests.memory 32Gi · pods 100\\n+++ ' + dir + 'limitrange.yaml      tier medium defaults\\n+++ ' + dir + 'token-issuer-rolebinding.yaml' },\n    apply: function (s) {\n      s.node.api = \"Plan ready\";\n      s.req = { id: o.reqId, status: \"validated\", cluster: o.cluster, ns: o.ns, action: \"create Namespace\", rule: \"—\", need: 0, have: 0, pr: \"—\", lead: \"\" };\n      ev(s, T.validated, \"validated\", \"api-bot\", \"Plan passed: policies, kubeconform, capacity\", \"ok\");\n    }\n  });\n\nvar _auto = auto, _group = group, _rule = o.env + \"-create\", _hash = \"sha256:\" + o.sha + \"9e41\";\nif (!_auto) T = { validated: T.validated, approved: T.approved, pr: T.approved + 5, ci: T.approved + 125, merged: T.approved + 130, synced: T.approved + 130 + (T.synced - T.merged) };\nif (!_auto) {\n  steps.push({\n    lane: \"api\", title: \"Waiting for approval in cmapi\",\n    body: o.env + \" needs one approval for a create, from \" + _group + \". No auto-approval policy covers it, and no pattern or threshold adds more. cmapi answers \u003cb>202 pending_approval\u003c/b>, and \u003cb>nothing is written to Git yet\u003c/b>. The approval channels tell \" + _group + \" through the portal's Approvals tab and an email with a signed link that opens the request.\",\n    checks: [\n      { s: \"pass\", l: \"Rule \" + _rule, n: \"1 approval from \" + _group },\n      { s: \"pending\", l: \"Approvals\", n: \"0 of 1\" },\n      { s: \"pass\", l: \"Channels notified\", n: \"portal, email\" }\n    ],\n    code: { label: \"202 Accepted → caller\", text: J({ requestId: o.reqId, clusterId: o.cluster, plugin: \"namespaces\", action: \"create\", namespace: o.ns, status: \"pending_approval\", prUrl: null, approval: { rule: _rule, requiredCount: 1, count: 0, autoApproved: false, eligibleGroup: _group }, placementId: o.placementId, links: { self: \"/api/v1/requests/\" + o.reqId, approve: \"/api/v1/requests/\" + o.reqId + \":approve\" } }) },\n    apply: function (s) { s.req.status = \"pending_approval\"; s.req.rule = _rule; s.req.need = 1; s.node.api = \"Waiting for \" + _group; s.node.caller = \"202 received\"; s.prMsg = \"No pull request yet. cmapi opens one only after the request is approved.\"; ev(s, T.validated, \"pending_approval\", \"api-bot\", \"Notified \" + _group + \" (portal, email)\"); }\n  });\n  steps.push({\n    lane: \"api\", also: [\"caller\"], title: \"An approver approves in cmapi\",\n    body: \"\u003cb>\" + o.reviewer + \"\u003c/b> opens the request from the email link, reads the plan in the portal and approves. cmapi checks the approver role and the \" + _group + \" group in their token, that their role grants requests:approve in \" + o.env + \", and that they are not the requester. The count reaches 1 of 1, capacity is checked again on fresh data (the reservation still holds), and the request is \u003cb>approved\u003c/b>.\",\n    checks: [\n      { s: \"pass\", l: \"Approver role and group\", n: _group },\n      { s: \"pass\", l: \"Not the requester or the pipeline's owner\", n: \"\" },\n      { s: \"pass\", l: \"Capacity checked again\", n: \"still fits\" }\n    ],\n    code: { label: \"POST /api/v1/requests/\" + o.reqId + \":approve\", text: \"curl -s -X POST \\\"$CMAPI/requests/\" + o.reqId + \":approve\\\" \\\\\\n  -H \\\"Authorization: Bearer $TOKEN\\\" \\\\\\n  -d '{\\\"comment\\\": \\\"Placement and quota look right\\\"}'\\n\\n\" + J({ requestId: o.reqId, status: \"approved\", approval: { rule: _rule, requiredCount: 1, count: 1, approvers: [o.reviewer] } }) },\n    apply: function (s) { s.req.status = \"approved\"; s.req.have = 1; s.node.api = \"Approved\"; s.node.caller = \"Approved by \" + o.reviewer.split(\"@\")[0]; ev(s, T.approved, \"approved\", o.reviewer, \"1 of 1 approvals (\" + _group + \")\", \"ok\"); }\n  });\n} else {\n  steps.push({\n    lane: \"api\", title: \"Auto-approved by policy\",\n    body: o.env + \" needs one approval for a create, but the \u003cb>baseline-rnd-namespace\u003c/b> policy matches: plugin namespaces, action create, environment \" + o.env + \", tier medium, region us-central. Every guard passes: not a delete, no threshold added approvers, placement fits on fresh data, no plan warnings, and the team has used 3 of its 20 a day. The request is approved at once by \u003ccode>auto:baseline-rnd-namespace\u003c/code>, and cmapi answers \u003cb>202 approved\u003c/b>.\" + (A.agent ? \" An agent's request follows the same rules as anyone's; approval-rules.yaml can treat agent requests differently with the \u003ccode>automated\u003c/code> fact, for example to auto-approve only small tiers.\" : \"\"),\n    checks: [\n      { s: \"pass\", l: \"Master switch and policy enabled\", n: \"kill switch not paused\" },\n      { s: \"pass\", l: \"Guards: no delete, no extra approvers, no warnings\", n: \"\" },\n      { s: \"pass\", l: \"Placement fits on fresh data\", n: \"\" },\n      { s: \"pass\", l: \"Team allowance\", n: \"3 of 20 today\" }\n    ],\n    code: { label: \"202 Accepted → caller\", text: J({ requestId: o.reqId, clusterId: o.cluster, plugin: \"namespaces\", action: \"create\", namespace: o.ns, status: \"approved\", prUrl: null, approval: { rule: _rule, requiredCount: 0, autoApproved: true, autoPolicy: \"baseline-rnd-namespace\" }, placementId: o.placementId, links: { self: \"/api/v1/requests/\" + o.reqId } }) },\n    apply: function (s) { s.req.status = \"approved\"; s.req.rule = \"auto: baseline-rnd-namespace\"; s.req.need = 0; s.node.api = \"Auto-approved\"; s.node.caller = \"202 received\"; ev(s, T.validated, \"approved\", \"auto:baseline-rnd-namespace\", \"requiredCount 0\", \"ok\"); }\n  });\n}\nsteps.push({\n  lane: \"git\", title: \"Only now: the worker opens a bot PR\",\n  body: \"The request is approved, so the open_pr job renders the approved plan, confirms its hash, pushes \u003ccode>\" + o.branch + \"\u003c/code> and opens PR #\" + o.pr + \" as the cmapi bot, with the request ID and plan hash in its body and auto-merge on. No reviewers are requested: Git reviews carry no authority.\",\n  code: { label: \"PR #\" + o.pr + \" body (excerpt)\", text: \"cmapi request   \" + o.reqId + \" · approved (\" + (_auto ? \"auto:baseline-rnd-namespace\" : o.reviewer) + \")\\nplan hash       \" + _hash + \"\\nplacement       \" + o.placementId + \" · score \" + top.score + \" · cpu \" + top.before + \" → \" + (top.before - 16) + \" cores\\npolicy bundle   v1.4.0, 7/7 pass\" },\n  apply: function (s) {\n    s.req.status = \"pr_open\"; s.req.pr = \"#\" + o.pr; s.prMsg = \"\";\n    s.pr = { num: o.pr, title: \"Create namespace \" + o.ns + \" on \" + o.cluster, branch: o.branch, state: \"open\", label: \"cmapi/\" + o.reqId, auto: true,\n      files: [{ path: dir + \"namespace.yaml\", add: 19, del: 0 }, { path: dir + \"resourcequota.yaml\", add: 16, del: 0 }, { path: dir + \"limitrange.yaml\", add: 17, del: 0 }, { path: dir + \"token-issuer-rolebinding.yaml\", add: 17, del: 0 }],\n      checks: [{ n: \"kyverno-bundle\", s: \"pending\" }, { n: \"kubeconform\", s: \"pending\" }, { n: \"cmapi-check\", s: \"pending\", note: \"approved · hash\" }],\n      reviewers: [] };\n    s.node.git = \"PR #\" + o.pr + \" open\"; s.node.api = \"Tracking\";\n    ev(s, T.pr, \"pr_opened\", \"api-bot\", \"PR #\" + o.pr + \" on \" + o.branch);\n  }\n});\nsteps.push({\n  lane: \"git\", title: \"CI and the cmapi check pass\",\n  body: \"CI runs the same Kyverno bundle and kubeconform, so a hand edit to the branch cannot slip through. The cmapi check asks cmapi whether request \" + o.reqId + \" is approved and whether the PR head matches the approved plan hash; a push after approval, or a PR with no approved request, fails it.\",\n  code: { label: \"cmapi check\", text: \"request     \" + o.reqId + \"\\nstatus      approved (\" + (_auto ? \"auto:baseline-rnd-namespace\" : \"1 of 1, \" + _group) + \")\\nplan hash   \" + _hash + \" = PR head\\nresult      pass\" },\n  apply: function (s) {\n    s.pr.checks = [{ n: \"kyverno-bundle\", s: \"pass\" }, { n: \"kubeconform\", s: \"pass\" }, { n: \"cmapi-check\", s: \"pass\", note: \"approved · hash matches\" }];\n    s.node.git = \"All checks green\";\n    ev(s, T.ci, \"ci_passed\", \"ci\", \"Policy, kubeconform and the cmapi check green\", \"ok\");\n  }\n});\nsteps.push({\n  lane: \"git\", title: \"The bot merges to main\",\n  body: \"With every check green the cmapi bot merges PR #\" + o.pr + \"; only the bot may merge under \u003ccode>clusters/\u003c/code>. Commit \u003ccode>\" + o.sha + \"\u003c/code> is the desired state for \" + o.cluster + \", and the Git webhook moves the request to merged.\",\n  code: { label: \"Webhook → POST /api/v1/webhooks/git\", text: J({ event: \"pull_request.closed\", merged: true, pr: o.pr, merge_commit: o.sha, merged_by: \"cmapi-bot\", base: \"main\", signature: \"verified\" }) },\n  apply: function (s) { s.pr.state = \"merged\"; s.req.status = \"merged\"; s.node.git = \"main @ \" + o.sha; ev(s, T.merged, \"merged\", \"cmapi-bot\", \"Merged as \" + o.sha); }\n});\n  steps.push({\n    lane: \"argo\", title: \"Argo CD on \" + o.cluster + \" syncs\",\n    body: \"The cluster's own Argo CD watches only \u003ccode>clusters/\" + o.cluster + \"/\u003c/code>. It finds \" + o.sha + \", creates the Namespace, and Kyverno admission checks it against the same bundle. The ResourceQuota, LimitRange and token-issuer RoleBinding come from the same folder, so what syncs is exactly what was reviewed and hashed; nothing on the cluster expands them. cmapi learns the result \" + (prod ? \"from Argo CD Notifications (syncSignal: notify on \" + o.cluster + \").\" : \"by polling the root Application every 30 seconds (syncSignal: poll).\"),\n    checks: [\n      { s: \"pass\", l: \"Kyverno admission\", n: \"bundle v1.4.0, Enforce\" },\n      { s: \"pass\", l: \"Namespace created\", n: \"wave 0\" },\n      { s: \"pass\", l: \"Quota, limits and RoleBinding synced\", n: \"from the namespace folder\" }\n    ],\n    code: { label: \"Live ResourceQuota on \" + o.cluster, text: \"apiVersion: v1\\nkind: ResourceQuota\\nmetadata:\\n  name: \" + o.ns + \"-quota\\n  namespace: \" + o.ns + \"\\n  labels:\\n    cmapi.net/cluster-id: \" + o.cluster + \"\\n    cmapi.net/tier: medium\\nspec:\\n  hard:\\n    requests.cpu: \\\"16\\\"\\n    requests.memory: 32Gi\\n    pods: \\\"100\\\"\" },\n    apply: function (s) {\n      s.argo.rev = o.sha; s.argo.sync = \"OutOfSync\"; s.argo.health = \"Progressing\";\n      s.argo.resources = [\n        { wave: \"0\", kind: \"Namespace\", name: o.ns, by: \"Argo CD\", st: \"Synced\" },\n        { wave: \"—\", kind: \"ResourceQuota\", name: o.ns + \"-quota\", by: \"Argo CD\", st: \"Created\" },\n        { wave: \"—\", kind: \"LimitRange\", name: o.ns + \"-limits\", by: \"Argo CD\", st: \"Created\" }\n      ];\n      s.node.argo = \"Syncing @ \" + o.sha;\n    }\n  });\n  steps.push({\n    lane: \"argo\", also: [\"api\"], title: \"Synced; reservation released\",\n    body: \"The Application is Synced and Healthy. The status worker records synced, and the reservation ends once a direct read of \" + o.cluster + \" shows the new ResourceQuota, so those 16 cores are counted once, as committed quota. Lead time: \u003cb>\" + dur(T.synced) + \"\u003c/b>\" + (!auto ? \", most of it waiting for review.\" : \", with no person involved.\"),\n    code: { label: \"GET /api/v1/requests/\" + o.reqId, text: J({ requestId: o.reqId, clusterId: o.cluster, status: \"synced\", prNumber: o.pr, mergeCommit: o.sha, syncStatus: \"Synced\", health: \"Healthy\", reservation: { id: o.placementId, released: \"observed\" }, leadTimeSeconds: T.synced }) },\n    apply: function (s) {\n      s.argo.sync = \"Synced\"; s.argo.health = \"Healthy\";\n      s.argo.resources.forEach(function (r) { r.st = \"Synced\"; });\n      s.req.status = \"synced\"; s.req.lead = dur(T.synced);\n      s.cap.pill = { t: \"released: observed\", tone: \"ok\" };\n      s.cap.note = \"The reservation ended when the ResourceQuota appeared in the watch cache; the 16 cores now count as committed quota. The 17:30 snapshot will include the namespace's usage.\";\n      s.node.argo = \"Synced @ \" + o.sha; s.node.api = \"Request closed\"; s.node.caller = \"Sees synced\";\n      ev(s, T.synced, \"synced\", \"argocd\", o.cluster + \" Synced and Healthy at \" + o.sha, \"ok\");\n    }\n  });\n  if (A.agent) steps.push({\n    lane: \"caller\", title: \"The agent cannot change or delete it\",\n    body: \"cmapi-onboarding creates and nothing else. When the agent tries to raise \" + o.ns + \" to tier large or delete it, cmapi answers \u003cb>403\u003c/b> before any plan: no role in its token grants namespaces:write. Changes go to a person or pipeline holding cmapi-requester, through the normal approval rules.\",\n    checks: [{ s: \"fail\", l: \"PATCH tier large\", n: \"403 forbidden\" }, { s: \"fail\", l: \"DELETE\", n: \"403 forbidden\" }],\n    code: { label: \"403 · application/problem+json\", text: J({ type: \"https://cmapi.ephico2real.com/problems/forbidden\", title: \"forbidden\", status: 403, code: \"forbidden\", detail: \"Missing permission namespaces:write: no role in your token grants it (roles: ['cmapi-onboarding'])\" }) },\n    apply: function (s) { s.node.caller = \"403 on change or delete\"; ev(s, T.synced + 60, \"refused\", \"bot-user\", \"PATCH and DELETE: namespaces:write not granted\", \"fail\"); }\n  });\n  return { init: init, steps: steps };\n}\n\nfunction quotaScenario() {\n  var c = \"OCP_GF1\", ns = \"payments-prod\", req = \"req-20261103-9c02\", pr = 418, sha = \"c7d21f0\", prev = \"a41c9e2\";\n  var branch = c + \"/\" + ns + \"/\" + req;\n  var dir = \"clusters/\" + c + \"/namespaces/\" + ns + \"/\"; var file = dir + \"resourcequota.yaml\";\n  var init = {\n    cluster: c, node: baseNodes(prev), req: null, pr: null, cap: null,\n    capNote: \"No usage read yet. Namespace usage is never stored per interval; it is read live only when a plan needs it.\",\n    argo: { app: \"cluster-configs-\" + c, rev: prev, sync: \"Synced\", health: \"Healthy\", note: \"\",\n      resources: [\n        { wave: \"0\", kind: \"Namespace\", name: ns, by: \"Argo CD\", st: \"Synced\", ch: \"tier: medium\" },\n        { wave: \"—\", kind: \"ResourceQuota\", name: ns + \"-quota\", by: \"Argo CD\", st: \"Synced\", ch: \"cpu 16 · memory 32Gi\" },\n        { wave: \"—\", kind: \"LimitRange\", name: ns + \"-limits\", by: \"Argo CD\", st: \"Synced\", ch: \"\" }\n      ] },\n    events: [], blocked: {}\n  };\n  var steps = [];\n  steps.push({\n    lane: \"caller\", title: \"Ask for a bigger tier\",\n    body: \"The team asks to move \u003cb>\" + ns + \"\u003c/b> from tier medium to large, doubling its quota from 16 to 32 cores and from 32 to 64 Gi of memory. The PATCH carries the ETag from their last GET in If-Match, so a stale edit cannot overwrite someone else's change.\",\n    code: { label: \"PATCH /api/v1/clusters/\" + c + \"/namespaces/\" + ns, text: 'curl -s -X PATCH \"$CMAPI/clusters/' + c + '/namespaces/' + ns + '\" \\\\\\n  -H \"Authorization: Bearer $TOKEN\" \\\\\\n  -H \"Content-Type: application/merge-patch+json\" \\\\\\n  -H \"Idempotency-Key: 3d9e0b7a-55c1-4f0e-8a2b-6f1d9c4e2a77\" \\\\\\n' + \"  -H 'If-Match: \\\"9b2e4f1c8a7d\\\"' \\\\\\n  -d '{\\\"clusterId\\\": \\\"\" + c + \"\\\", \\\"tier\\\": \\\"large\\\",\\n       \\\"justification\\\": \\\"Peak-season load test\\\"}'\" },\n    apply: function (s) { s.node.caller = \"PATCH sent\"; s.node.api = \"Receiving\"; }\n  });\n  steps.push({\n    lane: \"api\", title: \"Authenticate, authorize, lock\",\n    body: \"The Keycloak token is verified offline, cmapi-requester grants quotas:write in prod (config/authz-roles.yaml); there is no team or namespace scope to check. The If-Match ETag equals the Git blob SHA of resourcequota.yaml, and no other request is open on this namespace.\",\n    checks: [\n      { s: \"pass\", l: \"JWT and role\", n: \"cmapi-requester · \" + c + \" · prod\" },\n      { s: \"pass\", l: \"If-Match matches current ETag\", n: \"9b2e4f1c8a7d\" },\n      { s: \"pass\", l: \"Object lock free\", n: \"Namespace \" + ns }\n    ],\n    code: { label: \"Pre-checks\", text: \"etag (git blob of resourcequota.yaml)   9b2e4f1c8a7d   matches If-Match\\nopen request (\" + c + \", Namespace, \" + ns + \")   none\\nidempotency key 3d9e0b7a…   new\" },\n    apply: function (s) { s.node.api = \"Lock free\"; s.node.keycloak = \"Not contacted (JWKS cached)\"; }\n  });\n  steps.push({\n    lane: \"capacity\", title: \"Live 14-day usage from cmapi-capacity\",\n    body: \"This is the one request type that reads a namespace from Thanos. The quotas planner calls cmapi-capacity over the ClusterIP Service with its projected ServiceAccount token; the service checks it with TokenReview and queries \" + c + \"'s Thanos Querier for this namespace's last 14 days. The answer is cached for 10 minutes and \u003cb>not stored\u003c/b>.\",\n    checks: [\n      { s: \"pass\", l: \"Caller is cmapi-api\", n: \"TokenReview, audience cmapi-capacity\" },\n      { s: \"pass\", l: \"Coverage 98% of 14 days\", n: \"minimum 80%\" },\n      { s: \"warn\", l: \"32 cores is 3.3× the 14-day peak\", n: \"threshold 3×\" }\n    ],\n    code: { label: \"GET /v1/clusters/\" + c + \"/namespaces/\" + ns + \"/usage?window=14d (internal)\", text: \"                 now    7d avg   14d p95   14d peak   quota\\ncpu (cores)      6.1    5.4      8.2       9.6        16 → 32\\nmemory (Gi)      11.8   10.9     15.9      17.2       32 → 64\\nrequest / peak   cpu 32 / 9.6 = 3.3 · memory 64 / 17.2 = 3.7   > 3, flagged\" },\n    apply: function (s) {\n      s.node.capacity = \"Thanos read, cached 10 min\"; s.node.api = \"Planning\";\n      s.cap = { title: \"Live usage · \" + ns + \" · 14 days\", pill: { t: \"not stored\", tone: \"info\" },\n        meta: c + \" · read \" + clock(1) + \" · cached until \" + clock(601) + \" · coverage 0.98\",\n        cols: [\"Resource\", \"Now\", \"7d avg\", \"p95\", \"Peak\", \"Quota\"],\n        rows: [[\"cpu (cores)\", \"6.1\", \"5.4\", \"8.2\", \"9.6\", \"16 → 32\"], [\"memory (Gi)\", \"11.8\", \"10.9\", \"15.9\", \"17.2\", \"32 → 64\"]],\n        note: \"If Thanos had not answered in 10 seconds, the plan would carry usage: unavailable and need a platform approval instead of failing.\" };\n    }\n  });\n\nsteps.push({\n  lane: \"api\", title: \"Plan and capacity check\",\n  body: \"The tier change renders as the tier label on namespace.yaml and the large values from tiers.yaml in resourcequota.yaml and limitrange.yaml, and passes the policy bundle. The cluster check needs no Thanos call: \" + c + \"'s 17:00 snapshot plus committed quota and active reservations leaves 64 cores and 192 Gi of quota headroom, 48 cores and 160 Gi after this change, so it fits. But commitment rises from 78% to 84% on CPU and from 76% to 80% on memory, past prod's 80% warning line. The +16 cores and +32 Gi are reserved so no other request can take them while this one waits.\",\n  checks: [\n    { s: \"pass\", l: \"Kyverno bundle v1.4.0\", n: \"7 of 7 pass\" },\n    { s: \"warn\", l: \"Capacity fits, at warn\", n: \"cpu 78% → 84% · memory 76% → 80% (prod warns at 80%)\" },\n    { s: \"warn\", l: \"Plan warning\", n: \"request 3.3× the 14-day peak\" },\n    { s: \"pass\", l: \"Delta reserved\", n: \"+16 cores, +32 Gi on \" + c }\n  ],\n  code: { label: \"Diff · \" + file, diff: true, text: \"--- a/\" + file + \"\\n+++ b/\" + file + \"\\n   metadata:\\n     labels:\\n-      cmapi.net/tier: medium\\n+      cmapi.net/tier: large\\n   spec:\\n     hard:\\n-      requests.cpu: \\\"16\\\"\\n+      requests.cpu: \\\"32\\\"\\n-      requests.memory: 32Gi\\n+      requests.memory: 64Gi\\n-      pods: \\\"100\\\"\\n+      pods: \\\"200\\\"\\n\\n(namespace.yaml: the tier label · limitrange.yaml: tier large defaults)\" },\n  apply: function (s) {\n    s.req = { id: req, status: \"validated\", cluster: c, ns: ns, action: \"patch Namespace (tier)\", rule: \"—\", need: 0, have: 0, pr: \"—\", lead: \"\" };\n    s.node.api = \"Plan ready, 2 warnings\";\n    ev(s, 2, \"validated\", \"api-bot\", \"Plan passed with 2 warnings: capacity warn, 3.3× 14-day peak\", \"\");\n  }\n});\nsteps.push({\n  lane: \"api\", title: \"Waiting for three approvals in cmapi\",\n  body: \"A prod change needs one prod approver. Two thresholds each add one from platform-leads: the request-to-peak ratio is over 3, and capacity would be at warn. No auto-approval can apply, because thresholds added approvers and the plan has warnings. cmapi answers \u003cb>202 pending_approval\u003c/b>; nothing is written to Git while the approvers decide.\",\n  code: { label: \"202 Accepted → caller\", text: J({ requestId: req, status: \"pending_approval\", prUrl: null, approval: { rule: \"prod-change\", requiredCount: 3, count: 0, autoApproved: false, eligibleGroups: { \"prod-approvers\": 1, \"platform-leads\": 2 }, reasons: [\"Environment 'prod' requires 1 approval for change\", \"requestToPeakRatio 3.3 > 3 (+1 platform-leads)\", \"capacity warn on \" + c + \" (+1 platform-leads)\"] }, facts: { quotaIncreasePct: 100, requestToPeakRatio: 3.3, capacity: \"warn\" } }) },\n  apply: function (s) { s.req.status = \"pending_approval\"; s.req.rule = \"prod-change\"; s.req.need = 3; s.node.api = \"Waiting: 0 of 3\"; s.node.caller = \"202 received\"; s.prMsg = \"No pull request yet. cmapi opens one only after all three approvals.\"; ev(s, 3, \"pending_approval\", \"api-bot\", \"Notified prod-approvers and platform-leads (portal, email)\"); }\n});\nsteps.push({\n  lane: \"api\", also: [\"caller\"], title: \"Three approvals in cmapi\",\n  body: \"sre-lead approves for prod-approvers. Two platform-leads approve after reading the usage table in the portal, noting that the load test runs for three weeks and that \" + c + \" should be watched while it does. Each approval is a :approve call with the person's own token. At 3 of 3 cmapi checks capacity again (still fits, at warn) and the request is \u003cb>approved\u003c/b>.\",\n  checks: [\n    { s: \"pass\", l: \"sre-lead\", n: \"prod-approvers\" },\n    { s: \"pass\", l: \"platform-lead\", n: \"platform-leads (ratio)\" },\n    { s: \"pass\", l: \"capacity-lead\", n: \"platform-leads (capacity)\" },\n    { s: \"pass\", l: \"Capacity checked again\", n: \"fits, at warn\" }\n  ],\n  code: { label: \"GET /api/v1/requests/\" + req + \"/approval-status\", text: \"rule        prod-change\\nrequired    3 (prod-approvers 1, platform-leads 2)\\napproved    sre-lead, platform-lead, capacity-lead\\nrequester   excluded (dev-lead)\\nresult      3 of 3 · approved\" },\n  apply: function (s) {\n    s.req.status = \"approved\"; s.req.have = 3; s.node.api = \"Approved 3 of 3\"; s.node.caller = \"Approved\";\n    ev(s, 1260, \"approval_received\", \"sre-lead@ephico2real.com\", \"1 of 3 approvals\", \"\");\n    ev(s, 3480, \"approval_received\", \"platform-lead@ephico2real.com\", \"2 of 3 approvals\", \"\");\n    ev(s, 3600, \"approved\", \"capacity-lead@ephico2real.com\", \"3 of 3 approvals\", \"ok\");\n  }\n});\nsteps.push({\n  lane: \"git\", title: \"Bot PR with the evidence, merged on CI\",\n  body: \"Only now does the worker open PR #\" + pr + \", with the one-line change, the request ID, the plan hash and the usage table in its body. CI re-runs the bundle and kubeconform, and the cmapi check confirms the request is approved and the head matches the plan. The bot merges as \u003ccode>\" + sha + \"\u003c/code>.\",\n  code: { label: \"PR #\" + pr + \" body (excerpt)\", text: \"cmapi request   \" + req + \" · approved 3 of 3 (sre-lead, platform-lead, capacity-lead)\\nplan hash       sha256:\" + sha + \"77b0\\n                 now    7d avg   14d peak   quota\\ncpu (cores)      6.1    5.4      9.6        16 → 32\\nmemory (Gi)      11.8   10.9     17.2       32 → 64\\ncluster          cpu 78% → 84%, memory 76% → 80% committed (warn)\" },\n  apply: function (s) {\n    s.req.status = \"merged\"; s.req.pr = \"#\" + pr; s.prMsg = \"\";\n    s.pr = { num: pr, title: \"Change tier of \" + ns + \" to large on \" + c, branch: branch, state: \"merged\", label: \"cmapi/\" + req, auto: true,\n      files: [{ path: dir + \"namespace.yaml\", add: 1, del: 1 }, { path: file, add: 4, del: 4 }, { path: dir + \"limitrange.yaml\", add: 3, del: 3 }],\n      checks: [{ n: \"kyverno-bundle\", s: \"pass\" }, { n: \"kubeconform\", s: \"pass\" }, { n: \"cmapi-check\", s: \"pass\", note: \"approved 3 of 3 · hash matches\" }],\n      reviewers: [] };\n    s.node.git = \"main @ \" + sha;\n    ev(s, 3605, \"pr_opened\", \"api-bot\", \"PR #\" + pr + \" on \" + branch);\n    ev(s, 3725, \"ci_passed\", \"ci\", \"Policy, kubeconform and the cmapi check green\", \"ok\");\n    ev(s, 3730, \"merged\", \"cmapi-bot\", \"Merged as \" + sha);\n  }\n});\n  steps.push({\n    lane: \"argo\", title: \"Sync: label and quota applied\",\n    body: \"Argo CD on \" + c + \" applies the three changed files: the tier label, the ResourceQuota at 32 cores and 64Gi and the large LimitRange, exactly as written in Git. Kyverno admission passes both. The request closes as synced after \" + dur(3900) + \". The daily sweep keeps reading this namespace; if its peak stays near 9.6 cores it will record quota-oversized and propose a smaller quota, which still goes through a normal request.\",\n    code: { label: \"Live ResourceQuota on \" + c, diff: true, text: \"spec:\\n  hard:\\n-   requests.cpu: \\\"16\\\"\\n+   requests.cpu: \\\"32\\\"\\n-   requests.memory: 32Gi\\n+   requests.memory: 64Gi\" },\n    apply: function (s) {\n      s.argo.rev = sha;\n      s.argo.resources[0] = { wave: \"0\", kind: \"Namespace\", name: ns, by: \"Argo CD\", st: \"Synced\", ch: \"tier: large\" };\n      s.argo.resources[1] = { wave: \"—\", kind: \"ResourceQuota\", name: ns + \"-quota\", by: \"Argo CD\", st: \"Synced\", ch: \"cpu 16 → 32 · memory 32Gi → 64Gi\" };\n      s.req.status = \"synced\"; s.req.lead = dur(3900);\n      s.node.argo = \"Synced @ \" + sha; s.node.api = \"Request closed\"; s.node.caller = \"Sees synced\";\n      ev(s, 3900, \"synced\", \"argocd\", c + \" Synced and Healthy at \" + sha, \"ok\");\n    }\n  });\n  return { init: init, steps: steps };\n}\n\nfunction policyScenario() {\n  var c = \"OCP_GF1\", ns = \"payments-prod\";\n  var init = {\n    cluster: c, node: baseNodes(\"c7d21f0\"), req: null, pr: null, cap: null,\n    capNote: \"Not needed. A ServiceAccount grant has no capacity effect, so neither placement nor usage is read.\",\n    argo: { app: \"cluster-configs-\" + c, rev: \"c7d21f0\", sync: \"Synced\", health: \"Healthy\", note: \"\",\n      resources: [\n        { wave: \"1\", kind: \"ServiceAccount\", name: \"deploy-bot\", by: \"Argo CD\", st: \"Synced\", ch: \"\" },\n        { wave: \"2\", kind: \"RoleBinding\", name: \"deploy-bot-edit\", by: \"Argo CD\", st: \"Synced\", ch: \"ClusterRole edit\" }\n      ] },\n    events: [], blocked: {}\n  };\n  var steps = [];\n  steps.push({\n    lane: \"caller\", title: \"Ask for a cluster-admin grant\",\n    body: \"A pipeline (client svc-payments-ci, client-credentials token) asks to grant the ClusterRole \u003cb>cluster-admin\u003c/b> to the ServiceAccount deploy-bot in \" + ns + \", because it wants to create CRDs.\",\n    code: { label: \"POST …/serviceaccounts/deploy-bot/grants\", text: 'TOKEN=$(curl -s \"$KC/token\" -d grant_type=client_credentials \\\\\\n  -d client_id=svc-payments-ci -d client_secret=\"$SECRET\" | jq -r .access_token)\\n\\ncurl -s -X POST \"$CMAPI/clusters/' + c + '/namespaces/' + ns + '/serviceaccounts/deploy-bot/grants\" \\\\\\n  -H \"Authorization: Bearer $TOKEN\" -H \"Content-Type: application/json\" \\\\\\n  -H \"Idempotency-Key: 51aa0c3e-2f7b-4b8e-9d61-0e4c7a9b3f12\" \\\\\\n' + \"  -d '{\\\"clusterId\\\": \\\"\" + c + \"\\\", \\\"kind\\\": \\\"ClusterRole\\\", \\\"name\\\": \\\"cluster-admin\\\"}'\" },\n    apply: function (s) { s.node.caller = \"POST sent\"; s.node.api = \"Receiving\"; s.node.keycloak = \"Issued client token\"; }\n  });\n  steps.push({\n    lane: \"api\", title: \"Authenticate, authorize, lock\",\n    body: \"The service-account token is valid, its role, cmapi-requester, grants grants:write in prod. deploy-bot exists live in \" + ns + \", and no open request targets this grant.\",\n    checks: [\n      { s: \"pass\", l: \"JWT and role\", n: \"svc-payments-ci · grants:write\" },\n      { s: \"pass\", l: \"ServiceAccount exists\", n: ns + \"/deploy-bot\" },\n      { s: \"pass\", l: \"Object lock free\", n: \"\" }\n    ],\n    code: { label: \"Pre-checks\", text: \"subject            ServiceAccount \" + ns + \"/deploy-bot   exists\\nopen request       none\\nidempotency key    51aa0c3e…   new\" },\n    apply: function (s) { s.node.api = \"Lock free\"; }\n  });\n  steps.push({\n    lane: \"api\", title: \"Plan fails the policy bundle\",\n    body: \"The sa-grants plugin renders the RoleBinding and the Kyverno CLI evaluates it. rbac-allowlist rejects it: cluster-admin is not grantable to a ServiceAccount. cmapi returns 422 at once. No request row, branch or PR is created; the failure is counted in \u003ccode>cmapi_validation_failures_total\u003c/code>.\",\n    checks: [\n      { s: \"pass\", l: \"naming, labels, rbac-subjects\", n: \"pass\" },\n      { s: \"fail\", l: \"rbac-allowlist\", n: \"cluster-admin not allowlisted\" }\n    ],\n    code: { label: \"422 · application/problem+json\", text: J({ type: \"https://cmapi.ephico2real.com/problems/policy-violation\", title: \"Grant not allowed\", status: 422, detail: \"ClusterRole cluster-admin is not on the ServiceAccount allowlist\", clusterId: c, policy: \"rbac-allowlist\", rule: \"sa-clusterrole-allowlist\", errors: [{ field: \"name\", code: \"not_allowlisted\" }] }) },\n    apply: function (s) {\n      s.req = { id: \"not recorded\", status: \"rejected at plan\", cluster: c, ns: ns, action: \"grant ClusterRole to SA\", rule: \"—\", need: 0, have: 0, pr: \"none\", lead: \"\" };\n      s.blocked = { git: true, argo: true };\n      s.node.api = \"422 returned\"; s.node.caller = \"422 received\"; s.node.git = \"Not reached\"; s.node.argo = \"Not reached\";\n      ev(s, 0, \"validation_failed\", \"api-bot\", \"rbac-allowlist: cluster-admin not grantable (metric only, no row)\", \"fail\");\n    }\n  });\n  steps.push({\n    lane: \"caller\", title: \"Fix the request and dry-run it\",\n    body: \"The problem names the policy and rule. CRD creation is cluster-scoped and never self-service, so the team asks the platform team for that, and dry-runs the namespace-scoped edit grant the pipeline actually needs. The dry run returns 200 with a passing plan: no row, no reservation, no PR.\",\n    code: { label: \"POST …/grants?dryRun=true → 200 Plan\", text: 'curl -s -X POST \"$CMAPI/clusters/' + c + '/namespaces/' + ns + '/serviceaccounts/deploy-bot/grants?dryRun=true\" \\\\\\n  -H \"Authorization: Bearer $TOKEN\" -H \"Content-Type: application/json\" \\\\\\n' + \"  -d '{\\\"clusterId\\\": \\\"\" + c + \"\\\", \\\"kind\\\": \\\"ClusterRole\\\", \\\"name\\\": \\\"edit\\\"}'\\n\\n# → 200 { \\\"plan\\\": { \\\"warnings\\\": [\\\"deploy-bot already holds edit\\\"] } }\" },\n    apply: function (s) { s.node.caller = \"Dry run: 200\"; }\n  });\n  return { init: init, steps: steps };\n}\n\nfunction importScenario() {\n  var c = \"OCP_GF9\", op = \"op-20261103-0c4f\", pr = 421, sha = \"f3b8a10\", prev = \"e6d0c55\";\n  var init = {\n    cluster: c, laneNames: { caller: { name: \"Cluster baseline\", sub: \"separate process, every cluster\" } },\n    node: { caller: \"Building \" + c, keycloak: \"Not involved\", api: \"Watching cmapi-imports\", capacity: \"Watching cmapi-imports\", git: \"main @ \" + prev, argo: \"Root app Synced\" },\n    req: null, pr: null, cap: null, reqHead: \"Cluster onboarding\",\n    capNote: c + \" is unknown to cmapi-capacity until its import Secret connects.\",\n    argo: { app: \"cluster-configs-\" + c, rev: prev, sync: \"Synced\", health: \"Healthy\", resources: [], note: \"Root Application installed by the baseline; clusters/\" + c + \"/ holds no namespaces yet.\" },\n    events: [], blocked: {}\n  };\n  var steps = [];\n  steps.push({\n    lane: \"caller\", title: \"Baseline creates cmapi-reader and the import\",\n    body: \"The cluster-baseline process, not cmapi, lays down the read-only \u003cb>cmapi-reader\u003c/b> ServiceAccount, its ClusterRole and the cluster-monitoring-view binding on the new cluster. It issues a 7-day TokenRequest token and writes one labelled Secret into the hub namespace \u003cb>cmapi-imports\u003c/b>, the only place it may write. cmapi holds get, list and watch there, nothing more.\",\n    code: { label: \"Secret cmapi-imports/cmapi-cluster-ocp-gf9\", text: \"apiVersion: v1\\nkind: Secret\\nmetadata:\\n  name: cmapi-cluster-ocp-gf9\\n  namespace: cmapi-imports\\n  labels:\\n    cmapi.net/secret-type: cluster\\n    cmapi.net/cluster-id: \" + c + \"\\n  annotations:\\n    cmapi.net/managed-by: cluster-baseline\\n    cmapi.net/token-expires-at: \\\"2026-11-10T17:05:00Z\\\"\\ntype: Opaque\\nstringData:\\n  apiUrl: https://api.ocp-gf9.ephico2real.com:6443\\n  token: \u003cTokenRequest token for cmapi-system/cmapi-reader>\\n  insecure: \\\"false\\\"            # no caData: the hub's trusted bundle is used\" },\n    apply: function (s) { s.node.caller = \"Secret written\"; ev(s, 0, \"import_secret_written\", \"cluster-baseline\", \"cmapi-imports/cmapi-cluster-ocp-gf9\"); }\n  });\n  steps.push({\n    lane: \"api\", title: \"Six checks, then connected\",\n    body: \"cmapi's watch sees the Secret within seconds (a 5-minute relist is the backstop) and runs the import checks. Each failure would be a finding on \" + c + \" alone; every other cluster keeps being read.\",\n    checks: [\n      { s: \"pass\", l: \"1 Discover\", n: \"watch event on cmapi-imports\" },\n      { s: \"pass\", l: \"2 Parse the Secret\", n: \"apiUrl, token; no userinfo; unique cluster ID\" },\n      { s: \"pass\", l: \"3 TLS mode\", n: \"trusted-bundle (no caData)\" },\n      { s: \"pass\", l: \"4 Connect: GET /version\", n: \"v1.31\" },\n      { s: \"pass\", l: \"5 Identity: GET users/~\", n: \"system:serviceaccount:cmapi-system:cmapi-reader\" },\n      { s: \"pass\", l: \"6 Capability\", n: \"namespaces, applications, Thanos Route\" }\n    ],\n    code: { label: \"GET /api/v1/clusters/\" + c, text: J({ clusterId: c, status: \"connected\", source: \"cmapi-imports/cmapi-cluster-ocp-gf9\", tls: \"trusted-bundle\", tokenExpiresAt: \"2026-11-10T17:05:00Z\", writable: false, findings: [{ code: \"no-registry-entry\", fix: \"Run cluster-onboard to add \" + c + \" to clusters.yaml\" }] }) },\n    apply: function (s) {\n      s.node.api = \"Connected, read-only\";\n      s.req = { id: op, status: \"connected\", cluster: c, ns: \"—\", action: \"import\", rule: \"—\", need: 0, have: 0, pr: \"—\", lead: \"\" };\n      ev(s, 4, \"cluster_connected\", \"api-bot\", c + \": 6 of 6 checks passed; writes refused until registered\", \"ok\");\n    }\n  });\n  steps.push({\n    lane: \"capacity\", title: \"First capacity snapshot\",\n    body: \"cmapi-capacity reads the same cmapi-imports Secrets, so it picks up \" + c + \" without being told. Its next run queries the cluster's Thanos Querier per node and joins nodes to zones and roles from the API. Placement will not use \" + c + \" yet: it has no clusters.yaml entry, so it is not writable.\",\n    code: { label: \"capacity.capacity_snapshots · \" + c + \" · 17:30\", text: \"scope               cpu alloc  requested  used peak  memory alloc  nodes\\ncluster             192        14.5       9.8        768Gi         6/6\\nzone:us-central-1a  64         5.0        3.4        256Gi         2/2\\nzone:us-central-1b  64         4.5        3.1        256Gi         2/2\\nzone:us-central-1c  64         5.0        3.3        256Gi         2/2\\ncomplete            true   (Thanos allocatable within 5% of the API node sum)\" },\n    apply: function (s) {\n      s.node.capacity = \"First snapshot 17:30\";\n      s.cap = { title: \"Capacity · \" + c, pill: { t: \"not placeable yet\", tone: \"warn\" },\n        meta: \"snapshot 17:30 · complete · worker role · zones from node topology labels\",\n        cols: [\"Scope\", \"CPU alloc\", \"Requested\", \"Used peak\", \"Nodes\"],\n        rows: [[\"cluster\", \"192\", \"14.5\", \"9.8\", \"6/6\"], [\"us-central-1a\", \"64\", \"5.0\", \"3.4\", \"2/2\"], [\"us-central-1b\", \"64\", \"4.5\", \"3.1\", \"2/2\"], [\"us-central-1c\", \"64\", \"5.0\", \"3.3\", \"2/2\"]],\n        note: \"Excluded from placement and fleet views: not writable (no clusters.yaml entry).\" };\n      ev(s, 1500, \"snapshot_written\", \"cmapi-capacity\", c + \": cluster, 3 zones, 3 roles\", \"ok\");\n    }\n  });\n  steps.push({\n    lane: \"api\", title: \"Operator starts cluster-onboard\",\n    body: \"A platform operator starts the cluster-onboard template on the built-in engine (Argo Workflows or Tekton would run the same steps). wait-import passes at once. preflight checks that the Thanos Route answers with the cmapi-reader token, retention is at least 15 days, and the root Application exists and is Synced.\",\n    checks: [\n      { s: \"pass\", l: \"wait-import\", n: \"connected\" },\n      { s: \"pass\", l: \"preflight: Thanos Route\", n: \"200 with cmapi-reader token\" },\n      { s: \"pass\", l: \"preflight: retention\", n: \"15 days\" },\n      { s: \"pass\", l: \"preflight: root Application\", n: \"Synced\" }\n    ],\n    code: { label: \"POST /api/v1/operations\", text: 'curl -s -X POST \"$CMAPI/operations\" \\\\\\n  -H \"Authorization: Bearer $TOKEN\" -H \"Content-Type: application/json\" \\\\\\n  -d \\'{\"template\": \"cluster-onboard\", \"parameters\": {\"cluster-id\": \"' + c + '\"}}\\'\\n\\n# → 202 {\"operationId\": \"' + op + '\", \"engine\": \"builtin\", \"phase\": \"Running\"}' },\n    apply: function (s) { s.req.status = \"running\"; s.req.action = \"cluster-onboard\"; s.node.api = \"Operation running\"; ev(s, 1800, \"operation_started\", \"platform-operator@ephico2real.com\", \"cluster-onboard \" + c); }\n  });\n\nsteps.push({\n  lane: \"api\", also: [\"caller\"], title: \"Registry change waits for approval in cmapi\",\n  body: \"propose-registry plans \" + c + \"'s clusters.yaml entry: environment, writes, sync signal, region, zones and placement settings. The connection never goes in Git; it stays in the import Secret. Registering a cluster needs one platform-lead, so the request waits in \u003cb>pending_approval\u003c/b> and nothing is written to Git until a platform lead approves it in the portal.\",\n  code: { label: \"Plan · config/clusters.yaml\", diff: true, text: \"@@ end of file @@\\n+- clusterId: \" + c + \"\\n+  environment: rnd\\n+  gitopsPath: clusters/\" + c + \"\\n+  writes: true\\n+  syncSignal: poll\\n+  metadata:\\n+    region: us-central\\n+    zones: [us-central-1a, us-central-1b, us-central-1c]\\n+    datacenter: dfw-dc2\\n+    provider: vsphere\\n+  placement:\\n+    enabled: true\\n+    maxNamespaces: 400\" },\n  apply: function (s) {\n    s.req.status = \"pending_approval\"; s.req.rule = \"cluster-onboard\"; s.req.need = 1; s.req.have = 0; s.node.api = \"Waiting for platform-leads\";\n    s.prMsg = \"No pull request yet. The registry change is opened as a bot PR only after a platform lead approves it in cmapi.\";\n    ev(s, 1810, \"pending_approval\", \"api-bot\", \"Registry change for \" + c + \" waits for platform-leads (portal, email)\");\n  }\n});\nsteps.push({\n  lane: \"git\", title: \"Approved, bot PR merged, reloaded\",\n  body: \"A platform lead approves in the portal (:approve). Only then does the worker open PR #\" + pr + \" as the bot; config-validate and the cmapi check pass and the bot merges. The ConfigMap updates and cmapi reloads it; the zones declared in Git match the nodes' topology labels, so no zone-mismatch finding is raised. \" + c + \" is now writable.\",\n  code: { label: \"GET /api/v1/clusters/\" + c + \" (after reload)\", text: J({ clusterId: c, status: \"connected\", environment: \"rnd\", writable: true, labels: { region: \"us-central\", zone: [\"us-central-1a\", \"us-central-1b\", \"us-central-1c\"], environment: \"rnd\", provider: \"vsphere\", datacenter: \"dfw-dc2\" }, findings: [] }) },\n  apply: function (s) {\n    s.req.have = 1; s.req.pr = \"#\" + pr; s.prMsg = \"\";\n    s.pr = { num: pr, title: \"Register \" + c + \" (rnd, us-central)\", branch: \"registry/\" + c + \"/\" + op, state: \"merged\", label: \"cmapi/\" + op, auto: true,\n      files: [{ path: \"config/clusters.yaml\", add: 13, del: 0 }],\n      checks: [{ n: \"config-validate\", s: \"pass\", note: \"metadata rules\" }, { n: \"cmapi-check\", s: \"pass\", note: \"approved · hash matches\" }],\n      reviewers: [] };\n    s.node.git = \"main @ \" + sha; s.node.api = \"Writable\";\n    ev(s, 2390, \"approved\", \"platform-lead@ephico2real.com\", \"1 of 1 approvals (platform-leads)\", \"ok\");\n    ev(s, 2400, \"merged\", \"cmapi-bot\", \"Registry entry merged as \" + sha, \"ok\");\n  }\n});\n  steps.push({\n    lane: \"argo\", title: \"Smoke test through Argo CD\",\n    body: \"smoke-test creates an rnd namespace on \" + c + \" through the normal pipeline, waits for Argo CD to report it Synced, then deletes it through a second request and confirms the prune itself. Both are ordinary requests, so the path every team will use is proven end to end.\",\n    code: { label: \"smoke-test\", text: \"create   cmapi-smoke-0c4f   PR #422   synced in 2 min 40 s\\ndelete   cmapi-smoke-0c4f   PR #423   pruned in 1 min 50 s\\nresult   pass\" },\n    apply: function (s) {\n      s.argo.resources = [{ wave: \"0\", kind: \"Namespace\", name: \"cmapi-smoke-0c4f\", by: \"Argo CD\", st: \"Pruned\", ch: \"created then deleted\" }];\n      s.argo.rev = \"9a1e7c3\"; s.node.argo = \"Synced @ 9a1e7c3\";\n      ev(s, 2560, \"smoke_created\", \"svc-cmapi-workflows\", \"cmapi-smoke-0c4f synced\");\n      ev(s, 2680, \"smoke_deleted\", \"svc-cmapi-workflows\", \"cmapi-smoke-0c4f pruned\", \"ok\");\n    }\n  });\n  steps.push({\n    lane: \"api\", also: [\"capacity\"], title: c + \" joins placement and fleet views\",\n    body: \"The operation succeeds. \" + c + \" now passes placement's hard filters for rnd requests in us-central, and fleet views grouped by region or zone include it. Its token will be rewritten by the baseline at 80% of its 7-day life; cmapi alerts if that has not happened by 90%.\",\n    code: { label: \"GET /api/v1/capacity?groupBy=region,environment (excerpt)\", text: J({ groups: [{ region: \"us-central\", environment: \"rnd\", clusters: 3, coverage: 0.75, excluded: [{ clusterId: \"OCP_GF7\", reason: \"stale-data\" }], cpu: { quotaHeadroom: 452, largestPlacement: 336 } }] }) },\n    apply: function (s) {\n      s.req.status = \"succeeded\"; s.req.lead = dur(2700);\n      s.cap.pill = { t: \"placeable\", tone: \"ok\" }; s.cap.note = \"Included in placement for rnd · us-central, and in fleet views by region, zone and environment.\";\n      s.node.capacity = \"Included in fleet views\"; s.node.caller = \"Rotates token at 80%\";\n      ev(s, 2700, \"operation_succeeded\", \"api-bot\", \"cluster-onboard \" + c, \"ok\");\n    }\n  });\n  return { init: init, steps: steps };\n}\n\nvar INSTANCES = {\n  nonprod: { label: \"nonprod\", display: \"Non-production\", envs: [\"rnd\", \"dev\"], api: \"https://cmapi-nonprod.ephico2real.com\", portal: \"https://portal-nonprod.ephico2real.com\", aud: \"cmapi-nonprod\" },\n  staging: { label: \"staging\", display: \"Staging\", envs: [\"qa\", \"uat\"], api: \"https://cmapi-staging.ephico2real.com\", portal: \"https://portal-staging.ephico2real.com\", aud: \"cmapi-staging\" },\n  prod: { label: \"prod\", display: \"Production\", envs: [\"prod\"], api: \"https://cmapi.ephico2real.com\", portal: \"https://portal.ephico2real.com\", aud: \"cmapi-prod\" }\n};\nfunction instanceFor(env) { for (var k in INSTANCES) { if (INSTANCES[k].envs.indexOf(env) >= 0) return k; } return null; }\n\nfunction wrongInstanceScenario(inst, env) {\n  var me = INSTANCES[inst], right = INSTANCES[instanceFor(env)];\n  var init = {\n    cluster: \"—\", node: { caller: \"Ready\", keycloak: \"Session active\", api: \"Idle\", capacity: \"Last snapshot 17:00\", git: \"—\", argo: \"—\" },\n    req: null, pr: null, cap: null, prMsg: \"No pull request: the request was refused before any plan, so nothing was written to Git.\",\n    capNote: \"Not reached. Placement only ranks this instance's clusters, and none of them is \" + env + \".\",\n    argo: { app: \"cluster-configs-—\", rev: \"—\", sync: \"—\", health: \"—\", resources: [], note: \"Not reached.\" },\n    events: [], blocked: {}\n  };\n  var steps = [];\n  steps.push({\n    lane: \"caller\", title: \"Ask the \" + me.label + \" portal for \" + env,\n    body: \"A team member signed in to the \u003cb>\" + me.label + \"\u003c/b> portal asks for a \" + env + \" namespace. This instance serves only \" + me.envs.join(\" and \") + \"; \" + env + \" clusters live in another network zone that it cannot reach.\",\n    code: { label: \"POST \" + me.api + \"/api/v1/capacity:place\", text: 'curl -s -X POST \"' + me.api + '/api/v1/capacity:place\" \\\\\\n  -H \"Authorization: Bearer $TOKEN\" \\\\\\n  -H \"Content-Type: application/json\" \\\\\\n' + \"  -d '{\\\"environment\\\": \\\"\" + env + \"\\\", \\\"team\\\": \\\"payments\\\", \\\"tier\\\": \\\"medium\\\"}'\" },\n    apply: function (s) { s.node.caller = \"POST sent\"; s.node.api = \"Receiving\"; }\n  });\n  steps.push({\n    lane: \"keycloak\", title: \"The token is for \" + me.label + \" only\",\n    body: \"The token's audience is \u003cb>\" + me.aud + \"\u003c/b>. It is valid here and would be refused by the \" + right.label + \" instance, which accepts only \" + right.aud + \".\",\n    code: { label: \"Decoded access token (excerpt)\", text: J({ iss: \"https://sso.ephico2real.com/realms/ephico2real\", aud: me.aud, azp: \"cmapi-portal-\" + me.label, preferred_username: \"ola\" }) },\n    apply: function (s) { s.node.keycloak = \"Not contacted (JWKS cached)\"; }\n  });\n  steps.push({\n    lane: \"api\", title: \"Environment not served\",\n    body: \"Before any plan, cmapi checks the requested environment against its configured \u003ccode>allowedEnvironments\u003c/code>. \" + env + \" is not in [\" + me.envs.join(\", \") + \"], so it answers 422 with the instance that does serve it. No row, no placement, no PR.\",\n    checks: [\n      { s: \"pass\", l: \"JWT and role\", n: \"audience \" + me.aud },\n      { s: \"fail\", l: \"Environment served by this instance\", n: env + \" not in [\" + me.envs.join(\", \") + \"]\" }\n    ],\n    code: { label: \"422 · application/problem+json\", text: J({ type: \"https://cmapi.ephico2real.com/problems/environment-not-served\", title: \"Environment not served by this instance\", status: 422, detail: \"This is the \" + me.label + \" instance; it serves \" + me.envs.join(\", \") + \".\", environment: env, instance: me.label, servedBy: right.label, instanceUrl: right.api + \"/api/v1\", portalUrl: right.portal }) },\n    apply: function (s) {\n      s.req = { id: \"not recorded\", status: \"refused\", cluster: \"—\", ns: \"—\", action: \"place \" + env + \" namespace\", rule: \"—\", need: 0, have: 0, pr: \"none\", lead: \"\" };\n      s.blocked = { capacity: true, git: true, argo: true };\n      s.node.api = \"422 returned\"; s.node.caller = \"422 received\"; s.node.capacity = \"Not reached\"; s.node.git = \"Not reached\"; s.node.argo = \"Not reached\";\n      ev(s, 0, \"environment_not_served\", \"api-bot\", env + \" is served by \" + right.label + \" (metric only, no row)\", \"fail\");\n    }\n  });\n  steps.push({\n    lane: \"caller\", title: \"Go to the \" + right.label + \" portal\",\n    body: \"The portal turns the problem into a link to \u003cb>\" + right.portal + \"\u003c/b>. There the person signs in again through the \" + right.label + \" client and needs a role on that instance's Keycloak client (\" + right.aud + \"); access in \" + me.label + \" grants nothing in \" + right.label + \".\",\n    code: { label: \"Portal message\", text: env + \" namespaces are created in the \" + right.display + \" portal.\\nOpen \" + right.portal + \" to continue.\\nYour roles there come from the cmapi-\" + right.label + \" client in Keycloak.\" },\n    apply: function (s) { s.node.caller = \"Redirected to \" + right.label; }\n  });\n  return { init: init, steps: steps };\n}\n\n\nfunction expiryScenario() {\n  var c = \"OCP_GF6\", ns = \"payments-perf-rnd\", req = \"req-20261103-e7d0\", pr = 437, sha = \"5b8e1aa\", prev = \"e90b3d4\";\n  var file = \"clusters/\" + c + \"/namespaces/\" + ns + \"/\";\n  var init = {\n    cluster: c, laneNames: { caller: { name: \"Team DL and operator\", sub: \"notified; confirms the prune\" }, api: { name: \"cmapi-api\", sub: \"nonprod instance\" } },\n    node: baseNodes(prev), req: null, pr: null, cap: null,\n    capNote: \"Nothing to place. When the namespace is gone its quota returns to \" + c + \"'s headroom.\",\n    argo: { app: \"cluster-configs-\" + c, rev: prev, sync: \"Synced\", health: \"Healthy\", note: \"\",\n      resources: [\n        { wave: \"0\", kind: \"Namespace\", name: ns, by: \"Argo CD\", st: \"Synced\", ch: \"expires-at 2026-10-27\" },\n        { wave: \"—\", kind: \"ResourceQuota\", name: ns + \"-quota\", by: \"Argo CD\", st: \"Synced\", ch: \"cpu 8 · memory 16Gi\" },\n        { wave: \"—\", kind: \"LimitRange\", name: ns + \"-limits\", by: \"Argo CD\", st: \"Synced\", ch: \"\" }\n      ] },\n    events: [], blocked: {}\n  };\n  var steps = [];\n  steps.push({\n    lane: \"api\", also: [\"caller\"], title: \"Notices at 14, 7 and 1 days\",\n    body: \"\u003cb>\" + ns + \"\u003c/b> was created on Sep 15 with an optional expiry of Oct 27 (rnd allows it; prod never does). The worker's daily \u003ccode>expire_check\u003c/code> sent notices to the payments team DL (payments-team@ephico2real.com) on Oct 13, Oct 20 and Oct 26, each with a link to the Expiration tab where Extend is one click. Nobody extended.\",\n    checks: [\n      { s: \"pass\", l: \"Expiry is optional and non-prod\", n: \"rnd\" },\n      { s: \"pass\", l: \"Notices sent\", n: \"14, 7 and 1 days before\" },\n      { s: \"pending\", l: \"Extensions\", n: \"none (30 days each, 180 in total)\" }\n    ],\n    code: { label: \"GET /api/v1/clusters/\" + c + \"/namespaces/\" + ns + \"/expiration\", text: J({ expiresAt: \"2026-10-27\", state: \"active\", daysLeft: 1, lifetimeDaysUsed: 42, maxLifetimeDays: 180, maxExtensionDays: 30, notices: [\"2026-10-13\", \"2026-10-20\", \"2026-10-26\"], graceDays: 7 }) },\n    apply: function (s) { s.node.api = \"Notices sent (3)\"; s.node.caller = \"Notified 3 times\"; ev(s, 0, \"expiry_notice\", \"expire_check\", ns + \": expires Oct 27 (14, 7, 1 days)\"); }\n  });\n  steps.push({\n    lane: \"api\", title: \"Expiry date: grace begins\",\n    body: \"On Oct 27 the namespace enters a 7-day \u003cb>grace\u003c/b>. It keeps running, it can still be extended or made permanent, and the Expiration tab flags it under In grace. Kyverno does nothing: cmapi never deletes on a timer, and a Kyverno cleanup would leave the folder in Git for Argo CD to recreate.\",\n    checks: [\n      { s: \"warn\", l: \"State\", n: \"grace, 7 days\" },\n      { s: \"pass\", l: \"Still running and extendable\", n: \"\" }\n    ],\n    code: { label: \"GET /api/v1/expirations?state=grace\", text: J({ items: [{ clusterId: c, namespace: ns, team: \"payments\", expiresAt: \"2026-10-27\", state: \"grace\", graceEnds: \"2026-11-03\", noticesSent: 3 }], page: { limit: 50, total: 1, from: 1, to: 1, nextCursor: null, prevCursor: null } }) },\n    apply: function (s) { s.node.api = \"In grace until Nov 3\"; ev(s, 60, \"expiry_grace\", \"expire_check\", ns + \": grace until Nov 3\", \"\"); }\n  });\n  steps.push({\n    lane: \"api\", title: \"Grace over: a delete request, auto-approved\",\n    body: \"On Nov 3 the grace ends with no extension, so \u003ccode>expire_check\u003c/code> opens a delete request. The \u003cb>expired-namespace\u003c/b> policy approves it, and its guards pass: no open request on the namespace, not protected, no extension in the last 24 hours, and at least two notices sent. Any other delete would wait for a person.\",\n    checks: [\n      { s: \"pass\", l: \"No open request, not protected\", n: \"\" },\n      { s: \"pass\", l: \"No extension in 24 h\", n: \"\" },\n      { s: \"pass\", l: \"Notices sent\", n: \"3 (at least 2)\" },\n      { s: \"pass\", l: \"Approved\", n: \"auto:expired-namespace\" }\n    ],\n    code: { label: \"Request \" + req, text: J({ requestId: req, clusterId: c, plugin: \"namespaces\", action: \"delete\", namespace: ns, reason: \"expired\", status: \"approved\", approval: { rule: \"rnd-delete\", requiredCount: 0, autoApproved: true, autoPolicy: \"expired-namespace\" } }) },\n    apply: function (s) { s.req = { id: req, status: \"approved\", cluster: c, ns: ns, action: \"delete (expired)\", rule: \"auto: expired-namespace\", need: 0, have: 0, pr: \"—\", lead: \"\" }; s.node.api = \"Delete approved\"; ev(s, 120, \"approved\", \"auto:expired-namespace\", \"Delete \" + ns + \" after grace\", \"ok\"); }\n  });\n  steps.push({\n    lane: \"git\", title: \"Bot PR removes the folder, merged on CI\",\n    body: \"The worker opens PR #\" + pr + \" as the bot, removing \u003ccode>\" + file + \"\u003c/code>. CI's delete guard checks that exactly one namespace folder is removed and that it matches an approved delete request; the cmapi check confirms the plan hash; the bot merges as \u003ccode>\" + sha + \"\u003c/code>.\",\n    code: { label: \"Diff · \" + file, diff: true, text: \"--- \" + file + \"namespace.yaml\\n-apiVersion: v1\\n-kind: Namespace\\n-metadata:\\n-  name: \" + ns + \"\\n-  labels:\\n-    cmapi.net/cluster-id: \" + c + \"\\n-    cmapi.net/env: rnd\\n-    cmapi.net/expiry: managed\\n-  annotations:\\n-    argocd.argoproj.io/sync-options: Prune=confirm,ServerSideApply=true\\n-    cmapi.net/expires-at: \\\"2026-10-27\\\"\\n-    cmapi.net/team-dl: payments-team@ephico2real.com\\n\\n--- \" + file + \"resourcequota.yaml · limitrange.yaml · token-issuer-rolebinding.yaml (whole folder removed)\" },\n    apply: function (s) {\n      s.req.status = \"merged\"; s.req.pr = \"#\" + pr;\n      s.pr = { num: pr, title: \"Delete expired namespace \" + ns + \" on \" + c, branch: c + \"/\" + ns + \"/\" + req, state: \"merged\", label: \"cmapi/\" + req, auto: true,\n        files: [{ path: file + \"namespace.yaml\", add: 0, del: 21 }, { path: file + \"resourcequota.yaml\", add: 0, del: 16 }, { path: file + \"limitrange.yaml\", add: 0, del: 17 }, { path: file + \"token-issuer-rolebinding.yaml\", add: 0, del: 17 }],\n        checks: [{ n: \"kyverno-bundle\", s: \"pass\" }, { n: \"delete-guard\", s: \"pass\", note: \"1 folder, matching request\" }, { n: \"cmapi-check\", s: \"pass\", note: \"approved · hash matches\" }],\n        reviewers: [] };\n      s.node.git = \"main @ \" + sha;\n      ev(s, 125, \"pr_opened\", \"api-bot\", \"PR #\" + pr); ev(s, 245, \"merged\", \"cmapi-bot\", \"Merged as \" + sha);\n    }\n  });\n  steps.push({\n    lane: \"argo\", title: \"Argo CD waits for prune confirmation\",\n    body: \"Argo CD on \" + c + \" sees the folder gone. Namespaces are rendered with \u003ccode>Prune=confirm\u003c/code>, so it marks the Namespace for pruning and \u003cb>waits\u003c/b>; the request is \u003cb>awaiting_prune\u003c/b> and shows on the operators' queue. Data and PVCs are never removed by a timer alone.\",\n <script>
/*
 * dc-lite: renders a Claude Design canvas file (*.dc.html) without React or claude.ai.
 *
 * It mirrors what the canvas runtime does for the constructs mockups/portal/Main.dc.html uses, because
 * these details decide the layout: <sc-for> and <sc-if> add no wrapper element, a text hole renders in
 * <span class="sc-interp">, and elements keep their identity by position, as with React's index keys.
 * README.md lists what it does not support.

    const getters = Array.from(el.attributes).map((attr) => {
      if (attr.name.startsWith("on") && !EVENTS[attr.name]) {
        throw new Error("dc-lite: unsupported event attribute " + attr.name + " on <" + tag + ">");
      }
      // A boolean attribute written with no value (<input disabled>) is on.
      if (attr.value === "" && BOOLEAN_ATTRS.has(attr.name)) return [attr.name, () => true];
      return [attr.name, attrGetter(attr.value)];
    });
    const fns = compileChildren(el);
    return (scope, out, key) => {
      const kids = [];
      renderAll(fns, scope, kids, "");
      out.push({ key, tag, attrs: getters.map((g) => [g[0], g[1](scope)]), kids });
    };
  }

  function compileNode(node) {
    if (node.nodeType === Node.TEXT_NODE) return compileText(node);
    if (node.nodeType !== Node.ELEMENT_NODE) return null;
    const name = node.localName;
    if (name === "sc-for") return compileFor(node);
    if (name === "sc-if") return compileIf(node);
    if (name === "helmet") return null;
    return compileElement(node);
  }

  function setAttr(el, name, value) {
    if (name === "style") {
      el.style.cssText = value === null || value === undefined ? "" : String(value);
    } else if (BOOLEAN_ATTRS.has(name)) {
      el.toggleAttribute(name, !!value);
    } else if (name.startsWith("aria-") || name.startsWith("data-")) {
      if (value === null || value === undefined) el.removeAttribute(name);
      else el.setAttribute(name, String(value));
    } else if (value === null || value === undefined || typeof value === "boolean" || typeof value === "function") {
      el.removeAttribute(name);
    } else {
      el.setAttribute(name, String(value));
    }
  }

  // The same rule React uses: leave the DOM alone when the value already matches, which is what keeps the
  // caret where it is. A number input compares loosely, so typing "1." is not rewritten to "1".
  function writeValue(el) {
    const want = el.__dcValue;
    if (el.type === "number") {
      if ((want === 0 && el.value === "") || el.value != want) el.value = want; // eslint-disable-line eqeqeq
    } else if (el.value !== want) {
      el.value = want;
    }
  }

  function patchElement(el, vnode) {
    const prev = el.__dcAttrs || {};
    const next = {};
    let hasValue = false;
    for (const [name, value] of vnode.attrs) {
      next[name] = value;
      if (EVENTS[name]) {
        bindEvent(el, name, value);
      } else if (name === "value" && CONTROLLED.has(el.tagName)) {
        el.__dcValue = value === null || value === undefined ? "" : String(value);
        // React mirrors the value into the default too. Neither write touches what a person has typed.
        el.defaultValue = el.__dcValue;
        hasValue = true;
      } else if (prev[name] !== value) {
        setAttr(el, name, value);
      }
    }
    el.__dcAttrs = next;
    patchChildren(el, vnode.kids);
    // After the children, because a select can only take a value once its options exist.
    if (hasValue) writeValue(el);
  }

  function bindEvent(el, attr, handler) {
    const handlers = el.__dcHandlers || (el.__dcHandlers = {});
    // React's onChange fires on every keystroke in a text field, which is the browser's input event.
    const type = attr === "onchange" && el.tagName !== "SELECT" ? "input" : EVENTS[attr];
    if (!(type in handlers)) {
      el.addEventListener(type, (event) => {
        if (handlers[type]) handlers[type](event);
      });
    }
    handlers[type] = typeof handler === "function" ? handler : null;
  }

  function patchChildren(parent, vkids) {
    const old = parent.__dcKids || new Map();
    const next = new Map();
    for (const vnode of vkids) {
      const id = (vnode.tag || "#text") + "|" + vnode.key;
      next.set(id, old.get(id) || (vnode.tag ? document.createElement(vnode.tag) : document.createTextNode("")));
    }
    old.forEach((node, id) => {
      if (!next.has(id)) node.remove();
    });
    let cursor = parent.firstChild;
    vkids.forEach((vnode) => {
      const node = next.get((vnode.tag || "#text") + "|" + vnode.key);
      if (vnode.tag) patchElement(node, vnode);
      else if (node.nodeValue !== vnode.text) node.nodeValue = vnode.text;
      // Positions are structural, so nodes only ever get inserted here. Moving one would blur its focus.
      if (node === cursor) cursor = cursor.nextSibling;
      else parent.insertBefore(node, cursor);
    });
    parent.__dcKids = next;
  }

  class DCLogic {
    constructor(props) {
      this.props = props || {};
      this.state = {};
    }
    // State merges at once and the render is batched, so a handler can read back what it just set.
    setState(update) {
      const patch = typeof update === "function" ? update(this.state) : update;
      this.state = Object.assign({}, this.state, patch);
      if (this.__schedule) this.__schedule();
    }
    componentDidMount() {}
    componentWillUnmount() {}
    renderVals() { return {}; }
  }

  /** Splits a .dc.html source into its template, logic and prop declarations, without running anything. */
  function parse(source) {
    const open = /<x-dc(?:\s[^>]*)?>/.exec(source);
    const end = source.lastIndexOf("</x-dc>");
    if (!open || end < open.index) throw new Error("dc-lite: no <x-dc> block in this file");
    const doc = new DOMParser().parseFromString(source, "text/html");
    const script = doc.querySelector("script[data-dc-script]");
    if (!script) throw new Error("dc-lite: no <script data-dc-script> in this file");
    return {
      template: source.slice(open.index + open[0].length, end),
      js: script.textContent,
      props: JSON.parse(script.getAttribute("data-props") || "{}"),
      title: doc.title
    };
  }

  function compile(def) {
    if (def.compiled) return def.compiled;
    const holder = document.createElement("template");
    holder.innerHTML = def.template.replace(RAW_TAGS, (match, bracket, tag) => bracket + RAW_PREFIX + tag);
    def.helmet = Array.from(holder.content.querySelectorAll("helmet > *"));
    def.compiled = compileChildren(holder.content);
    return def.compiled;
  }

  function installHelmet(def) {
    if (def.helmetInstalled) return;
    def.helmetInstalled = true;
    def.helmet.forEach((node) => document.head.appendChild(document.importNode(node, true)));
  }

  function defaultProps(def) {
    const props = {};
    Object.keys(def.props).forEach((name) => {
      if (def.props[name] && def.props[name].default !== undefined) props[name] = def.props[name].default;
    });
    return props;
  }

  /** Mounts a parsed definition into container. onRender runs after every render with the logic instance. */
  function mount(def, container, props, onRender) {
    const fns = compile(def);
    installHelmet(def);
    const Component = new Function("DCLogic", def.js + "\n;return typeof Component !== 'undefined' ? Component : undefined;")(DCLogic);
    if (typeof Component !== "function") throw new Error("dc-lite: the script must define class Component extends DCLogic");
    const allProps = Object.assign(defaultProps(def), props);
    const logic = new Component(allProps);
    const host = document.createElement("div");
    host.className = "sc-host";
    container.appendChild(host);

    let queued = false;
    let unmounted = false;
    function render() {
      queued = false;
      if (unmounted) return;
      const out = [];
      renderAll(fns, Object.assign({}, allProps, logic.renderVals()), out, "");
      patchChildren(host, out);
      if (onRender) onRender(logic);
    }
    logic.__schedule = () => {
      if (queued) return;
      queued = true;
      Promise.resolve().then(render);
    };

    // A controlled field shows its state, not what was typed: restore it once any handler has run.
    function restoreControlled(event) {
      const el = event.target;
      if (el.__dcValue !== undefined) Promise.resolve().then(() => Promise.resolve()).then(() => writeValue(el));
    }
    host.addEventListener("input", restoreControlled);
    host.addEventListener("change", restoreControlled);

    render();
    logic.componentDidMount();
    return {
      logic,
      unmount() {
        unmounted = true;
        logic.componentWillUnmount();
        host.remove();
      }
    };
  }

  global.DcLite = { parse, mount };
})(typeof window !== "undefined" ? window : this);
</script>
<script>
(function () {
  "use strict";
  var bar = document.querySelector(".dcl-bar");
  var root = document.getElementById("dc-root");
  var def, mounted, current;

  function propOf(name, wanted) {
    var meta = def.props[name];
    return meta.options.indexOf(wanted) >= 0 ? wanted : meta.default;
  }

  function fromHash() {
    var parts = location.hash.slice(1).split("/");
    return { instance: propOf("instance", parts[0]), startTab: propOf("startTab", parts[1]) };
  }

  function showBar() {
    Array.prototype.forEach.call(bar.querySelectorAll("button"), function (button) {
      button.setAttribute("aria-pressed", String(button.textContent === current.instance));
    });
  }

  // The portal's own controls change its state, so the hash follows the state rather than leading it.
  function follow(logic) {
    current = { instance: logic.state.inst, startTab: logic.state.tab || logic.props.startTab };
    var hash = "#" + current.instance + "/" + current.startTab;
    if (location.hash !== hash) {
      try { history.replaceState(null, "", hash); } catch (e) { /* a sandboxed frame may refuse; the page still works */ }
    }
    showBar();
  }

  function mountFromHash() {
    if (mounted) mounted.unmount();
    mounted = DcLite.mount(def, root, fromHash(), follow);
  }

  function start(source) {
    def = DcLite.parse(source);
    document.title = def.title;
    def.props.instance.options.forEach(function (name) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = name;
      button.addEventListener("click", function () { location.hash = name + "/" + current.startTab; });
      bar.appendChild(button);
    });
    mountFromHash();
    addEventListener("hashchange", function () {
      var wanted = fromHash();
      if (wanted.instance !== current.instance || wanted.startTab !== current.startTab) mountFromHash();
    });
  }

  function fail(message) {
    root.innerHTML = "";
    var box = document.createElement("div");
    box.className = "dcl-error";
    box.textContent = message;
    root.appendChild(box);
  }

  function run(source) {
    try { start(source); } catch (e) {
      console.error(e);
      fail("The portal mockup could not start.\n\n" + e.message);
    }
  }

  var embedded = document.getElementById("dc-source");
  if (embedded) {
    run(JSON.parse(embedded.textContent));
  } else {
    fetch("Main.dc.html").then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.text();
    }).then(run, function (e) {
      fail("Could not load Main.dc.html (" + e.message + ").\n\nA browser will not fetch files from file://. Either serve this folder, or open dist/portal.html, which is one self-contained file.");
    });
  }
})();
</script>
</body>
</html>
