{{- if contains "PLACEHOLDER" (.Values.trustedCA.certificates | default "") }}
{{- fail "trustedCA.certificates is still the placeholder: pass the PEM bundle (deploy/release-crc.sh does, with --set-file). httpx refuses a bundle with no certificate, so every pod would crash at startup." }}
{{- end }}
{{- if and .Values.trustedCA.existingConfigMap.enabled (not .Values.trustedCA.existingConfigMap.name) }}
{{- fail "trustedCA.existingConfigMap.enabled needs trustedCA.existingConfigMap.name: the ConfigMap you created with the CA" }}
{{- end }}
{{- if .Values.trustedCA.certificates }}
{{/*
The CA bundle the pods verify Keycloak, the Git host and the database with (never a skipped check). Not a cluster's trust (#434).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmapi.name" . }}-trust
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cmapi.labels" . | nindent 4 }}
data:
  ca-bundle.crt: |
{{ .Values.trustedCA.certificates | indent 4 }}
{{- end }}
{{- if .Values.trustedCA.injected.enabled }}
---
{{/*
Deliberately EMPTY. OpenShift's Cluster Network Operator writes ca-bundle.crt because of the label: the RHCOS trust bundle merged
with proxy/cluster.spec.trustedCA. Labelling a ConfigMap that has data replaces that data, so nothing goes here. It is the trust of
a cluster with no caData (CMAPI_TRUSTED_CA_FILE, #434).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmapi.name" . }}-trusted-ca
  namespace: {{ .Release.Namespace }}
  annotations:
    # The operator owns data; server-side apply lets it keep that ownership instead of Argo CD reverting it on every sync. Not
    # enough alone: the Application also needs ignoreDifferences on this ConfigMap's /data (docs/18, "Cluster trust").
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels: {{- include "cmapi.labels" . | nindent 4 }}
    config.openshift.io/inject-trusted-cabundle: "true"
{{- end }}
