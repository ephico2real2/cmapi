{{/*
Two hosts, both on the front door (templates/portal.yaml): the instance's host, which serves the portal at / and the API
under /api (one origin, docs/02 "The front door"), and the standalone mockup's. The API has no Route or Ingress of its
own: every client, the CLI too, comes in through the front door.

Route (OpenShift, the default). With no host set, spec.subdomain lets the router name it
<release>.<apps domain> and report the name in status, so git carries nothing the cluster
fills in (the lesson recorded in group-sync-dashboard's route.yaml: an empty spec.host is written
back by the API server and fights GitOps; subdomain is not). nginx then matches the host by the
wildcard <subdomain>.*.

Ingress (plain Kubernetes) needs a host at render time; on OpenShift the ingress-to-route
controller would turn it into a Route as well.
*/}}
{{- define "cmapi.frontDoorHost" -}}
{{- if eq .Values.exposure "Ingress" -}}{{ required "ingress.host is required with Ingress exposure" .Values.ingress.host }}{{- else -}}{{ .Values.route.host }}{{- end -}}
{{- end -}}
{{- define "cmapi.mockupHost" -}}
{{- if eq .Values.exposure "Ingress" -}}{{ .Values.ingress.mockup.host }}{{- else -}}{{ .Values.route.mockup.host }}{{- end -}}
{{- end -}}
{{/* The server_name of each site in nginx: the host, or the Route's subdomain with any domain. */}}
{{- define "cmapi.frontDoorServerName" -}}
{{- include "cmapi.frontDoorHost" . | default (printf "%s.*" (include "cmapi.name" .)) -}}
{{- end -}}
{{- define "cmapi.mockupServerName" -}}
{{- include "cmapi.mockupHost" . | default (printf "%s-mockup.*" (include "cmapi.name" .)) -}}
{{- end -}}
{{- $name := include "cmapi.name" . -}}
{{- if .Values.portal.enabled }}
{{- $sites := list (dict "key" "instance" "subdomain" $name "host" (include "cmapi.frontDoorHost" .)) -}}
{{- if .Values.portal.mockup.enabled -}}
{{- $sites = append $sites (dict "key" "mockup" "subdomain" (printf "%s-mockup" $name) "host" (include "cmapi.mockupHost" .)) -}}
{{- end -}}
{{- range $site := $sites }}
{{- if eq $.Values.exposure "Route" }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $site.subdomain }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "cmapi.labels" $ | nindent 4 }}
spec:
  {{- if $site.host }}
  host: {{ $site.host }}
  {{- else }}
  subdomain: {{ $site.subdomain }}
  {{- end }}
  to: {kind: Service, name: {{ $name }}-portal}
  port: {targetPort: http}
  tls:
    # Edge: the router terminates TLS and speaks HTTP to the front door. Redirect: plain HTTP goes to HTTPS, so a token
    # is never sent in the clear.
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- else }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $site.subdomain }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "cmapi.labels" $ | nindent 4 }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $.Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required (printf "the %s site needs a host with Ingress exposure (ingress.host, ingress.mockup.host)" $site.key) $site.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-portal
                port: {number: 8080}
{{- end }}
{{- end }}
{{- end }}
