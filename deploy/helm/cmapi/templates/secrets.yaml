{{/*
Generated secrets, kept across upgrades: a lookup of the existing Secret reuses its values, so a
`helm upgrade` never rotates a key by accident. (A GitOps renderer without a cluster would mint new
ones each render; such a site creates these Secrets itself and the lookup finds them.)
*/}}
{{- $name := include "cmapi.name" . -}}
{{- $keys := (lookup "v1" "Secret" .Release.Namespace (printf "%s-keys" $name)).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-keys
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cmapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  cursorKey: {{ (index $keys "cursorKey") | default (randAlphaNum 40 | b64enc) }}
  linkKey: {{ (index $keys "linkKey") | default (randAlphaNum 40 | b64enc) }}
{{- if .Values.keycloak.realmImport.enabled }}
{{- /* The realm's confidential clients. The same values go to the Keycloak namespace, where the import
       reads them as placeholders, and to this namespace, where the sync job and the api read them. */}}
{{- $kc := (lookup "v1" "Secret" .Release.Namespace .Values.auth.directorySecret).data | default dict -}}
{{- $admin := (index $kc "realmAdminClientSecret") | default (randAlphaNum 48 | b64enc) -}}
{{- $dir := (index $kc "directoryClientSecret") | default (randAlphaNum 48 | b64enc) -}}
{{- $svc := (index $kc "svcPaymentsCiSecret") | default (randAlphaNum 48 | b64enc) -}}
{{- $auto := (index $kc "automationClientSecret") | default (randAlphaNum 48 | b64enc) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.directorySecret }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cmapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  realmAdminClientSecret: {{ $admin }}
  directoryClientSecret: {{ $dir }}
  svcPaymentsCiSecret: {{ $svc }}
  automationClientSecret: {{ $auto }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cmapi-realm-secrets
  namespace: {{ .Values.keycloak.realmImport.namespace }}
  labels: {{- include "cmapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    cmapi.net/purpose: "Placeholders of the KeycloakRealmImport cmapi; the same values as Secret {{ .Values.auth.directorySecret }} in {{ .Release.Namespace }}"
type: Opaque
data:
  CMAPI_REALM_ADMIN_SECRET: {{ $admin }}
  CMAPI_DIRECTORY_SECRET: {{ $dir }}
  CMAPI_SVC_PAYMENTS_CI_SECRET: {{ $svc }}
  CMAPI_AUTOMATION_SECRET: {{ $auto }}
{{- end }}
{{- if and .Values.keycloak.sync.enabled .Values.keycloak.sync.testUsers }}
{{- $users := (lookup "v1" "Secret" .Release.Namespace "cmapi-test-users").data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cmapi-test-users
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cmapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    cmapi.net/purpose: "Passwords of the local test users the realm sync job creates (ola, amy, opal, bot-user)"
type: Opaque
data:
{{- range $u := list "ola" "amy" "opal" "bot-user" }}
  {{ $u }}: {{ (index $users $u) | default (randAlphaNum 24 | b64enc) }}
{{- end }}
{{- end }}
{{- if .Values.git.bootstrap.enabled }}
{{- $git := (lookup "v1" "Secret" .Release.Namespace .Values.git.credentialSecret).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.git.credentialSecret }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cmapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    cmapi.net/purpose: "The cmapi bot's Git host credential (basic auth on the Gitea stand-in)"
type: Opaque
data:
  username: {{ (index $git "username") | default ("cmapi-bot" | b64enc) }}
  password: {{ (index $git "password") | default (randAlphaNum 32 | b64enc) }}
{{- end }}
