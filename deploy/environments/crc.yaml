# CRC, the development cluster on this Mac. Pass with every upgrade, together with the lock file:
#   helm upgrade --install cmapi deploy/helm/cmapi -n cmapi -f deploy/environments/crc.yaml -f deploy/images.lock.yaml
# (deploy/release-crc.sh does exactly that). --set carries nothing here: helm upgrade starts from the
# chart defaults and this file is the desired state.
#
# Identity: the existing Keycloak and the existing LDAP server on this CRC (docs/11). The chart
# installs neither; it writes one KeycloakRealmImport named cmapi into the existing Keycloak's
# namespace and runs the realm sync Job against that realm.

instance:
  name: nonprod
  displayName: Non-production (CRC)
  allowedEnvironments: [rnd, dev]
  # The front door: the portal at /, the API at /api/v1 (docs/02, "The front door").
  publicUrl: https://cmapi.apps-crc.testing
  portalUrl: https://cmapi.apps-crc.testing

auth:
  issuer: https://keycloak.apps-crc.testing/realms/cmapi
  audience: cmapi-nonprod
  # The pods reach the existing Keycloak through its Service (its certificate names it) rather than
  # the Route; the issuer stays the public URL, which is what tokens carry.
  jwksUrl: https://keycloak-service.keycloak.svc:8443/realms/cmapi/protocol/openid-connect/certs
  adminUrl: https://keycloak-service.keycloak.svc:8443

keycloak:
  realmImport:
    enabled: true
    namespace: keycloak
    keycloakCRName: keycloak
    realm: cmapi
    displayName: "cmapi (CRC)"
  realm:
    # Exact URIs only (RFC 9700, section 2.1; #205): the two addresses of the portal's one page. No wildcard, and no localhost in
    # the realm of a shared cluster (docs/15, "The redirect URIs of the portal").
    portalRedirects: ["https://cmapi.apps-crc.testing/", "https://cmapi.apps-crc.testing/index.html"]
    docsRedirects: ["https://cmapi.apps-crc.testing/docs/oauth2-redirect"]
  sync:
    enabled: true
    testUsers: true
    ldap:
      enabled: true                 # takes effect once Secret cmapi-ldap-bind exists in namespace cmapi
      connectionUrl: ldaps://ldaps-ldap-testing.apps-crc.testing:443
      usersDn: ou=People,dc=ephico2real,dc=com
      groupsDn: ou=Groups,dc=ephico2real,dc=com
      groupsFilter: "(cn=app-cmapi-rbac-*)"
      usersFilter: "(uid=cmapi.*)"  # the 13 test users alone, not the real people of the shared directory (docs/11)
      expectUsers: 13
      employeeIdAttribute: uidNumber
      bindSecret: cmapi-ldap-bind

git:
  provider: gitea
  apiUrl: http://cmapi-git-gitea.cmapi.svc:3000/api/v1
  webUrl: https://cmapi-git.apps-crc.testing
  repository: cmapi/cluster-configs-nonprod
  bootstrap:
    enabled: true
    clusterIds: [CRC]

clusters:
  CRC:
    environment: dev
    gitopsPath: clusters/CRC
    writes: true
    labels: {region: us-central}
    simulatedCapacity: {cpu: 64, memory: 256Gi}

delivery:
  mode: argocd                      # the design's delivery (#63): Argo CD applies merged folders, cmapi only reads
  pollInterval: 10s
  syncTimeout: 10m
argocd:
  # Nothing of this exists on CRC yet: the Argo CD install, the Application per cluster, the AppProject and the
  # repository credential are the thin slice's design step (#63). Until they do, a request waits at merged for
  # syncTimeout, then goes to sync_failed with its lock held; CmapiSyncStuck fires, and :revert or :retry is the way out.
  namespace: cmapi-argocd
  # {clusterId} is lower-cased: cmapi's cluster ids may be upper case (CRC, clusters.yaml), a Kubernetes object name
  # may not (RFC 1123, measured: the API server refuses cluster-configs-CRC), so cmapi reads cluster-configs-crc.
  rootApplication: cluster-configs-{clusterId}
  # The identity Argo CD's application controller will have (the install under #63 and #64 must use these names), so
  # cmapi-deliverer-managed-only binds it from the first install. The policy alone does not contain the controller
  # while its ClusterRole is * on * (it can delete the policy): #65 narrows the role.
  controllerServiceAccount: system:serviceaccount:cmapi-argocd:argocd-application-controller

portal:
  enabled: true                     # the front door: without it nothing outside the namespace reaches the API
  mockup:
    enabled: true

exposure: Route
route:
  host: cmapi.apps-crc.testing
  mockup: {host: cmapi-mockup.apps-crc.testing}

trustedCA:
  # The existing Keycloak's certificate chains to this CA (ClusterIssuer enterprise-ca, read from
  # Secret keycloak-tls ca.crt in namespace keycloak), and the apps-crc.testing Routes to the ingress
  # CA (ConfigMap default-ingress-cert in openshift-config-managed). Public certificates only.
  certificates: |
    PLACEHOLDER: deploy/release-crc.sh fills this from the cluster
  injected:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true

database:
  cnpg:
    enabled: true
    storage: 2Gi
    storageClass: crc-csi-hostpath-provisioner

# THROWAWAY (#337 live proof, never merged): the chart's keys plus one required label.
metadata:
  system:
  - cmapi.net/cluster-id
  - cmapi.net/managed
  - cmapi.net/request-id
  - cmapi.net/requested-by
  - cmapi.net/requested-by-user
  - cmapi.net/tier
  - cmapi.net/instance
  - cmapi.net/env
  - cmapi.net/tier-hash
  - cmapi.net/beyond-tier
  - cmapi.net/expiry
  - cmapi.net/expires-at
  operatorOnly:
  - cmapi.net/protected
  reservedPrefixes:
  - kubernetes.io/
  - '*.kubernetes.io/'
  - k8s.io/
  - openshift.io/
  - '*.openshift.io/'
  - argocd.argoproj.io/
  - '*.kyverno.io/'
  - redhatcop.redhat.io/
  - olm.operatorgroup.uid/
  - openshift-pipelines.tekton.dev/
  requiredLabels:
    cmapi.net/team:
      pattern: ^[a-z0-9-]{2,40}$
      title: Team
      description: 'Who owns it, for cost and notices: any team name. Not checked against who you are; your Keycloak roles decide what you may do'
      example: payments
    cmapi.net/data-class:
      enum:
      - public
      - internal
      - restricted
      title: Data class
      description: The class of data the namespace holds
      example: internal
  requiredAnnotations:
    cmapi.net/team-dl:
      format: email-in-domains
      title: Team DL
      description: Your team's distribution list, in one of the organisation's email domains (emailDomains); format only
      example: payments-team@ephico2real.com
  extraLabels:
    keys:
      cmapi.net/cost-center:
        pattern: ^cc-[0-9]{4}$
        example: cc-4410
      cmapi.net/app:
        pattern: ^[a-z0-9-]{2,40}$
        description: Links an app's environments
      cmapi.net/rightsizing:
        pattern: ^(auto|manual)$
        description: Opt-in to automatic rnd and qa decreases
    allowOther:
      prefixes:
      - ''
      - '*.ephico2real.com/'
      max: 50
  extraAnnotations:
    keys: {}
    allowOther:
      prefixes:
      - ''
      - '*.ephico2real.com/'
      max: 50
      maxValueBytes: 4096
      maxBytesTotal: 65536
  adoptionLabels:
    company.net/provisioner:
      recognise:
      - cluster-configs
  sensitiveKeys:
  - cmapi.net/team
  - network.ephico2real.com/zone
  emailDomains:
  - ephico2real.com
