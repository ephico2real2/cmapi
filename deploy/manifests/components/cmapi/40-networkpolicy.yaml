# Only the router reaches the API port, and only monitoring reaches the metrics ports. On CRC the monitoring namespace
# is openshift-user-workload-monitoring; on kind nothing matches it, which only means nothing scrapes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cmapi-metrics
  namespace: cmapi
  labels: {app.kubernetes.io/part-of: cmapi}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [api, worker]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-user-workload-monitoring}
      ports:
        - {port: 9090, protocol: TCP}
    # OpenShift's router namespace carries policy-group: ingress; the second peer is this namespace. A rule with no from
    # would open 8080 to every pod of every project on a shared cluster. On a cluster with no such label only this
    # namespace matches, and kubectl port-forward does not pass through the policy.
    - from:
        - namespaceSelector:
            matchLabels: {network.openshift.io/policy-group: ingress}
        - podSelector: {}
      ports:
        - {port: 8080, protocol: TCP}
