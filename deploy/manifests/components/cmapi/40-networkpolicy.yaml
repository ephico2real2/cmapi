# Only the front door reaches the API port, and only monitoring reaches the metrics ports. On CRC the monitoring namespace
# is openshift-user-workload-monitoring; on kind nothing matches it, which only means nothing scrapes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cmapi-metrics
  namespace: cmapi
  labels: {app.kubernetes.io/part-of: cmapi}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: [api, worker]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openshift-user-workload-monitoring}
      ports:
        - {port: 9090, protocol: TCP}
    # The API port: the front door's pods alone (components/portal/10-front-door.yaml). The front door sets the security
    # headers and writes the access log, so no request may reach the API around it: not the router, not another pod of this
    # namespace. kubectl port-forward does not pass through a policy, and the kubelet's probes are not subject to it.
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: cmapi-portal, app.kubernetes.io/component: portal}
      ports:
        - {port: 8080, protocol: TCP}
---
# The front door: the router alone. OpenShift's router namespace carries policy-group.network.openshift.io/ingress, the label
# its documentation prefers; the older network.openshift.io/policy-group is the one it calls legacy. CRC's openshift-ingress
# carries both (oc get ns, measured). A rule with no from would open 8080 to every pod of every project on a shared cluster.
# On a cluster with no such label (kind) nothing reaches the front door but kubectl port-forward. A router on the host network
# is not a pod of that namespace: from its own node the traffic is always allowed (CRC has one node); from another node it
# would need a peer for policy-group.network.openshift.io/host-network as well.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cmapi-front-door
  namespace: cmapi
  labels: {app.kubernetes.io/part-of: cmapi}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: cmapi-portal, app.kubernetes.io/component: portal}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {policy-group.network.openshift.io/ingress: ""}
      ports:
        - {port: 8080, protocol: TCP}
