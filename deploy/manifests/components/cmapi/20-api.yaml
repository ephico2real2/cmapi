apiVersion: v1
kind: Service
metadata:
  name: cmapi-api
  namespace: cmapi
  labels: {app.kubernetes.io/part-of: cmapi, app.kubernetes.io/name: cmapi-api, app.kubernetes.io/component: api}
spec:
  selector: {app.kubernetes.io/name: cmapi-api, app.kubernetes.io/component: api}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: metrics, port: 9090, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmapi-api
  namespace: cmapi
  labels: {app.kubernetes.io/part-of: cmapi, app.kubernetes.io/name: cmapi-api, app.kubernetes.io/component: api}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cmapi-api, app.kubernetes.io/component: api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: cmapi, app.kubernetes.io/name: cmapi-api, app.kubernetes.io/component: api}
      annotations:
        # deploy/render.sh fills this with the checksum of cmapi-env, cmapi-config and cmapi-trust: the process reads them once,
        # at start, so a changed one must change the pod template. Quoted: a digest of digits and one "e" is a YAML number.
        checksum/config: "CMAPI_CONFIG_CHECKSUM"
    spec:
      serviceAccountName: cmapi-api
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      initContainers:
        # Migrates to head before the process starts: expand-then-contract, serialised by the advisory lock in
        # migrations/env.py, so two replicas starting together are safe and a first install needs no hook Job. It waits
        # up to CMAPI_MIGRATE_WAIT_SECONDS (540) for a database that is not listening yet. PGSSLMODE and PGSSLROOTCERT are libpq's
        # defaults, here and in the main container: CNPG's URI names neither, and libpq's own default, prefer, verifies nothing and
        # falls back to plaintext (measured, #91). An external server's URI names its own, and what a URI names wins (docs/12).
        - name: migrate
          image: ghcr.io/ephico2real2/cmapi@sha256:DIGEST
          imagePullPolicy: IfNotPresent
          command: [cmapi-migrate, head]
          env:
            - name: CMAPI_DATABASE_URL
              valueFrom: {secretKeyRef: {name: cmapi-db-app, key: uri}}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /etc/cmapi/ca/database-ca.crt}
            - {name: SSL_CERT_FILE, value: /etc/cmapi/ca/ca-bundle.crt}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: trust, mountPath: /etc/cmapi/ca, readOnly: true}
      containers:
        - name: api
          image: ghcr.io/ephico2real2/cmapi@sha256:DIGEST
          imagePullPolicy: IfNotPresent
          command: [cmapi-api]
          env:
            - name: CMAPI_COMPONENT
              value: api
            - name: CMAPI_BIND_PORT
              value: "8080"
            - name: CMAPI_METRICS_PORT
              value: "9090"
            - name: CMAPI_CONFIG_DIR
              value: /etc/cmapi/config
            - name: CMAPI_POLICIES_DIR
              value: /etc/cmapi/policies
            - name: CMAPI_IMPORTS_NAMESPACE
              value: cmapi-imports
            - name: CMAPI_GIT_TOKEN
              valueFrom: {secretKeyRef: {name: cmapi-git, key: token, optional: true}}
            - name: CMAPI_GIT_USER
              valueFrom: {secretKeyRef: {name: cmapi-git, key: username, optional: true}}
            - name: CMAPI_GIT_PASSWORD
              valueFrom: {secretKeyRef: {name: cmapi-git, key: password, optional: true}}
            - name: CMAPI_DATABASE_URL
              valueFrom: {secretKeyRef: {name: cmapi-db-app, key: uri}}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /etc/cmapi/ca/database-ca.crt}
            - name: CMAPI_CURSOR_KEY
              valueFrom: {secretKeyRef: {name: cmapi-keys, key: cursorKey}}
            - name: CMAPI_LINK_KEY
              valueFrom: {secretKeyRef: {name: cmapi-keys, key: linkKey}}
            - name: CMAPI_DIRECTORY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: cmapi-keycloak, key: directoryClientSecret, optional: true}}
            - name: CMAPI_CA_BUNDLE
              value: /etc/cmapi/ca/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/cmapi/ca/ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /etc/cmapi/ca/ca-bundle.crt
          envFrom:
            # Per environment: CMAPI_GIT_PROVIDER, CMAPI_GIT_URL, CMAPI_GIT_DEFAULT_BRANCH, CMAPI_LOG_LEVEL, and where the
            # pods reach Keycloak when not through the issuer: CMAPI_OIDC_JWKS_URL, CMAPI_KEYCLOAK_ADMIN_URL (CRC needs both)
            - configMapRef: {name: cmapi-env}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          # Liveness on a route with no I/O: a slow database or a full thread pool is not cured by a restart.
          livenessProbe:
            httpGet: {path: /api/v1/version, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 160Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/cmapi/config, readOnly: true}
            - {name: trust, mountPath: /etc/cmapi/ca, readOnly: true}
      volumes:
        - name: config
          configMap: {name: cmapi-config}
        - name: trust
          projected:
            sources:
              - configMap:
                  name: cmapi-trust
                  items: [{key: ca-bundle.crt, path: ca-bundle.crt}]
              # CNPG's CA, ca.crt alone: the Secret also holds ca.key, which signs server certificates. Optional, because an external
              # server (docs/12) has no such Secret; verify-full then refuses on the missing file. CNPG renews ca.crt in place: this
              # volume follows the Secret and libpq reads the file at each connection, so no restart and no checksum is involved.
              - secret:
                  name: cmapi-db-ca
                  optional: true
                  items: [{key: ca.crt, path: database-ca.crt}]
