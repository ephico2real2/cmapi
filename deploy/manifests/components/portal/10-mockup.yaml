# The standalone portal mockup (mockups/portal/dist/portal.html) behind nginx, with no API behind it: a static page, not
# evidence that the application works. It goes when the portal runs on the API. The HTML lives in the ConfigMap written
# by deploy/mockup-configmap.sh from the built mockup; CI checks the two are the same.
apiVersion: v1
kind: Service
metadata:
  name: cmapi-mockup
  namespace: cmapi
  labels: {app.kubernetes.io/part-of: cmapi, app.kubernetes.io/name: cmapi-mockup, app.kubernetes.io/component: mockup}
spec:
  selector: {app.kubernetes.io/name: cmapi-mockup, app.kubernetes.io/component: mockup}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmapi-mockup
  namespace: cmapi
  labels: {app.kubernetes.io/part-of: cmapi, app.kubernetes.io/name: cmapi-mockup, app.kubernetes.io/component: mockup}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cmapi-mockup, app.kubernetes.io/component: mockup}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: cmapi, app.kubernetes.io/name: cmapi-mockup, app.kubernetes.io/component: mockup}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          # nginxinc/nginx-unprivileged:1.29-alpine, the manifest list's digest (skopeo inspect --raw, 2026-11-05)
          image: docker.io/nginxinc/nginx-unprivileged@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /portal.html, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: site, mountPath: /usr/share/nginx/html, readOnly: true}
      volumes:
        - name: site
          configMap: {name: cmapi-mockup}
