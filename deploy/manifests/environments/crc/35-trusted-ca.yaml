# The trust of a cluster whose import Secret has no caData (#434; docs/02, "TLS: one mode per cluster"). Deliberately EMPTY:
# OpenShift's Cluster Network Operator writes ca-bundle.crt because of the label, the RHCOS trust bundle merged with
# proxy/cluster.spec.trustedCA. Labelling a ConfigMap that has data replaces that data, so none goes here. The api and the worker
# mount it optional at /etc/cmapi/trusted-ca/injected (CMAPI_TRUSTED_CA_FILE). A server-side apply of this file leaves the data
# alone, because it names no data field. Under Argo CD, the Application also needs ignoreDifferences on its /data (docs/18).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cmapi-trusted-ca
  namespace: cmapi
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    app.kubernetes.io/part-of: cmapi
    config.openshift.io/inject-trusted-cabundle: "true"
