# The reader baseline as plain YAML: what cmapi needs to read a cluster, and nothing more. From examples/baseline/cmapi-reader-rbac.yaml,
# cut to what the code calls: core/registry.py's six checks, core/clients/kube.py's WatchCache KINDS, pipeline.workload_counts and
# pipeline._unadopted_counts (the adoption plan's ServiceAccounts and RoleBindings, #748), the
# policy reports and ValidatingPolicies of core/clients/policyreports.py (#302), and the nodes of core/clients/nodes.py for the
# Capacity tab (#302; the owner, 2026-11-18), and the Thanos Querier of capacity/thanos.py for the live usage (#310, Part of #22)
# with the import check of its grants (#724).
# Discovery needs no rule (system:discovery).
# The identity check needs no rule here: users/~ and selfsubjectreviews are for every authenticated user. Later waves add their own
# rule in their own pull request. The import Secret holding this token is not YAML: deploy/crc-reader-import.sh writes it.
apiVersion: v1
kind: Namespace
metadata:
  name: cmapi-system
  labels: {app.kubernetes.io/part-of: cmapi}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmapi-reader
  namespace: cmapi-system
  labels: {app.kubernetes.io/part-of: cmapi}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmapi-reader
  labels: {app.kubernetes.io/part-of: cmapi}
rules:
  - apiGroups: [""]
    resources: [namespaces, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [""]                      # allocatable, zones and readiness, watched for the Capacity tab (#302, core/clients/nodes.py)
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]                      # counted for the delete thresholds (pods > 20, pvcs > 10)
    resources: [pods, persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [""]                      # counted for the adoption plan's "not adopted" (D2, Pipeline._unadopted_counts, #748)
    resources: [serviceaccounts]
    verbs: [list]
  - apiGroups: [rbac.authorization.k8s.io] # the same count of RoleBindings; list only, as the code never gets or watches them
    resources: [rolebindings]
    verbs: [list]
  - apiGroups: [wgpolicyk8s.io]          # Kyverno's policy reports, watched for the Policies tab (#302, core/clients/policyreports.py)
    resources: [policyreports, clusterpolicyreports]
    verbs: [get, list, watch]
  - apiGroups: [policies.kyverno.io]     # the bundle on the cluster: each policy's digest, actions and readiness (#302)
    resources: [validatingpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmapi-reader
  labels: {app.kubernetes.io/part-of: cmapi}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cmapi-reader}
subjects:
  - {kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cmapi-reader-renew, namespace: cmapi-system}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [cmapi-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cmapi-reader-renew, namespace: cmapi-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cmapi-reader-renew}
subjects:
  - {kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}
---
# The live 14-day usage and the daily verdicts (#310, capacity.yaml usage.source thanos), two grants in openshift-monitoring alone.
# The Route: capacity/thanos.py reads the host of Route thanos-querier (ROUTE_PATH) when clusters.yaml has no thanosUrl.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmapi-reader-thanos-route
  namespace: openshift-monitoring
  labels: {app.kubernetes.io/part-of: cmapi}
rules:
  - apiGroups: [route.openshift.io]
    resources: [routes]
    resourceNames: [thanos-querier]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmapi-reader-thanos-route
  namespace: openshift-monitoring
  labels: {app.kubernetes.io/part-of: cmapi}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cmapi-reader-thanos-route}
subjects:
  - {kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}
---
# The query: the Route's kube-rbac-proxy allows a request whose token may get prometheuses/api "k8s" in openshift-monitoring
# (cluster-monitoring-operator, assets/thanos-querier/kube-rbac-proxy-web-secret.yaml). The platform's own Role
# cluster-monitoring-metrics-api grants get, create and update on that named subresource. OpenShift 4.22 names it for "access [to] Thanos Querier API
# endpoints". Not cluster-monitoring-view, the ClusterRole bound cluster-wide: it holds the same rule for every namespace, plus get
# on namespaces, the gate of the user-defined Prometheus's /federate. docs/reviews/2026-11-26-crc-usage-thanos/ has the sources.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmapi-reader-metrics-api
  namespace: openshift-monitoring
  labels: {app.kubernetes.io/part-of: cmapi}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cluster-monitoring-metrics-api}
subjects:
  - {kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}
---
# The import check of the two grants above (core/registry.py, #724): with usage.source thanos, each check asks the API server, by a
# LocalSubjectAccessReview in openshift-monitoring, whether the reader holds them without system:authenticated, which CRC binds
# to cluster-monitoring-view through another project's chart. Namespaced, so it reviews openshift-monitoring alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmapi-reader-grant-check
  namespace: openshift-monitoring
  labels: {app.kubernetes.io/part-of: cmapi}
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [localsubjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmapi-reader-grant-check
  namespace: openshift-monitoring
  labels: {app.kubernetes.io/part-of: cmapi}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cmapi-reader-grant-check}
subjects:
  - {kind: ServiceAccount, name: cmapi-reader, namespace: cmapi-system}
