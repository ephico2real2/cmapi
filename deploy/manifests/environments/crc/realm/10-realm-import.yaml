# Realm cmapi for the existing Keycloak (docs/11), from the chart's templates/keycloak-realm.yaml. The RHBK operator creates it once:
# the import runs --override=false, so an existing realm is left as it is, and this object neither updates nor deletes one. Client
# secrets are ${...} placeholders the import Job reads from Secret cmapi-realm-secrets, written by deploy/secrets.sh; no secret in Git.
# resources: without them the operator's default is requested, 1700Mi with a 2Gi limit (Utils.addResources, whatever the CRD's text
# says about inheriting). 768Mi is the peak measured for this realm under a 1Gi limit, 735 MB, on Keycloak 26.6.4. One CPU at most: starting a JVM beside a
# single keycloak-0 whose liveness probe gives up after 30 s must not take the node's CPUs. Measured at that limit: see docs/13.
# Applied by name, once, by the steps in docs/13; deleted once Done (the operator's guide says to), so it can never run again unattended.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: cmapi
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: cmapi
spec:
  keycloakCRName: keycloak
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: '1'
      memory: 1Gi
  labels:
    app.kubernetes.io/part-of: cmapi
  placeholders:
    CMAPI_REALM_ADMIN_SECRET:
      secret:
        name: cmapi-realm-secrets
        key: CMAPI_REALM_ADMIN_SECRET
    CMAPI_DIRECTORY_SECRET:
      secret:
        name: cmapi-realm-secrets
        key: CMAPI_DIRECTORY_SECRET
    CMAPI_SVC_PAYMENTS_CI_SECRET:
      secret:
        name: cmapi-realm-secrets
        key: CMAPI_SVC_PAYMENTS_CI_SECRET
    CMAPI_AUTOMATION_SECRET:
      secret:
        name: cmapi-realm-secrets
        key: CMAPI_AUTOMATION_SECRET
  realm:
    realm: cmapi
    displayName: cmapi (CRC)
    enabled: true
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 28800
    ssoSessionMaxLifespan: 43200
    rememberMe: true
    ssoSessionIdleTimeoutRememberMe: 604800
    ssoSessionMaxLifespanRememberMe: 2592000
    offlineSessionIdleTimeout: 2592000
    offlineSessionMaxLifespanEnabled: true
    offlineSessionMaxLifespan: 7776000
    revokeRefreshToken: true
    refreshTokenMaxReuse: 0
    # Without this anyone who reaches the Route could guess a federated person's password without limit (40 in 1.1 s, measured). The sync reads only (uid=cmapi.*) here, and the limit holds for whoever it reads.
    # Temporary only: a lockout is in this realm, for 60 s and doubling, never in LDAP.
    bruteForceProtected: true
    permanentLockout: false
    failureFactor: 10
    clientScopes:
    - name: basic
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'false'
        display.on.consent.screen: 'false'
      protocolMappers:
      - name: sub
        protocol: openid-connect
        protocolMapper: oidc-sub-mapper
        config:
          access.token.claim: 'true'
          introspection.token.claim: 'true'
    - name: roles
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'false'
        display.on.consent.screen: 'false'
      protocolMappers:
      - name: client roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        config:
          multivalued: 'true'
          user.attribute: foo
          access.token.claim: 'true'
          claim.name: resource_access.${client_id}.roles
          jsonType.label: String
    - name: profile
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'true'
        display.on.consent.screen: 'false'
      protocolMappers:
      - name: username
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: username
          claim.name: preferred_username
          jsonType.label: String
          access.token.claim: 'true'
          id.token.claim: 'true'
          userinfo.token.claim: 'true'
      - name: given name
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: firstName
          claim.name: given_name
          jsonType.label: String
          access.token.claim: 'true'
          id.token.claim: 'true'
          userinfo.token.claim: 'true'
      - name: family name
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: lastName
          claim.name: family_name
          jsonType.label: String
          access.token.claim: 'true'
          id.token.claim: 'true'
          userinfo.token.claim: 'true'
    - name: email
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'true'
        display.on.consent.screen: 'false'
      protocolMappers:
      - name: email
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        config:
          user.attribute: email
          claim.name: email
          jsonType.label: String
          access.token.claim: 'true'
          id.token.claim: 'true'
          userinfo.token.claim: 'true'
    - name: web-origins
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'false'
        display.on.consent.screen: 'false'
      protocolMappers:
      - name: allowed web origins
        protocol: openid-connect
        protocolMapper: oidc-allowed-origins-mapper
        config:
          access.token.claim: 'true'
    - name: offline_access
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'true'
        display.on.consent.screen: 'true'
    - name: cmapi-identity
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'false'
        display.on.consent.screen: 'false'
      protocolMappers:
      - config:
          access.token.claim: 'true'
          claim.name: employee_id
          id.token.claim: 'false'
          jsonType.label: String
          user.attribute: employeeId
          userinfo.token.claim: 'true'
        name: employee_id
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
      - config:
          access.token.claim: 'true'
          claim.name: middle_name
          id.token.claim: 'true'
          jsonType.label: String
          user.attribute: middleName
          userinfo.token.claim: 'true'
        name: middle_name
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
      - config:
          access.token.claim: 'true'
          claim.name: groups
          full.path: 'true'
          id.token.claim: 'false'
          userinfo.token.claim: 'true'
        name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
    - name: cmapi-audience
      protocol: openid-connect
      attributes:
        include.in.token.scope: 'false'
        display.on.consent.screen: 'false'
      protocolMappers:
      - config:
          access.token.claim: 'true'
          id.token.claim: 'false'
          included.client.audience: cmapi-nonprod
        name: audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
    roles:
      client:
        cmapi-nonprod:
        - name: cmapi-viewer
          description: clusters:read, objects:read, capacity:read, requests:read
        - name: cmapi-onboarding
          description: Create namespaces only. For people and automation clients
        - name: cmapi-requester
          description: Onboarding plus change and delete, quotas, service accounts and grants
        - name: cmapi-approver
          description: requests:approve and requests:reject
        - name: cmapi-operator
          description: Requester plus retry, adoption, reports and operations
        - name: cmapi-admin
          description: Operator plus config, cluster onboarding, reload and the kill switch
        - name: cmapi-auditor
          description: Viewer plus events and audit export
        - name: cmapi-approval-relay
          description: approvals:relay for channel integrations
    clients:
    # Every realm gets a public admin-cli that takes a password with no client secret (measured). No client of this realm takes the password grant (RFC 9700, 2.4; #181), so it is off here also. Nothing here uses it.
    - clientId: admin-cli
      name: Not used in this realm
      enabled: false
      publicClient: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
    - clientId: cmapi-nonprod
      name: cmapi nonprod API
      enabled: true
      publicClient: false
      bearerOnly: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: false
      defaultClientScopes:
      - basic
      - cmapi-identity
      - cmapi-audience
      - roles
      - profile
      - email
    - clientId: cmapi-portal
      name: cmapi portal
      enabled: true
      publicClient: true
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: +
        access.token.header.type.rfc9068: 'true'
      redirectUris:
      - https://cmapi-portal.apps-crc.testing/*
      - http://localhost:5173/*
      webOrigins:
      - +
      defaultClientScopes:
      - basic
      - cmapi-identity
      - cmapi-audience
      - roles
      - profile
      - email
      - web-origins
    - clientId: cmapi-docs
      name: cmapi Swagger UI
      enabled: true
      publicClient: true
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      attributes:
        pkce.code.challenge.method: S256
        client.session.idle.timeout: '3600'
        access.token.header.type.rfc9068: 'true'
        client.session.max.lifespan: '28800'
      redirectUris:
      - https://cmapi-api.apps-crc.testing/docs/oauth2-redirect
      webOrigins:
      - +
      defaultClientScopes:
      - basic
      - cmapi-identity
      - cmapi-audience
      - roles
      - profile
      - email
      - web-origins
    - clientId: cmapi-cli
      name: cmapi CLI (device flow)
      enabled: true
      publicClient: true
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      attributes:
        oauth2.device.authorization.grant.enabled: 'true'
        access.token.header.type.rfc9068: 'true'
      defaultClientScopes:
      - basic
      - cmapi-identity
      - cmapi-audience
      - roles
      - profile
      - email
      optionalClientScopes:
      - offline_access
    - clientId: cmapi-automation
      name: Automation (an AI agent or a script), by its service account
      enabled: true
      publicClient: false
      secret: ${CMAPI_AUTOMATION_SECRET}
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: true
      attributes:
        access.token.header.type.rfc9068: 'true'
      defaultClientScopes:
      - basic
      - cmapi-identity
      - cmapi-audience
      - roles
      - profile
      - email
    - clientId: svc-payments-ci
      name: Example pipeline client
      enabled: true
      publicClient: false
      secret: ${CMAPI_SVC_PAYMENTS_CI_SECRET}
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: true
      attributes:
        access.token.header.type.rfc9068: 'true'
      defaultClientScopes:
      - basic
      - cmapi-identity
      - cmapi-audience
      - roles
      - profile
      - email
    - clientId: cmapi-directory
      name: cmapi directory (read-only admin API)
      enabled: true
      publicClient: false
      secret: ${CMAPI_DIRECTORY_SECRET}
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: true
      defaultClientScopes:
      - basic
      - roles
    - clientId: cmapi-realm-admin
      name: cmapi realm sync (realm-management)
      enabled: true
      publicClient: false
      secret: ${CMAPI_REALM_ADMIN_SECRET}
      standardFlowEnabled: false
      directAccessGrantsEnabled: false
      serviceAccountsEnabled: true
      defaultClientScopes:
      - basic
      - roles
    users:
    - username: service-account-cmapi-realm-admin
      enabled: true
      serviceAccountClientId: cmapi-realm-admin
      clientRoles:
        realm-management:
        - realm-admin
    - username: service-account-cmapi-directory
      enabled: true
      serviceAccountClientId: cmapi-directory
      clientRoles:
        realm-management:
        - view-users
        - query-users
    - username: service-account-cmapi-automation
      enabled: true
      serviceAccountClientId: cmapi-automation
      clientRoles:
        cmapi-nonprod:
        - cmapi-onboarding
    groups:
    - name: cmapi
      path: /cmapi
      subGroups:
      - name: app-cmapi-rbac-admin
        path: /cmapi/app-cmapi-rbac-admin
        clientRoles:
          cmapi-nonprod:
          - cmapi-admin
      - name: app-cmapi-rbac-approver-platform
        path: /cmapi/app-cmapi-rbac-approver-platform
        clientRoles:
          cmapi-nonprod:
          - cmapi-approver
      - name: app-cmapi-rbac-approver-prod
        path: /cmapi/app-cmapi-rbac-approver-prod
        clientRoles:
          cmapi-nonprod:
          - cmapi-approver
      - name: app-cmapi-rbac-approver-qa
        path: /cmapi/app-cmapi-rbac-approver-qa
        clientRoles:
          cmapi-nonprod:
          - cmapi-approver
      - name: app-cmapi-rbac-approver-uat
        path: /cmapi/app-cmapi-rbac-approver-uat
        clientRoles:
          cmapi-nonprod:
          - cmapi-approver
      - name: app-cmapi-rbac-auditor
        path: /cmapi/app-cmapi-rbac-auditor
        clientRoles:
          cmapi-nonprod:
          - cmapi-auditor
      - name: app-cmapi-rbac-onboarding
        path: /cmapi/app-cmapi-rbac-onboarding
        clientRoles:
          cmapi-nonprod:
          - cmapi-onboarding
      - name: app-cmapi-rbac-operator
        path: /cmapi/app-cmapi-rbac-operator
        clientRoles:
          cmapi-nonprod:
          - cmapi-operator
          - cmapi-approver
      - name: app-cmapi-rbac-requester
        path: /cmapi/app-cmapi-rbac-requester
        clientRoles:
          cmapi-nonprod:
          - cmapi-requester
      - name: app-cmapi-rbac-viewer
        path: /cmapi/app-cmapi-rbac-viewer
        clientRoles:
          cmapi-nonprod:
          - cmapi-viewer
