# pf anchor com.apple/cmapi-kind (docs/13, "A second cluster: kind"): the kind API server listens on the Mac's LAN address, so other
# devices on the LAN are dropped at en8. CRC's gvproxy and this Mac itself reach the address over the loopback, which this rule does not
# touch. The address and the interface must match kind-cmapi-test.yaml's apiServerAddress; up.sh checks the address.
#   load:   sudo pfctl -a com.apple/cmapi-kind -f deploy/kind-import/pf-cmapi-kind.conf && sudo pfctl -E   (keep the token -E prints)
#   verify: sudo pfctl -a com.apple/cmapi-kind -s rules; sudo pfctl -s info | head -1
#   undo:   sudo pfctl -a com.apple/cmapi-kind -F all; sudo pfctl -X <token>
block drop in quick on en8 proto tcp from any to 192.168.86.110 port 16443
