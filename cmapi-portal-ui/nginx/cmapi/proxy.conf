# How each location passes a request to the API pods. From nginx 1.29.7, proxying uses HTTP/1.1 with keepalive
# connections by default (ngx_http_upstream_module, "keepalive"), so no proxy_http_version or Connection line is needed;
# deploy/tests/front-door-test.py measures that the connections are kept.
proxy_pass http://cmapi_api;
# The public host and scheme, so the API builds its links (Location, the docs' servers) for the browser's origin.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $cmapi_forwarded_proto;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Request-Id $cmapi_request_id;
# The API pods are in the same namespace: a connection that takes longer than 2 s goes to another pod.
proxy_connect_timeout 2s;
proxy_send_timeout 30s;
# Another pod gets the request only when this one did not answer, or answered 502, 503 or 504. nginx never passes on
# a POST, PATCH or LOCK once it was sent (no "non_idempotent"): a create must not run twice.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
# Two tries bound retries; an elapsed limit below proxy_read_timeout would suppress timeout failover.
proxy_next_upstream_timeout 0;
# The front door sets these headers once. An API response that set one too would send the browser two values.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header X-Permitted-Cross-Domain-Policies;
proxy_hide_header X-DNS-Prefetch-Control;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
