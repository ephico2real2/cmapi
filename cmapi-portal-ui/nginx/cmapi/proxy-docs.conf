# The API's HTML pages and their bundles: Swagger UI, ReDoc, the problem pages. No Cross-Origin-Opener-Policy here:
# Swagger UI signs in through a popup, and the popup's page (/docs/oauth2-redirect) must reach window.opener.
include /etc/nginx/cmapi/proxy.conf;
proxy_read_timeout 15s;
include /etc/nginx/cmapi/headers-common.conf;
add_header Content-Security-Policy $cmapi_csp_docs always;
