# ReDoc's page: as the other pages of the API, with the policy that the API itself sends for it (REDOC_CSP).
include /etc/nginx/cmapi/proxy.conf;
proxy_read_timeout 15s;
include /etc/nginx/cmapi/headers-common.conf;
add_header Content-Security-Policy $cmapi_csp_redoc always;
# The page opens no popup; same-origin keeps another window from holding a reference to it (Fable's review of #238, F6).
add_header Cross-Origin-Opener-Policy "same-origin" always;
