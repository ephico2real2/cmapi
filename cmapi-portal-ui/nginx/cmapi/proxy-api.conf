# The API's JSON and YAML: /api/, /openapi.json, /openapi.yaml.
include /etc/nginx/cmapi/proxy.conf;
# A plan with a dry run renders and validates the namespace's files, the slowest call of the API.
proxy_read_timeout 60s;
include /etc/nginx/cmapi/headers-common.conf;
add_header Content-Security-Policy $cmapi_csp_api always;
add_header Cache-Control $cmapi_api_cache_control always;
