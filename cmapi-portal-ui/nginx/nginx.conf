# The front door's main configuration (docs/02, "The front door"; decision record docs/reviews/2026-11-14-issue-226/).
# It replaces the image's stock nginx.conf whole, so every directive that runs is in this repository.

# The image's 30-tune-worker-processes.sh (NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE=1) rewrites this line to the
# container's CPU limit. "auto" alone counts the node's CPUs, which starts too many workers in a pod with a small limit.
worker_processes auto;
# A graceful stop (SIGQUIT, the image's STOPSIGNAL, or "nginx -s quit" in preStop) lets open connections finish for up
# to this long. It stays below the pod's terminationGracePeriodSeconds, so the kubelet never has to send SIGKILL.
worker_shutdown_timeout 20s;
# restricted-v2 gives the pod an arbitrary UID: every path that nginx writes is under /tmp.
pid /tmp/nginx.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # The sites, written at start from /etc/nginx/templates/ by the image's 20-envsubst-on-templates.sh.
    include /etc/nginx/conf.d/*.conf;
}
