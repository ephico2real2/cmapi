# The #335 kind proof: Kyverno off (instance.policy.engine none), a custom required label set through metadata.
instance:
  policy:
    engine: none
auth:
  issuer: https://issuer.cmapi-test.invalid/realms/cmapi
  audience: cmapi-nonprod
  jwksUrl: http://jwks.cmapi.svc.cluster.local:8000/certs
database:
  cnpg:
    enabled: false
  existingSecret: cmapi-db
portal:
  enabled: false
exposure: Ingress
networkPolicy:
  enabled: false
securityContext:
  runAsUser: 1001
imagePullPolicy: Never
argocd:
  acknowledgeUncontainedController: true
metadata:
  system:
  - cmapi.net/cluster-id
  - cmapi.net/managed
  - cmapi.net/request-id
  - cmapi.net/requested-by
  - cmapi.net/requested-by-user
  - cmapi.net/tier
  - cmapi.net/instance
  - cmapi.net/env
  - cmapi.net/tier-hash
  - cmapi.net/beyond-tier
  - cmapi.net/expiry
  - cmapi.net/expires-at
  operatorOnly:
  - cmapi.net/protected
  reservedPrefixes:
  - kubernetes.io/
  - '*.kubernetes.io/'
  - k8s.io/
  - openshift.io/
  - '*.openshift.io/'
  - argocd.argoproj.io/
  - '*.kyverno.io/'
  - redhatcop.redhat.io/
  requiredLabels:
    cmapi.net/team:
      pattern: ^[a-z0-9-]{2,40}$
      description: Ownership and cost; any team, not checked against the caller
      example: payments
    acme.example/owner:
      pattern: ^[a-z]{2,20}$
      description: 'The owning group (the #335 kind proof)'
      example: payments
  requiredAnnotations:
    cmapi.net/team-dl:
      format: email-in-domains
      description: The team's mail list, an address in one of emailDomains
      example: payments-team@ephico2real.com
  extraLabels:
    keys:
      cmapi.net/cost-center:
        pattern: ^cc-[0-9]{4}$
        example: cc-4410
      cmapi.net/app:
        pattern: ^[a-z0-9-]{2,40}$
        description: Links an app's environments
      cmapi.net/rightsizing:
        pattern: ^(auto|manual)$
        description: Opt-in to automatic rnd and qa decreases
    allowOther:
      prefixes:
      - ''
      - '*.ephico2real.com/'
      max: 50
  extraAnnotations:
    keys: {}
    allowOther:
      prefixes:
      - ''
      - '*.ephico2real.com/'
      max: 50
      maxValueBytes: 4096
      maxBytesTotal: 65536
  adoptionLabels:
    company.net/provisioner:
      recognise:
      - cluster-configs
  sensitiveKeys:
  - cmapi.net/team
  - network.ephico2real.com/zone
  emailDomains:
  - ephico2real.com
