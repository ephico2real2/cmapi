# Every pull request and every push to main. A change merges only when this is green (CLAUDE.md).
# Actions are pinned by the commit of their release tag.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r examples/local/requirements.txt
      - name: The Kyverno CLI that the image pins
        # The version and SHA-256 come from cmapi/Containerfile, so the image and this job cannot drift apart. The rendered
        # policies (#212) are run through it by tests/core/test_policygen.py, which fails here rather than skip.
        run: |
          version=$(sed -n 's/^ARG KYVERNO_VERSION=//p' cmapi/Containerfile)
          sha=$(sed -n 's/^ARG KYVERNO_SHA256=//p' cmapi/Containerfile)
          curl -sSfL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/${version}/kyverno-cli_${version}_linux_x86_64.tar.gz"
          echo "${sha}  kyverno.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf kyverno.tgz -C "$RUNNER_TEMP/bin" kyverno
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/kyverno" version
      - name: Test
        working-directory: examples
        env:
          PYTHONPATH: src
          CMAPI_REQUIRE_KYVERNO: "1"
        run: python -m pytest tests -q

  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: cmapi
          POSTGRES_PASSWORD: cmapi
          POSTGRES_DB: cmapi
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U cmapi" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - name: Install
        run: python -m pip install -e "cmapi[test]"
      - name: Test
        working-directory: cmapi
        env:
          PYTHONPATH: src:tests/service
          CMAPI_TEST_DATABASE_URL: postgresql://cmapi:cmapi@127.0.0.1:55432/cmapi
        run: python -m pytest tests/service -q -W ignore::DeprecationWarning -W ignore::pydantic.warnings.UnsupportedFieldAttributeWarning

  portal-mockup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install
        working-directory: tests/portal
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test
        working-directory: tests/portal
        run: npm test

  portal-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install
        working-directory: cmapi-portal-ui
        run: |
          npm ci
          # The generator of the API types has its own lockfile (openapi-typescript needs TypeScript 5).
          npm ci --ignore-scripts --prefix tools/openapi-types
          npx playwright install --with-deps chromium
      - name: Test
        working-directory: cmapi-portal-ui
        run: npm test

  api-contract:
    # The API contract gates (docs/01 "API documentation"). Gate 1 (#143): Spectral lints cmapi/contract/openapi.json with cmapi's
    # ruleset. Gate 3 (#131): a pull request that breaks the contract of its base branch fails here, by oasdiff. The service job
    # keeps that file equal to what the code serves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          curl -fsSL -o oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.37.0/oasdiff_1.37.0_linux_amd64.tar.gz
          echo "eac87307d31d08c36800c58a409c247f1c5db37fbb72e2544402f22a87cbca3c  oasdiff.tar.gz" | sha256sum -c -
          tar xzf oasdiff.tar.gz oasdiff && sudo mv oasdiff /usr/local/bin/
          oasdiff --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Spectral, from the lockfile
        working-directory: cmapi/contract/spectral
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/spectral --version
      - name: The lint refuses a document that breaks a rule, one case for each rule
        run: python cmapi/contract/lint-test.py
      - name: The contract passes the lint
        run: cmapi/contract/lint.sh
      - name: The gate refuses a breaking change and passes an additive one
        run: cmapi/contract/gate-test.sh
      - name: The changelog that /docs/changelog serves is current
        run: python cmapi/contract/changelog.py --check
      - name: docs/04 shows the recorded samples
        run: python scripts/api-examples-doc.py --check
      - name: The contract does not break the newest released version
        run: |
          latest=$(find cmapi/contract/released -name '*.json' | sort -V | tail -1)
          if [ -n "$latest" ]; then
            cmapi/contract/gate.sh "$latest" cmapi/contract/openapi.json
          else
            echo "No version is released yet: cmapi/contract/released holds no document."
          fi
      - name: The contract does not break the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/$BASE_REF:cmapi/contract/openapi.json" 2>/dev/null; then
            git show "origin/$BASE_REF:cmapi/contract/openapi.json" > "$RUNNER_TEMP/base-openapi.json"
            cmapi/contract/gate.sh "$RUNNER_TEMP/base-openapi.json" cmapi/contract/openapi.json
          else
            echo "The base branch has no cmapi/contract/openapi.json: this change adds the first contract, so there is nothing to break."
          fi

  manifests:
    # The plain manifests (deploy/manifests), the render, the scripts and the secrets cases: what deploys cmapi
    # (docs/reviews/2026-11-05-deployment-design.md). kubeconform checks every object against the Kubernetes 1.35 schemas
    # and the CRDs catalog for CloudNativePG; the secrets cases and the NetworkPolicy's reach run on a kind cluster.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
          kubeconform -v
          # Pinned like the others: apt's shellcheck is whatever the runner image's Ubuntu carries (0.9.0 on 24.04, measured),
          # so CI and a developer's machine disagreed on the same file.
          curl -fsSL -o shellcheck.tar.gz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  shellcheck.tar.gz" | sha256sum -c -
          tar xzf shellcheck.tar.gz --strip-components=1 shellcheck-v0.11.0/shellcheck && sudo mv shellcheck /usr/local/bin/
          shellcheck --version
          # The secrets cases read kubectl's own semantics (--ignore-not-found, error text), so not whatever the runner image carries.
          curl -fsSL -o kubectl https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl
          echo "874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          kubectl version --client
          # The stubs and the guards read YAML.
          python -m pip install pyyaml==6.0.2 httpx==0.28.1
      - name: Shellcheck
        run: shellcheck deploy/render.sh deploy/render-test.sh deploy/secrets.sh deploy/secrets-test.sh deploy/mockup-configmap.sh deploy/kind-test.sh deploy/crc-image.sh deploy/crc-trust.sh deploy/crc-reader-import.sh deploy/crc-backup.sh deploy/crc-proof.sh deploy/crc-rollback.sh examples/cmapi-sso/ldap/apply-test-identities.sh deploy/tests/*.sh deploy/tests/kind-test-stubs/* deploy/tests/secrets-stub/stub.sh cmapi/contract/gate.sh cmapi/contract/gate-test.sh cmapi/contract/lint.sh
      - name: This job's own guards
        run: python deploy/tests/ci-guard.py .github/workflows/ci.yml
      - name: docs/12's commands and claims
        run: python deploy/tests/doc12-test.py docs/12-existing-postgresql.md
      - name: kind-test.sh's failures, on stubs
        run: deploy/tests/kind-test-stubbed.sh
      - name: kind-test.sh's database probes are the pods it says they are (#91)
        run: python deploy/tests/db-probe-test.py
      - name: The secrets cases against mutants of secrets.sh, on a stub
        run: python deploy/tests/mutate-secrets.py
      - name: The CRC guards, on a stub oc and a local TLS server
        run: python deploy/tests/crc-guard-test.py
      - name: The CRC scripts, on a stub oc
        run: deploy/tests/crc-scripts-test.sh
      - name: docs/13's run
        run: python deploy/tests/doc13-test.py docs/13-crc-deployment.md
      - name: The backup on a real PostgreSQL of postgres-0's image family
        run: deploy/tests/crc-backup-test.sh
      - name: The test identities on a real OpenLDAP of the server's image, and mutants of the script
        run: deploy/tests/ldap-identities-test.sh
      - name: The sign-in script, on a stand-in for Keycloak's authorization code flow
        run: python deploy/tests/oidc-login-test.py
      - name: The realm on a real Keycloak and LDAP stand-in, beside other realms
        run: python deploy/tests/realm-test.py deploy/manifests/environments/crc/realm/10-realm-import.yaml
      - name: The mockup ConfigMap is current
        run: deploy/mockup-configmap.sh --check
      - name: kubeconform on the manifests
        env:
          SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/102361970337d65537d40141dc29b991b8e95786/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json
          CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: kubeconform -strict -summary -skip Route -kubernetes-version 1.35.0 -schema-location "$SCHEMAS" -schema-location "$CRDS" deploy/manifests/components deploy/manifests/environments
      - name: render.sh fills the placeholder and refuses a tag
        env:
          SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/102361970337d65537d40141dc29b991b8e95786/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json
          CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          deploy/render.sh kind "ghcr.io/ephico2real2/cmapi@sha256:$(printf 'a%.0s' {1..64})" /tmp/rendered
          # An if, not "! grep": bash -e does not stop on a negated command, so that form could never fail the step.
          if grep -rn 'sha256:DIGEST' /tmp/rendered; then echo "a placeholder was left in the render"; exit 1; fi
          kubeconform -strict -summary -skip Route -kubernetes-version 1.35.0 -schema-location "$SCHEMAS" -schema-location "$CRDS" /tmp/rendered
          if deploy/render.sh kind localhost/cmapi:dev /tmp/rendered-tag; then echo "a tag was accepted without --allow-tag"; exit 1; fi
          deploy/render.sh kind localhost/cmapi:dev /tmp/rendered-tag --allow-tag
          # Everything the render must do and must not do, on a throwaway copy: exactly the placeholder, nothing else changed.
          deploy/render-test.sh
          deploy/render.sh crc "image-registry.openshift-image-registry.svc:5000/cmapi/cmapi@sha256:$(printf 'a%.0s' {1..64})" /tmp/rendered-crc
          kubeconform -strict -summary -skip Route -kubernetes-version 1.35.0 -schema-location "$SCHEMAS" -schema-location "$CRDS" /tmp/rendered-crc
      - name: kind for the secrets cases
        run: |
          curl -fsSL -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/
          kind create cluster --name cmapi-ci --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --kubeconfig "$PWD/.ci.kubeconfig" --wait 120s
      - name: The secrets cases
        run: deploy/secrets-test.sh "kubectl --kubeconfig=$PWD/.ci.kubeconfig"
      - name: Who reaches the API port under the NetworkPolicy
        run: deploy/tests/np-reach-test.sh "$PWD/.ci.kubeconfig"
      - name: Delete the kind cluster
        if: ${{ !cancelled() }}
        run: kind delete cluster --name cmapi-ci --kubeconfig "$PWD/.ci.kubeconfig"
