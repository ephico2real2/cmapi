# Every pull request and every push to main. A change merges only when this is green (CLAUDE.md).
# Actions are pinned by the commit of their release tag.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r examples/local/requirements.txt
      # tests/core/test_metadata_pattern_subset_332.py reads each value regex in ECMA-262 (Node's RegExp, u flag), as a
      # client of the API document does (#332).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # tests/core/kube_readers.py builds yamlread/main.go: the YAML readers of kubectl, Argo CD and Kyverno (#355).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmapi/tests/core/yamlread/go.mod
          cache-dependency-path: cmapi/tests/core/yamlread/go.sum
      - name: The Kyverno CLI that the image pins
        # The version and SHA-256 come from cmapi/Containerfile, so the image and this job cannot drift apart. The rendered
        # policies (#212) are run through it by tests/core/test_policygen.py, which fails here rather than skip.
        run: |
          version=$(sed -n 's/^ARG KYVERNO_VERSION=//p' cmapi/Containerfile)
          sha=$(sed -n 's/^ARG KYVERNO_SHA256=//p' cmapi/Containerfile)
          curl -sSfL --retry 5 -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/${version}/kyverno-cli_${version}_linux_x86_64.tar.gz"
          echo "${sha}  kyverno.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf kyverno.tgz -C "$RUNNER_TEMP/bin" kyverno
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/kyverno" version
      - name: Test
        working-directory: examples
        env:
          PYTHONPATH: src
          CMAPI_REQUIRE_KYVERNO: "1"
          CMAPI_REQUIRE_NODE: "1"
          CMAPI_REQUIRE_GO: "1"
          # tests/core/test_containerfile_args_388.py builds the Containerfiles' ARG and ENV lines on scratch (#388).
          CMAPI_REQUIRE_CONTAINER_ENGINE: "1"
        run: python -m pytest tests -q

  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: cmapi
          POSTGRES_PASSWORD: cmapi
          POSTGRES_DB: cmapi
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U cmapi" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      # tests/core/kube_readers.py builds yamlread/main.go: the YAML readers of kubectl, Argo CD and Kyverno (#355).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmapi/tests/core/yamlread/go.mod
          cache-dependency-path: cmapi/tests/core/yamlread/go.sum
      # The image's set from its hashed lock (#655), then cmapi and its test extras: the tests run on what the image ships.
      - name: Install
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r cmapi/requirements.txt
          python -m pip install -e "cmapi[test]"
      # tests/service/test_contract_report_337.py runs the API contract report (#337) on the real oasdiff, the api-contract
      # job's pin, and fails here rather than skip.
      - name: oasdiff v1.37.0
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/oasdiff.tar.gz" https://github.com/oasdiff/oasdiff/releases/download/v1.37.0/oasdiff_1.37.0_linux_amd64.tar.gz
          echo "eac87307d31d08c36800c58a409c247f1c5db37fbb72e2544402f22a87cbca3c  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff && sudo mv "$RUNNER_TEMP/oasdiff" /usr/local/bin/
          oasdiff --version
      # The Git layer's SSH tests (#286) run a throwaway sshd as the runner's user; /run/sshd is its privilege separation folder.
      - name: sshd for the SSH tests
        run: |
          [ -x /usr/sbin/sshd ] || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends openssh-server; }
          sudo mkdir -p /run/sshd
          git --version
      - name: Test
        working-directory: cmapi
        env:
          PYTHONPATH: src:tests/service
          CMAPI_TEST_DATABASE_URL: postgresql://cmapi:cmapi@127.0.0.1:55432/cmapi
          CMAPI_TEST_REQUIRE_SSHD: "1"
          CMAPI_REQUIRE_GO: "1"
          CMAPI_REQUIRE_OASDIFF: "1"
        run: python -m pytest tests/service -q -W ignore::DeprecationWarning -W ignore::pydantic.warnings.UnsupportedFieldAttributeWarning

  dependency-audit:
    # #655: every Python package that the image ships (cmapi/requirements.txt, the hashed lock the Containerfile installs), that
    # the service tests run on, and that the reference code installs, against the OSV database by pip-audit. Any advisory
    # fails the job (exit 1), and so does a set that OSV gave no answer for after three attempts (exit 3: run the job again);
    # there is no ignore list. pip check in the same script fails it when the lock no longer satisfies
    # cmapi/pyproject.toml. A developer runs the same command: cmapi/audit.sh.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: The installed sets against OSV
        run: cmapi/audit.sh python

  portal-mockup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install
        working-directory: tests/portal
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test
        working-directory: tests/portal
        run: npm test

  portal-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install
        working-directory: cmapi-portal-ui
        run: |
          npm ci
          # The generator of the API types has its own lockfile (openapi-typescript needs TypeScript 5).
          npm ci --ignore-scripts --prefix tools/openapi-types
          npx playwright install --with-deps chromium
      - name: Test
        working-directory: cmapi-portal-ui
        run: npm test

  front-door:
    # The front door (#226): the cmapi-portal image is built, then nginx in it is measured on its own configuration
    # (deploy/tests/front-door-test.py --image) and the portal, Swagger UI, ReDoc, the problem pages and the mockup are
    # loaded through it in Chromium with no CSP violation (cmapi-portal-ui/tests/front-door.test.mjs).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install
        run: |
          python -m pip install -e cmapi
          cd cmapi-portal-ui && npm ci && npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The base images
        # As in images-pr (#663): fetched with retries and checked by digest, then read by the build from the layout.
        id: base
        env:
          FILE: cmapi-portal-ui/Containerfile
        run: |
          contexts=$(python3 deploy/base-images.py --containerfile "$FILE" --layout "$RUNNER_TEMP/base-images" --platform linux/amd64 --attempts 5 --delay 2)
          printf 'contexts<<CONTEXTS\n%s\nCONTEXTS\n' "$contexts" >>"$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cmapi-portal-ui/Containerfile
          build-contexts: ${{ steps.base.outputs.contexts }}
          platforms: linux/amd64
          build-args: GIT_COMMIT=${{ github.sha }}
          load: true
          tags: cmapi-portal:ci
          provenance: false
          sbom: false
      - name: nginx in the image, on its own configuration
        run: python deploy/tests/front-door-test.py --image cmapi-portal:ci --engine docker
      - name: The pages through the front door, in a browser
        working-directory: cmapi-portal-ui
        run: |
          cmapi-tools docs-assets --static-dir "$RUNNER_TEMP/static" --containerfile ../cmapi/Containerfile
          npm run build
          FRONT_DOOR_IMAGE=cmapi-portal:ci FRONT_DOOR_ENGINE=docker FRONT_DOOR_PYTHON=python FRONT_DOOR_STATIC="$RUNNER_TEMP/static" node tests/front-door.test.mjs

  images:
    # Only this job can publish packages and sign attestations.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ephico2real2/cmapi'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy: &image_strategy
      fail-fast: false
      matrix:
        include:
          - name: cmapi
            file: cmapi/Containerfile
            context: cmapi
          # The portal's build reads the mockup (scripts/extract-model.mjs), so its context is the root.
          - name: cmapi-portal
            file: cmapi-portal-ui/Containerfile
            context: .
    env: &image_env
      IMAGE: ghcr.io/ephico2real2/${{ matrix.name }}
    steps:
      - &image_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &image_meta
        name: The commit and the version
        id: meta
        run: |
          commit=$(git rev-parse --short=10 HEAD)
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' cmapi/pyproject.toml | head -1)
          [ -n "$version" ] || { echo "no version in cmapi/pyproject.toml"; exit 1; }
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "$IMAGE:sha-$commit, version $version"
      - &image_buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - &image_base
        # The FROM images, fetched before the build with retries and checked by digest; the build reads them from the layout
        # and asks no registry for them (#663, deploy/base-images.py).
        name: The base images
        id: base
        env:
          FILE: ${{ matrix.file }}
        run: |
          contexts=$(python3 deploy/base-images.py --containerfile "$FILE" --layout "$RUNNER_TEMP/base-images" --platform linux/amd64 --attempts 5 --delay 2)
          printf 'contexts<<CONTEXTS\n%s\nCONTEXTS\n' "$contexts" >>"$GITHUB_OUTPUT"
      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ steps.base.outputs.contexts }}
          platforms: linux/amd64
          build-args: &image_args |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - name: GHCR holds the image that was built, as one manifest labelled with the commit
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          ref="$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' >"$RUNNER_TEMP/manifest.json"
          docker buildx imagetools inspect "$ref" --format '{{json .Image}}' >"$RUNNER_TEMP/image.json"
          python3 - "$DIGEST" "$COMMIT" "$RUNNER_TEMP" <<'PY'
          import json, sys
          digest, commit, tmp = sys.argv[1:]
          manifest, image = json.load(open(f"{tmp}/manifest.json")), json.load(open(f"{tmp}/image.json"))
          single = ("application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json")
          label = ((image.get("config") or {}).get("Labels") or {}).get("org.opencontainers.image.revision")
          checks = [(manifest.get("digest") == digest, f"the descriptor resolves to {manifest.get('digest')}, the build pushed {digest}"),
                    (manifest.get("mediaType") in single, f"the descriptor is a {manifest.get('mediaType')}, not one image manifest"),
                    (label == commit, f"the revision label is {label!r}, not {commit}")]
          for ok, why in checks:
              if not ok:
                  sys.exit(why)
          print(f"GHCR holds {digest}, one image manifest, labelled {commit}")
          PY
      - name: Attest the image by its digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # A storage record is an organization's artifact metadata; this package is a user's.
          create-storage-record: false
      - name: Publish the attested digest under the deployment tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          tag="$IMAGE:sha-$COMMIT"
          docker buildx imagetools create --prefer-index=false --tag "$tag" "$IMAGE@$DIGEST"
          held=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
          [ "$held" = "$DIGEST" ] || { echo "Expected $DIGEST at $tag, found $held" >&2; exit 1; }
          echo "Pushed \`$IMAGE:sha-$COMMIT\` as \`$IMAGE@$DIGEST\`, attested." >>"$GITHUB_STEP_SUMMARY"

  images-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy: *image_strategy
    env: *image_env
    steps:
      - *image_checkout
      - *image_meta
      - *image_buildx
      - *image_base
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ steps.base.outputs.contexts }}
          platforms: linux/amd64
          build-args: *image_args
          push: false
          provenance: false
          sbom: false

  api-contract:
    # The API contract gates (docs/01 "API documentation"). Gate 1 (#143): Spectral lints cmapi/contract/openapi.json with cmapi's
    # ruleset. Gate 3 (#131): a pull request that breaks the contract of its base branch fails here, by oasdiff. The service job
    # keeps that file equal to what the code serves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          curl -fsSL --retry 5 -o oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.37.0/oasdiff_1.37.0_linux_amd64.tar.gz
          echo "eac87307d31d08c36800c58a409c247f1c5db37fbb72e2544402f22a87cbca3c  oasdiff.tar.gz" | sha256sum -c -
          tar xzf oasdiff.tar.gz oasdiff && sudo mv oasdiff /usr/local/bin/
          oasdiff --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Spectral, from the lockfile
        working-directory: cmapi/contract/spectral
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/spectral --version
      - name: The lint refuses a document that breaks a rule, one case for each rule
        run: python cmapi/contract/lint-test.py
      - name: The contract passes the lint
        run: cmapi/contract/lint.sh
      - name: The gate refuses a breaking change and passes an additive one
        run: cmapi/contract/gate-test.sh
      - name: The changelog that /docs/changelog serves is current
        run: python cmapi/contract/changelog.py --check
      - name: docs/04 shows the recorded samples
        run: python scripts/api-examples-doc.py --check
      - name: The contract does not break the newest released version
        run: |
          latest=$(find cmapi/contract/released -name '*.json' | sort -V | tail -1)
          if [ -n "$latest" ]; then
            cmapi/contract/gate.sh "$latest" cmapi/contract/openapi.json
          else
            echo "No version is released yet: cmapi/contract/released holds no document."
          fi
      - name: The contract does not break the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/$BASE_REF:cmapi/contract/openapi.json" 2>/dev/null; then
            git show "origin/$BASE_REF:cmapi/contract/openapi.json" > "$RUNNER_TEMP/base-openapi.json"
            cmapi/contract/gate.sh "$RUNNER_TEMP/base-openapi.json" cmapi/contract/openapi.json
          else
            echo "The base branch has no cmapi/contract/openapi.json: this change adds the first contract, so there is nothing to break."
          fi

  manifests:
    # The plain manifests (deploy/manifests), the render, the scripts and the secrets cases: what deploys cmapi
    # (docs/reviews/2026-11-05-deployment-design.md). kubeconform checks every object against the Kubernetes 1.35 schemas
    # and the CRDs catalog for CloudNativePG; the secrets cases and the NetworkPolicy's reach run on a kind cluster.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          curl -fsSL --retry 5 -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
          kubeconform -v
          # Pinned like the others: apt's shellcheck is whatever the runner image's Ubuntu carries (0.9.0 on 24.04, measured),
          # so CI and a developer's machine disagreed on the same file.
          curl -fsSL --retry 5 -o shellcheck.tar.gz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  shellcheck.tar.gz" | sha256sum -c -
          tar xzf shellcheck.tar.gz --strip-components=1 shellcheck-v0.11.0/shellcheck && sudo mv shellcheck /usr/local/bin/
          shellcheck --version
          # The secrets cases read kubectl's own semantics (--ignore-not-found, error text), so not whatever the runner image carries.
          curl -fsSL --retry 5 -o kubectl https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl
          echo "874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          kubectl version --client
          # The stubs and the guards read YAML.
          python -m pip install pyyaml==6.0.2 httpx==0.28.1 google-re2==1.1.20251105
      - name: Shellcheck
        run: shellcheck cmapi/audit.sh cmapi/lock.sh cmapi/locked-pip.sh deploy/render.sh deploy/render-test.sh deploy/secrets.sh deploy/secrets-test.sh deploy/kind-test.sh deploy/crc-image.sh deploy/crc-trust.sh deploy/crc-reader-import.sh deploy/crc-backup.sh deploy/crc-proof.sh deploy/crc-rollback.sh deploy/kind-import/*.sh examples/cmapi-sso/ldap/apply-test-identities.sh deploy/tests/*.sh deploy/tests/kind-test-stubs/* deploy/tests/secrets-stub/stub.sh cmapi/contract/gate.sh cmapi/contract/gate-test.sh cmapi/contract/lint.sh
      - name: This job's own guards
        run: python deploy/tests/ci-guard.py .github/workflows/ci.yml
      - name: Each download survives a transient 503, and each base image two refused tokens (#609, #663)
        run: python deploy/tests/download-retry-test.py
      - name: docs/12's commands and claims
        run: python deploy/tests/doc12-test.py docs/12-existing-postgresql.md
      - name: kind-test.sh's failures, on stubs
        run: deploy/tests/kind-test-stubbed.sh
      - name: kind-test.sh's database probes are the pods it says they are (#91)
        run: python deploy/tests/db-probe-test.py
      - name: The secrets cases against mutants of secrets.sh, on a stub
        run: python deploy/tests/mutate-secrets.py
      - name: Written secrets scripts run through Bash (#543)
        run: python deploy/tests/mutate-secrets-test.py
      - name: The CRC guards, on a stub oc and a local TLS server
        run: python deploy/tests/crc-guard-test.py
      - name: The CRC scripts, on a stub oc
        run: deploy/tests/crc-scripts-test.sh
      - name: The kind import scripts, on stubs of kind, kubectl and oc
        run: deploy/tests/kind-import-test.sh
      - name: docs/13's run
        run: python deploy/tests/doc13-test.py docs/13-crc-deployment.md
      - name: The backup on a real PostgreSQL of postgres-0's image family
        run: deploy/tests/crc-backup-test.sh
      - name: The test identities on a real OpenLDAP of the server's image, and mutants of the script
        run: deploy/tests/ldap-identities-test.sh
      - name: The sign-in script, on a stand-in for Keycloak's authorization code flow
        run: python deploy/tests/oidc-login-test.py
      - name: The realm on a real Keycloak and LDAP stand-in, beside other realms
        run: python deploy/tests/realm-test.py deploy/manifests/environments/crc/realm/10-realm-import.yaml
      - name: kubeconform on the manifests
        env:
          SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/102361970337d65537d40141dc29b991b8e95786/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json
          CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: kubeconform -strict -summary -skip Route -kubernetes-version 1.35.0 -schema-location "$SCHEMAS" -schema-location "$CRDS" deploy/manifests/components deploy/manifests/environments
      - name: render.sh fills the placeholders and refuses a tag
        env:
          SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/102361970337d65537d40141dc29b991b8e95786/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json
          CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          deploy/render.sh kind "ghcr.io/ephico2real2/cmapi@sha256:$(printf 'a%.0s' {1..64})" --portal-image "ghcr.io/ephico2real2/cmapi-portal@sha256:$(printf 'b%.0s' {1..64})" /tmp/rendered
          # An if, not "! grep": bash -e does not stop on a negated command, so that form could never fail the step.
          if grep -rn 'sha256:DIGEST' /tmp/rendered; then echo "a placeholder was left in the render"; exit 1; fi
          kubeconform -strict -summary -skip Route -kubernetes-version 1.35.0 -schema-location "$SCHEMAS" -schema-location "$CRDS" /tmp/rendered
          if deploy/render.sh kind localhost/cmapi:dev --portal-image localhost/cmapi-portal:dev /tmp/rendered-tag; then echo "a tag was accepted without --allow-tag"; exit 1; fi
          deploy/render.sh kind localhost/cmapi:dev --portal-image localhost/cmapi-portal:dev /tmp/rendered-tag --allow-tag
          # Everything the render must do and must not do, on a throwaway copy: exactly the placeholder, nothing else changed.
          deploy/render-test.sh
          deploy/render.sh crc "image-registry.openshift-image-registry.svc:5000/cmapi/cmapi@sha256:$(printf 'a%.0s' {1..64})" --portal-image "image-registry.openshift-image-registry.svc:5000/cmapi/cmapi-portal@sha256:$(printf 'b%.0s' {1..64})" /tmp/rendered-crc
          kubeconform -strict -summary -skip Route -kubernetes-version 1.35.0 -schema-location "$SCHEMAS" -schema-location "$CRDS" /tmp/rendered-crc
      - name: kind for the secrets cases
        run: |
          curl -fsSL --retry 5 -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/
          kind create cluster --name cmapi-ci --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --kubeconfig "$PWD/.ci.kubeconfig" --wait 120s
      - name: The secrets cases
        run: deploy/secrets-test.sh "kubectl --kubeconfig=$PWD/.ci.kubeconfig"
      - name: Who reaches the API port and the front door under the NetworkPolicies
        run: deploy/tests/np-reach-test.sh "$PWD/.ci.kubeconfig"
      - name: Delete the kind cluster
        if: ${{ !cancelled() }}
        run: kind delete cluster --name cmapi-ci --kubeconfig "$PWD/.ci.kubeconfig"
